{{/*
Chart-level prerequisite validations. This file renders nothing but fails fast
with a human-readable error when required dependencies are misconfigured.
*/}}
{{- if and .Values.hub.enabled (not .Values.pipelines.enabled) }}
{{- fail "hub.enabled=true requires pipelines.enabled=true (Kubeflow Hub shares KFP's MariaDB and mysql-secret)" }}
{{- end }}

{{- /*
  Reject a literal '*' as the gateway hostname. Leaving hostname empty already
  serves the wildcard '*' listener for IP/NodePort access; setting hostname: "*"
  additionally makes the auth-bypass filter trust every host, reinstating the
  auth bypass on an internet-facing named listener. Use "" for wildcard access.
  NOTE: values.schema.json (hostname `not: { pattern: "\\*" }`) is now the PRIMARY
  reject and fires before this template renders, so this fail() is normally
  unreachable. It is kept as defense-in-depth: it still catches '*' if the schema
  pattern is ever weakened or schema validation is skipped.
*/}}
{{- $kir := index .Values "kubeflow-istio-resources" }}
{{- if and $kir $kir.hostname (eq $kir.hostname "*") }}
{{- fail "kubeflow-istio-resources.hostname must not be '*'. Leave it empty (\"\") for wildcard / IP+NodePort access, or set a concrete FQDN to scope the gateway (and the auth bypass) to that host." }}
{{- end }}

{{- /*
  Enforce single source of truth for the inference domain.
  If the legacy sub-chart keys (knativeServing.domain or kserve.ingressDomain)
  are set to something other than the "example.com" default, but global.kserveDomain
  is not set, fail fast to prevent the dedicated kserve-ingress-gateway hosts
  (which fall back to *.example.com) from silently diverging and breaking readiness.
*/}}
{{- if not .Values.global.kserveDomain }}
{{- /*
      Use `dig` with a "" fallback rather than hasKey: Helm drops a key whose
      value is null, so `--set-json knativeServing.domain=null` (or a bare
      `domain:` in a values file) would make hasKey false and fall back to the
      "example.com" sentinel, bypassing this guard while the sub-chart actually
      renders an empty domain. Defaulting an absent key to "" matches what the
      sub-chart renders and still trips the `ne "example.com"` check below.
    */}}
{{-   $kd := printf "%v" (dig "domain" "" (.Values.knativeServing | default dict)) }}
{{-   $id := printf "%v" (dig "ingressDomain" "" (.Values.kserve | default dict)) }}
{{-   if or (ne $kd "example.com") (ne $id "example.com") }}
{{-     fail (printf "DIVERGENCE: knativeServing.domain is '%s' and kserve.ingressDomain is '%s' but global.kserveDomain is empty. When overriding the inference domain, you MUST set global.kserveDomain to the same value (e.g., --set global.kserveDomain=10.0.0.5.nip.io) so that the dedicated gateway's hosts stay in sync and route traffic." $kd $id) }}
{{-   end }}
{{- end }}

{{- /*
  KServe external HTTPS: the dedicated kserve-ingress-gateway wildcard cert only
  works if a real gateway hostname is set and the ACME challenge can issue a
  wildcard. These fail silently at runtime (readiness probe EOF / stuck cert
  order), so fail fast here.

  The companion knative/kserve settings (domainTemplate, urlScheme, ingressDomain)
  are auto-derived from global.kserveExternalHttps / global.kserveDomain via chart
  helpers, so the operator only needs the two globals plus a working TLS issuer —
  no more hand-aligned sub-chart knobs, and no guards for them.
*/}}
{{- if .Values.global.kserveExternalHttps }}
{{-   $kir := index .Values "kubeflow-istio-resources" }}
{{-   $tls := $kir.tls | default dict }}
{{-   $tlsSource := $tls.source | default "" }}
{{- /*
      Collect every unmet opt-in prerequisite and fail once with the full list.
    */}}
{{-   $errs := list }}
{{-   if not .Values.global.kserveDomain }}
{{-     $errs = append $errs "global.kserveDomain must be set (a scoped subdomain such as \"models.example.com\" is recommended over a bare org-wide domain) to use global.kserveExternalHttps — it is the base domain for the '*.<kserveDomain>' wildcard cert and inference hosts." }}
{{-   end }}
{{-   if not (and .Values.global.oauth2Proxy .Values.global.oauth2Proxy.enabled) }}
{{-     $errs = append $errs "global.oauth2Proxy.enabled must be true to use global.kserveExternalHttps — the bundled ext_authz auth chain (authn-filter EnvoyFilter) is only rendered when oauth2-proxy is enabled, so with it disabled the '*.<kserveDomain>:443' wildcard server would perform no gateway auth. Because every app VirtualService binds hosts: ['*'], that exposes the ENTIRE Kubeflow surface (not just inference) unauthenticated. If you front Kubeflow with your own IdP at the gateway, do not enable the bundled global.kserveExternalHttps opt-in." }}
{{-   end }}
{{-   if not $kir.hostname }}
{{-     $errs = append $errs "kubeflow-istio-resources.hostname must be set to use global.kserveExternalHttps — otherwise the gateway serves the '*' listener with the auth-bypass filter trusting every host, and the KServe wildcard server is refused." }}
{{-   end }}
{{-   if not (has $tlsSource (list "letsEncrypt" "selfSigned" "secret" "issuerRef")) }}
{{-     $errs = append $errs "kubeflow-istio-resources.tls.source must be one of {letsEncrypt, selfSigned, secret, issuerRef} to use global.kserveExternalHttps — with source \"\" there is no :443 server or wildcard cert, so advertised https:// inference URLs would be dead." }}
{{-   end }}
{{-   if and (eq $tlsSource "secret") (not $tls.kserveExistingSecret) }}
{{-     $errs = append $errs "kubeflow-istio-resources.tls.kserveExistingSecret must be set when tls.source is \"secret\" and global.kserveExternalHttps is true — the KServe wildcard server needs a Secret whose SAN covers \"*.<global.kserveDomain>\". Reusing the dashboard's tls.existingSecret silently fails the TLS handshake on inference hosts; point this at that Secret only if it is a multi-SAN/wildcard cert covering both hosts." }}
{{-   end }}
{{-   if eq $tlsSource "letsEncrypt" }}
{{- /* `| default dict`: an explicit tls.letsEncrypt: null otherwise nil-derefs
      on `.solver` with a raw Go panic instead of reaching this validation. */}}
{{-     $le := $tls.letsEncrypt | default dict }}
{{-     if eq $le.solver "http01" }}
{{-       $errs = append $errs "tls.letsEncrypt.solver must be a DNS-01 solver (e.g. cloudflare) — Let's Encrypt HTTP-01 cannot issue wildcard certificates." }}
{{-     else if eq ($le.solver | default "cloudflare") "cloudflare" }}
{{- /*
          A cloudflare DNS-01 solver with an unpopulated cloudflare block renders a
          bare "- dns01:" the ClusterIssuer can't use, so the wildcard order hangs.
        */}}
{{-       if not (and $tls.cloudflare $tls.cloudflare.apiTokenSecretRef $tls.cloudflare.apiTokenSecretRef.name) }}
{{-         $errs = append $errs "kubeflow-istio-resources.tls.cloudflare.apiTokenSecretRef.name must be set for the cloudflare DNS-01 solver — the token Secret must exist in cert-manager's namespace (see values.yaml)." }}
{{-       end }}
{{-     end }}
{{-   end }}
{{-   if $errs }}
{{-     fail (printf "global.kserveExternalHttps is true, but the external-HTTPS-for-inference opt-in is incomplete. Fix all of the following:\n  - %s" (join "\n  - " $errs)) }}
{{-   end }}
{{- end }}

{{- /*
  Migration guard: the per-subchart ingress-gateway identity knobs were removed
  and replaced by the single source of truth global.istio.ingressGateway.{principal,selector}
  (and the auth-mode knob moved to global.oauth2Proxy.gatewayAuthMode). The chart
  no longer reads the old keys, so an operator override file that still sets them
  would be SILENTLY IGNORED — the gateway/auth resources fall back to the Rancher
  default, surfacing later as "RBAC: access denied" or an unauthenticated gateway.
  values.schema.json does not forbid unknown keys, so catch them here and fail fast
  with the new location. (A null/unset legacy key is a no-op and does not trip this.)
*/}}
{{- $legacy := list }}
{{- $kir := index .Values "kubeflow-istio-resources" | default dict }}
{{- if hasKey $kir "istioGateway" }}
{{-   $legacy = append $legacy "kubeflow-istio-resources.istioGateway.selector -> global.istio.ingressGateway.selector" }}
{{- end }}
{{- $hubAp := (.Values.hub | default dict).authorizationPolicy | default dict }}
{{- if hasKey $hubAp "ingressGatewayPrincipal" }}
{{-   $legacy = append $legacy "hub.authorizationPolicy.ingressGatewayPrincipal -> global.istio.ingressGateway.principal" }}
{{- end }}
{{- $unIg := ((index .Values "user-namespace" | default dict).istio | default dict).ingressGateway | default dict }}
{{- if hasKey $unIg "principal" }}
{{-   $legacy = append $legacy "user-namespace.istio.ingressGateway.principal -> global.istio.ingressGateway.principal" }}
{{- end }}
{{- if $legacy }}
{{-   fail (printf "REMOVED VALUE KEY(S): these per-subchart ingress-gateway knobs were replaced by the single source of truth global.istio.ingressGateway and are no longer read by the chart. Leaving them in your overrides would silently have NO effect (the gateway identity would fall back to the Rancher default). Move each to its new location:\n  - %s" (join "\n  - " $legacy)) }}
{{- end }}

{{- /*
  Credential consistency: values.yaml copies auth.oidc.* and pipelines.seaweedfs.*
  into the Dex, oauth2-proxy and user-namespace values with YAML anchors. Anchors
  are resolved when values.yaml is parsed, so an override supplied with -f or --set
  changes only the source key and the copies keep the demo defaults. Fail if any
  copy the components actually use differs from its source.
*/}}
{{- $credErrs := list }}
{{- $clientSecret := .Values.auth.oidc.clientSecret | default "" }}
{{- $cookieSecret := .Values.auth.oidc.cookieSecret | default "" }}
{{- if and .Values.dex.enabled (not .Values.dex.existingOidcClientSecret) }}
{{-   if and .Values.dex.oidcClientSecret (ne .Values.dex.oidcClientSecret $clientSecret) }}
{{-     $credErrs = append $credErrs "dex.oidcClientSecret differs from auth.oidc.clientSecret" }}
{{-   end }}
{{-   range (.Values.dex.config.staticClients | default list) }}
{{-     if and (eq .id "kubeflow-oidc-authservice") (not .secretEnv) (ne (.secret | default "") $clientSecret) }}
{{-       $credErrs = append $credErrs "dex.config.staticClients[kubeflow-oidc-authservice].secret differs from auth.oidc.clientSecret" }}
{{-     end }}
{{-   end }}
{{- end }}
{{- $o2 := index .Values "oauth2-proxy" | default dict }}
{{- $o2cfg := $o2.config | default dict }}
{{- if and .Values.global.oauth2Proxy.enabled (not $o2cfg.existingSecret) }}
{{-   if ne ($o2cfg.clientSecret | default "") $clientSecret }}
{{-     $credErrs = append $credErrs "oauth2-proxy.config.clientSecret differs from auth.oidc.clientSecret" }}
{{-   end }}
{{-   if ne ($o2cfg.cookieSecret | default "") $cookieSecret }}
{{-     $credErrs = append $credErrs "oauth2-proxy.config.cookieSecret differs from auth.oidc.cookieSecret" }}
{{-   end }}
{{- end }}
{{- $uns := dig "pipelines" "seaweedfs" dict (index .Values "user-namespace" | default dict) }}
{{- if and .Values.pipelines.enabled .Values.pipelines.seaweedfs }}
{{-   if ne ($uns.accessKey | default "") (.Values.pipelines.seaweedfs.accessKey | default "") }}
{{-     $credErrs = append $credErrs "user-namespace.pipelines.seaweedfs.accessKey differs from pipelines.seaweedfs.accessKey" }}
{{-   end }}
{{-   if ne ($uns.secretKey | default "") (.Values.pipelines.seaweedfs.secretKey | default "") }}
{{-     $credErrs = append $credErrs "user-namespace.pipelines.seaweedfs.secretKey differs from pipelines.seaweedfs.secretKey" }}
{{-   end }}
{{- end }}
{{- /* oauth2-proxy refuses to start unless the cookie secret is 16, 24 or 32 bytes. It first
       strips trailing "=", decodes the rest as unpadded URL-safe base64 and uses the result if
       that is 16/24/32 bytes; otherwise it uses the raw string (encryption.SecretBytes). Mirror
       that here so a bad value fails at render time instead of crash-looping the pod. Note that
       standard base64 with "+" or "/" is NOT decoded by oauth2-proxy. */}}
{{- if and .Values.global.oauth2Proxy.enabled (not .Values.auth.oidc.existingSecret) }}
{{-   $trimmed := regexReplaceAll "=+$" $cookieSecret "" }}
{{-   $decLen := 0 }}
{{-   if and (regexMatch "^[A-Za-z0-9_-]+$" $trimmed) (ne (mod (len $trimmed) 4) 1) }}
{{-     $std := $trimmed | replace "-" "+" | replace "_" "/" }}
{{-     $std = printf "%s%s" $std (repeat (mod (sub 4 (mod (len $trimmed) 4)) 4 | int) "=") }}
{{-     $decLen = len (b64dec $std) }}
{{-   end }}
{{-   if not (or (has $decLen (list 16 24 32)) (has (len $cookieSecret) (list 16 24 32))) }}
{{-     fail "auth.oidc.cookieSecret must be 16, 24 or 32 bytes, raw or as URL-safe base64 (oauth2-proxy will not start otherwise).\nGenerate: openssl rand -base64 32 | tr -- '+/' '-_'" }}
{{-   end }}
{{- end }}

{{- if $credErrs }}
{{-   fail (printf "Credential mismatch. Values set with -f/--set do not follow the YAML anchors in values.yaml, so these copies still hold their old values. Set each one to the same value as its source (or use the existing-secret options):\n  - %s" (join "\n  - " $credErrs)) }}
{{- end }}

{{- /*
  Credential hygiene: fail fast if well-known demo defaults are still present
  and the operator has not explicitly opted in via global.demoMode=true.
*/}}
{{- if not .Values.global.demoMode }}

{{- /* With auth.oidc.existingSecret the operator supplies kubeflow-oidc-client and the
       auth.oidc secrets below are not used, so don't require changing them. */}}
{{- if and (not .Values.auth.oidc.existingSecret) (eq (.Values.auth.oidc.clientSecret | default "") "pUBnBOY80SnXgjibTYM9ZWNzY2xreNGQok") }}
{{- fail "SECURITY: auth.oidc.clientSecret is the well-known demo value.\nGenerate a real secret: openssl rand -hex 32\nOr for development only: set global.demoMode=true in your values." }}
{{- end }}

{{- if and (not .Values.auth.oidc.existingSecret) (eq (.Values.auth.oidc.cookieSecret | default "") "3GvvtL75w3Y8ERsQ9ma81nIngIx4YrjXNtQpCNDa4Vc=") }}
{{- fail "SECURITY: auth.oidc.cookieSecret is the well-known demo value.\nGenerate: openssl rand -base64 32 | tr -- '+/' '-_'\nOr for development only: set global.demoMode=true in your values." }}
{{- end }}

{{- if eq (.Values.pipelines.seaweedfs.accessKey | default "") "kubeflow" }}
{{- fail "SECURITY: pipelines.seaweedfs.accessKey is the well-known demo value.\nSet a real value or for development only: set global.demoMode=true in your values." }}
{{- end }}

{{- if eq (.Values.pipelines.seaweedfs.secretKey | default "") "kubeflow123" }}
{{- fail "SECURITY: pipelines.seaweedfs.secretKey is the well-known demo value.\nGenerate: openssl rand -hex 32\nOr for development only: set global.demoMode=true in your values." }}
{{- end }}

{{- end }}
