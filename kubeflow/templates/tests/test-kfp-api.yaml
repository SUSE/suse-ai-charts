apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-test-kfp-api"
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
    sidecar.istio.io/nativeSidecar: "true"
spec:
  restartPolicy: Never
  containers:
  - name: test
    image: "{{ include "kubeflow.suseApplicationCollectionRegistry" (dict "ctx" . "registry" .Values.testImages.busybox.registry) }}/{{ .Values.testImages.busybox.repository }}{{- if .Values.testImages.busybox.digest }}@{{ .Values.testImages.busybox.digest }}{{- else }}:{{ .Values.testImages.busybox.tag }}{{- end }}"
    command:
    - sh
    - -c
    - |
      wget -qO- --timeout=10 http://ml-pipeline.kubeflow.svc.cluster.local:8888/apis/v1beta1/healthz \
        && echo "KFP API healthy" \
        || (echo "KFP API health check failed" && exit 1)
