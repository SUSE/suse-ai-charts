{{- if and .Values.modelRegistry.enabled .Values.modelRegistry.controller.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-test-model-registry-controller"
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
    sidecar.istio.io/inject: "false"
spec:
  restartPolicy: Never
  containers:
  - name: test
    image: {{ include "kubeflow.image" (dict "registry" .Values.testImages.busybox.registry "repository" .Values.testImages.busybox.repository "tag" .Values.testImages.busybox.tag "Values" .Values) }}
    command:
    - sh
    - -c
    - |
      wget -qO- --timeout=10 \
        http://model-registry-controller-metrics.kubeflow.svc.cluster.local:8081/healthz \
        && echo "Model Registry Controller healthy" \
        || (echo "Model Registry Controller health check failed" && exit 1)
{{- end }}
