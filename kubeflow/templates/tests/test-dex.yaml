apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-test-dex"
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
    sidecar.istio.io/nativeSidecar: "true"
spec:
  restartPolicy: Never
  containers:
  - name: test
    image: "{{ include "kubeflow.suseApplicationCollectionRegistry" . }}/{{ .Values.testImages.busybox.repository }}{{- if .Values.testImages.busybox.digest }}@{{ .Values.testImages.busybox.digest }}{{- else }}:{{ .Values.testImages.busybox.tag }}{{- end }}"
    command:
    - sh
    - -c
    - |
      wget -qO- --timeout=10 \
        http://kubeflow-dex.kubeflow.svc.cluster.local:5556/dex/.well-known/openid-configuration \
        | grep -q '"issuer"' \
        && echo "Dex OIDC discovery endpoint healthy" \
        || (echo "Dex health check failed" && exit 1)
