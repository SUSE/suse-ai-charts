apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-test-seaweedfs"
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
    sidecar.istio.io/nativeSidecar: "true"
spec:
  restartPolicy: Never
  containers:
  - name: test
    image: {{ include "kubeflow.image" (dict "registry" .Values.testImages.busybox.registry "repository" .Values.testImages.busybox.repository "tag" .Values.testImages.busybox.tag "Values" .Values) }}
    command:
    - sh
    - -c
    - |
      wget -qO- --timeout=10 http://seaweedfs.kubeflow.svc.cluster.local:9333/cluster/status \
        | grep -q "IsLeader" \
        && echo "SeaweedFS healthy" \
        || (echo "SeaweedFS health check failed" && exit 1)
