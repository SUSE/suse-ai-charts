apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-test-central-dashboard"
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
    sidecar.istio.io/nativeSidecar: "true"
spec:
  restartPolicy: Never
  containers:
  - name: test
    image: "{{ include "kubeflow.suseApplicationCollectionRegistry" . }}/{{ .Values.testImages.busybox.repository }}{{- if .Values.testImages.busybox.digest }}@{{ .Values.testImages.busybox.digest }}{{- else }}:{{ .Values.testImages.busybox.tag }}{{- end }}"
    command:
    - sh
    - -c
    - |
      nc -zw 5 kubeflow-central-dashboard.kubeflow.svc.cluster.local 80 \
        && echo "Central Dashboard port reachable" \
        || (echo "Central Dashboard TCP check failed" && exit 1)
