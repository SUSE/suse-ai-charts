{{- if .Values.modelRegistry.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-test-model-registry-ui"
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
    sidecar.istio.io/nativeSidecar: "true"
spec:
  restartPolicy: Never
  containers:
  - name: test
    image: "{{ include "kubeflow.suseApplicationCollectionRegistry" (dict "ctx" . "registry" .Values.testImages.busybox.registry) }}/{{ .Values.testImages.busybox.repository }}{{- if .Values.testImages.busybox.digest }}@{{ .Values.testImages.busybox.digest }}{{- else }}:{{ .Values.testImages.busybox.tag }}{{- end }}"
    command:
    - sh
    - -c
    - |
      nc -zw 5 model-registry-ui-service.kubeflow.svc.cluster.local 8080 \
        && echo "Model Registry UI TCP ok" \
        || (echo "Model Registry UI TCP check failed" && exit 1)
{{- end }}
