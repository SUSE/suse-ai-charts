apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-test-profiles"
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
    sidecar.istio.io/nativeSidecar: "true"
spec:
  restartPolicy: Never
  containers:
  - name: test
    image: "{{ with (coalesce .Values.global.imageRegistry .Values.testImages.busybox.registry) }}{{ . }}/{{ end }}{{ .Values.testImages.busybox.repository }}{{- if .Values.testImages.busybox.digest }}@{{ .Values.testImages.busybox.digest }}{{- else }}:{{ .Values.testImages.busybox.tag }}{{- end }}"
    command:
    - sh
    - -c
    - |
      nc -zw 5 profiles-kfam.kubeflow.svc.cluster.local 8081 \
        && echo "Profiles controller port reachable" \
        || (echo "Profiles controller TCP check failed" && exit 1)
