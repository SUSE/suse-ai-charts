apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-test-profiles"
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
    sidecar.istio.io/inject: "false"
spec:
  restartPolicy: Never
  containers:
  - name: test
    image: {{ include "kubeflow.image" (dict "registry" .Values.testImages.busybox.registry "repository" .Values.testImages.busybox.repository "tag" .Values.testImages.busybox.tag "Values" .Values) }}
    command:
    - sh
    - -c
    - |
      nc -zw 5 profiles-kfam.kubeflow.svc.cluster.local 8081 \
        && echo "Profiles controller port reachable" \
        || (echo "Profiles controller TCP check failed" && exit 1)
