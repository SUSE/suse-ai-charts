{{- if .Values.externalSecrets.enabled }}
{{- range .Values.externalSecrets.imagePullSecrets.secrets }}
---
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: kubeflow-propagate-{{ .name }}
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
spec:
  {{- with $.Values.externalSecrets.extraNamespaces }}
  # Profile namespaces, or these namespaces by name (externalSecrets.extraNamespaces). An empty
  # namespaceSelector is left out: in the list it would match every namespace.
  {{- $selectors := list }}
  {{- if $.Values.externalSecrets.namespaceSelector }}{{ $selectors = append $selectors $.Values.externalSecrets.namespaceSelector }}{{ end }}
  {{- $selectors = append $selectors (dict "matchExpressions" (list (dict "key" "kubernetes.io/metadata.name" "operator" "In" "values" .))) }}
  namespaceSelectors:
    {{- toYaml $selectors | nindent 4 }}
  {{- else }}
  namespaceSelector:
    {{- toYaml $.Values.externalSecrets.namespaceSelector | nindent 4 }}
  {{- end }}
  refreshTime: {{ $.Values.externalSecrets.refreshInterval }}
  externalSecretSpec:
    refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
    secretStoreRef:
      name: kubeflow-registry-secrets
      kind: ClusterSecretStore
    target:
      name: {{ .name }}
      creationPolicy: Owner
      deletionPolicy: Delete
      template:
        type: kubernetes.io/dockerconfigjson
    data:
      - secretKey: .dockerconfigjson
        remoteRef:
          key: {{ .name }}
          property: .dockerconfigjson
{{- end }}
{{- end }}
