{{- if .Values.externalSecrets.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-kubeflow-reader
  namespace: {{ .Values.externalSecrets.imagePullSecrets.sourceNamespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-kubeflow-registry-reader
  namespace: {{ .Values.externalSecrets.imagePullSecrets.sourceNamespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames:
      {{- range .Values.externalSecrets.imagePullSecrets.secrets }}
      - {{ .name }}
      {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-kubeflow-registry-reader
  namespace: {{ .Values.externalSecrets.imagePullSecrets.sourceNamespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-kubeflow-registry-reader
subjects:
  - kind: ServiceAccount
    name: eso-kubeflow-reader
    namespace: {{ .Values.externalSecrets.imagePullSecrets.sourceNamespace }}
{{- end }}
