{{- /* Read by the default externaldns.env (CF_API_TOKEN). Always rendered, so upgrades keep it. */}}
{{- $dns := .Values.externaldns }}
{{- if and $dns.enabled (eq $dns.provider.name "cloudflare") $dns.cloudflare.apiToken }}
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  token: {{ $dns.cloudflare.apiToken | quote }}
{{- end }}
