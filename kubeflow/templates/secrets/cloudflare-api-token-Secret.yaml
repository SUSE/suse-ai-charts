{{- $dns := .Values.externalDns }}
{{- $token := $dns.cloudflare.apiToken | default "" }}
{{- if and $dns.enabled (eq $dns.provider.name "cloudflare") $token }}
{{- $existing := lookup "v1" "Secret" "kubeflow" "cloudflare-api-token" }}
{{- if not $existing }}
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  namespace: kubeflow
type: Opaque
stringData:
  token: {{ $token | quote }}
{{- end }}
{{- end }}
