{{- /*
  Single source of truth for the OIDC client credentials shared by Dex and
  oauth2-proxy. Both sub-charts read this Secret (oauth2-proxy via
  config.existingSecret, Dex via envVars + staticClients[].secretEnv), so values
  set in auth.oidc.* with -f/--set reach both. Empty values are generated. Set
  auth.oidc.existingSecret=true to supply a Secret with this name and these keys yourself
  (e.g. via External Secrets).
*/}}
{{- if and (or .Values.dex.enabled .Values.global.oauth2Proxy.enabled) (not .Values.auth.oidc.existingSecret) }}
{{- /* An empty clientSecret or cookieSecret takes the demo value with global.demoMode=true; otherwise it
       is generated on first install and kept on upgrade (lookup), and validations.yaml fails a render
       that can't see the cluster. The cookie secret is 32 random characters, which oauth2-proxy accepts
       as a raw 32-byte key. */}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace "kubeflow-oidc-client").data | default dict }}
{{- $demo := include "kubeflow.demoCredentials" . | fromYaml }}
{{- $clientSecret := .Values.auth.oidc.clientSecret | default (ternary $demo.clientSecret "" (.Values.global.demoMode | default false)) | default (index $existing "client-secret" | default "" | b64dec) | default (randAlphaNum 32) }}
{{- $cookieSecret := .Values.auth.oidc.cookieSecret | default (ternary $demo.cookieSecret "" (.Values.global.demoMode | default false)) | default (index $existing "cookie-secret" | default "" | b64dec) | default (randAlphaNum 32) }}
apiVersion: v1
kind: Secret
metadata:
  # Fixed name: dex.envVars and oauth2-proxy.config.existingSecret reference it literally.
  name: kubeflow-oidc-client
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kubeflow-oidc-client
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  # Fixed: Dex registers this id as a literal (dex.config.staticClients), so it is not configurable.
  client-id: "kubeflow-oidc-authservice"
  client-secret: {{ $clientSecret | quote }}
  cookie-secret: {{ $cookieSecret | quote }}
{{- end }}
