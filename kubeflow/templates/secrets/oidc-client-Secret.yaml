{{- /*
  Single source of truth for the OIDC client credentials shared by Dex and
  oauth2-proxy. Both sub-charts read this Secret (oauth2-proxy via
  config.existingSecret, Dex via envVars + staticClients[].secretEnv), so values
  set in auth.oidc.* with -f/--set reach both. Set auth.oidc.existingSecret=true
  to supply a Secret with this name and these keys yourself (e.g. via External Secrets).
*/}}
{{- if and (or .Values.dex.enabled .Values.global.oauth2Proxy.enabled) (not .Values.auth.oidc.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  # Fixed name: dex.envVars and oauth2-proxy.config.existingSecret reference it literally.
  name: kubeflow-oidc-client
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kubeflow-oidc-client
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  client-id: {{ .Values.auth.oidc.clientId | quote }}
  client-secret: {{ required "auth.oidc.clientSecret is required" .Values.auth.oidc.clientSecret | quote }}
  cookie-secret: {{ required "auth.oidc.cookieSecret is required" .Values.auth.oidc.cookieSecret | quote }}
{{- end }}
