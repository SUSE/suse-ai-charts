{{- /*
  The initial Dex user's password hash, read by Dex through dex.envVars and
  dex.config.staticPasswords[].hashFromEnv, so auth.initialUser.passwordHash set with -f/--set
  reaches Dex. An empty passwordHash takes the demo password with global.demoMode=true; otherwise a
  random password is generated on first install, stored in the password key for the first login and kept
  on upgrade (lookup); validations.yaml fails a render that can't see the cluster. Removing the password
  key afterwards is safe: the hash is kept. Rendered whenever Dex is
  enabled (its env var references this Secret), but holds no password when an external identity
  provider replaces Dex's password login (kubeflow.dexPasswordLogin).
*/}}
{{- if .Values.dex.enabled }}
{{- $hash := "" }}
{{- $password := "" }}
{{- if include "kubeflow.dexPasswordLogin" . }}
{{-   $hash = .Values.auth.initialUser.passwordHash | default "" }}
{{-   if and (not $hash) .Values.global.demoMode }}
{{-     $hash = (include "kubeflow.demoCredentials" . | fromYaml).passwordHash }}
{{-   end }}
{{-   if not $hash }}
{{-     $existing := (lookup "v1" "Secret" .Release.Namespace "kubeflow-initial-user").data | default dict }}
{{-     $password = index $existing "password" | default "" | b64dec }}
{{-     $hash = index $existing "hash" | default "" | b64dec }}
{{- /* Keep the hash even without the password key: admins may remove the plaintext after first login. */}}
{{-     if not $hash }}
{{-       $password = randAlphaNum 20 }}
{{-       $hash = bcrypt $password }}
{{-     end }}
{{-   end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  # Fixed name: dex.envVars references it literally.
  name: kubeflow-initial-user
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kubeflow-initial-user
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
{{- /* data, not stringData: with server-side apply only fields under data are owned, so dropping
       password (after an own passwordHash is set) removes it from the live Secret. */}}
data:
  email: {{ .Values.auth.initialUser.email | b64enc | quote }}
  hash: {{ $hash | b64enc | quote }}
  {{- if $password }}
  password: {{ $password | b64enc | quote }}
  {{- end }}
{{- end }}
