{{- if .Values.global.kserveExternalHttps }}
{{- $kir := index .Values "kubeflow-istio-resources" }}
{{- $tls := $kir.tls | default dict }}
{{- $tlsSource := $tls.source | default "" }}
{{- if and $tlsSource (ne $tlsSource "secret") }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kserve-wildcard-tls
  namespace: istio-system
spec:
  {{- /* Wildcard covering KServe inference hosts so the dedicated
         kserve-ingress-gateway can terminate TLS for them. Requires a DNS-01
         solver. */}}
  commonName: {{ printf "*.%s" .Values.global.kserveDomain | quote }}
  secretName: kserve-wildcard-tls
  privateKey:
    rotationPolicy: Always
  issuerRef:
{{- if eq $tlsSource "selfSigned" }}
    name: {{ $tls.issuer | default "kubeflow-selfsigned" | quote }}
    kind: Issuer
{{- else if eq $tlsSource "letsEncrypt" }}
    name: {{ $tls.issuer | default "kubeflow-letsencrypt" | quote }}
    kind: ClusterIssuer
{{- else }}
{{- if not (and $tls.issuerRef $tls.issuerRef.name) }}
{{- fail "kubeflow-istio-resources.tls.issuerRef.name is required when tls.source is \"issuerRef\"" }}
{{- end }}
    name: {{ $tls.issuerRef.name | quote }}
    kind: {{ $tls.issuerRef.kind | default "ClusterIssuer" | quote }}
{{- end }}
  dnsNames:
  - {{ printf "*.%s" .Values.global.kserveDomain | quote }}
{{- end }}
{{- end }}
