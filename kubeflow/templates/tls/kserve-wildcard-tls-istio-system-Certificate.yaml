{{- if dig "kserve" "externalHttps" false (.Values.global | default dict) }}
{{- $g := .Values.global | default dict }}
{{- $ks := $g.kserve | default dict }}
{{- if include "kubeflow.certManagerTls" . }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kserve-wildcard-tls
  namespace: istio-system
spec:
  {{- /* Wildcard covering KServe inference hosts so the dedicated
         kserve-ingress-gateway can terminate TLS for them. Requires a DNS-01
         solver. */}}
  commonName: {{ printf "*.%s" $ks.domain | quote }}
  secretName: {{ dig "tls" "secretName" "" $ks | default "kserve-wildcard-tls" }}
  privateKey:
    rotationPolicy: Always
  issuerRef:
    {{- include "kubeflow.certIssuerRef" . | nindent 4 }}
  dnsNames:
  - {{ printf "*.%s" $ks.domain | quote }}
{{- end }}
{{- end }}
