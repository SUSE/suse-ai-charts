{{- $g := .Values.global | default dict }}
{{- $tls := $g.tls | default dict }}
{{- if include "kubeflow.certManagerTls" . }}
{{- $host := dig "gateway" "hostname" "" $g | default "kubeflow.local" }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kubeflow-gateway-tls
  namespace: istio-system
spec:
  commonName: {{ $host | quote }}
  secretName: {{ $tls.secretName | default "kubeflow-gateway-tls" | quote }}
  privateKey:
    rotationPolicy: Always
  issuerRef:
    {{- include "kubeflow.certIssuerRef" . | nindent 4 }}
  dnsNames:
  - {{ $host | quote }}
{{- end }}
