# Pre-upgrade hook: delete training-operator-webhook-cert if it has type
# kubernetes.io/tls so Helm can recreate it as Opaque.
# Kubernetes Secret types are immutable; without this the upgrade fails with
# "field is immutable" when moving from the old placeholder Secret to the
# training-operator-managed Opaque Secret.
# The job is a no-op on fresh installs and on clusters already migrated.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: training-webhook-secret-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: training-webhook-secret-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
- apiGroups: [""]
  resources: [secrets]
  resourceNames: [training-operator-webhook-cert]
  verbs: [get, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: training-webhook-secret-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: training-webhook-secret-migrate
subjects:
- kind: ServiceAccount
  name: training-webhook-secret-migrate
  namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: training-webhook-secret-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: training-webhook-secret-migrate
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- include "kubeflow.imagePullSecrets" . | nindent 6 }}
      containers:
      - name: migrate
        image: {{ include "kubeflow.image" .Values.preflightChecks.image }}
        imagePullPolicy: {{ .Values.preflightChecks.image.pullPolicy }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          readOnlyRootFilesystem: true
        command:
        - /bin/sh
        - -ec
        - |
          SECRET=training-operator-webhook-cert
          NS={{ .Release.Namespace }}
          TYPE=$(kubectl get secret "$SECRET" -n "$NS" \
            -o jsonpath='{.type}' 2>/dev/null || echo "")
          if [ "$TYPE" = "kubernetes.io/tls" ]; then
            echo "Secret $SECRET has type kubernetes.io/tls — deleting so Helm can recreate it as Opaque."
            kubectl delete secret "$SECRET" -n "$NS"
            echo "Deleted."
          else
            echo "Secret $SECRET type is '${TYPE:-<not found>}' — no migration needed."
          fi
