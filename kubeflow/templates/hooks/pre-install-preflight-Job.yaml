{{- if .Values.preflightChecks.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: kubeflow-preflight
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: kubeflow-preflight
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- include "kubeflow.imagePullSecrets" . | nindent 6 }}
      containers:
      - name: preflight
        image: {{ include "kubeflow.image" .Values.preflightChecks.image }}
        imagePullPolicy: {{ .Values.preflightChecks.image.pullPolicy }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          readOnlyRootFilesystem: true
        command:
        - /bin/sh
        - -ec
        - |
          echo "=== Kubeflow Preflight Checks ==="

          # Check 1: default StorageClass exists
          echo "Check 1: Default StorageClass..."
          DEFAULT_SC=$(kubectl get storageclass -o jsonpath='{range .items[*]}{.metadata.annotations.storageclass\.kubernetes\.io/is-default-class}{"\t"}{.metadata.name}{"\n"}{end}' | grep '^true' | awk '{print $2}' | head -1)
          if [ -z "$DEFAULT_SC" ]; then
            echo "PREFLIGHT FAILED: No default StorageClass found."
            echo "  Create one or set global.storageClass in your values."
            exit 1
          fi
          echo "  Default StorageClass: $DEFAULT_SC — OK"

          # Check 2: cert-manager is available (CRD check)
          echo "Check 2: cert-manager CRDs..."
          if ! kubectl get crd certificates.cert-manager.io > /dev/null 2>&1; then
            echo "PREFLIGHT FAILED: cert-manager CRDs not found."
            echo "  Install cert-manager before running helm install kubeflow."
            exit 1
          fi
          echo "  cert-manager CRDs present — OK"

          echo "=== PREFLIGHT: OK ==="
{{- end }}
