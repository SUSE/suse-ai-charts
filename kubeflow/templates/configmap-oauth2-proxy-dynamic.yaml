{{- if .Values.global.oauth2Proxy.enabled }}
{{- $tlsSource := include "kubeflow.tlsSource" . }}
{{- /* The session cookie (oauth2-proxy) and the web apps' CSRF cookie are Secure exactly when the
       gateway serves HTTPS: browsers drop Secure cookies on plain HTTP. */}}
{{- $secure := ternary "true" "false" (or .Values.global.kserveExternalHttps (ne $tlsSource "")) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: oauth2-proxy-dynamic-config
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/component: oauth2-proxy
data:
  cookie-secure: {{ $secure | quote }}
  # Read by the Jupyter, Volumes and TensorBoards web apps (APP_SECURE_COOKIES).
  app-secure-cookies: {{ $secure | quote }}
{{- end }}
