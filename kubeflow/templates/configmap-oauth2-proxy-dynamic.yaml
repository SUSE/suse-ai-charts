{{- if .Values.global.oauth2Proxy.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: oauth2-proxy-dynamic-config
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/component: oauth2-proxy
data:
  {{- /* The session cookie is Secure exactly when users browse over HTTPS (any global.tls.source,
         including edge); browsers drop Secure cookies on plain HTTP. The web apps' CSRF cookie
         follows the same rule from global.tls.source directly. */}}
  cookie-secure: {{ ternary "true" "false" (eq (include "kubeflow.publicHttps" .) "true") | quote }}
{{- end }}
