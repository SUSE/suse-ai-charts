# Tutorial — Part 7a: KServe S3 Credentials (SeaweedFS)
# =======================================================
# Creates:
#   1. kserve-s3-secret  — S3-compatible credentials pointing at the
#                          in-cluster SeaweedFS service.
#   2. kserve-sa         — ServiceAccount that attaches the secret so
#                          KServe's storage-initializer can download
#                          the model from SeaweedFS.
#
# Apply
# -----
#   kubectl apply -f kserve-s3-secret.yaml
#
# Verify
# ------
#   kubectl get secret kserve-s3-secret -n kubeflow-user-example-com
#   kubectl get sa    kserve-sa          -n kubeflow-user-example-com
#
# Notes
# -----
# • The annotations on the Secret tell the storage-initializer which
#   endpoint to use and that plain HTTP is fine (s3-usehttps: "0").
# • Change accesskey / secretkey if you have customised SeaweedFS credentials
#   (defaults are kubeflow / kubeflow123 as set in charts/kubeflow/values.yaml).
# • To use a different namespace change both `namespace:` fields.

---
apiVersion: v1
kind: Secret
metadata:
  name: kserve-s3-secret
  namespace: kubeflow-user-example-com
  annotations:
    # Tell KServe's storage-initializer where SeaweedFS lives and how to reach it
    serving.kserve.io/s3-endpoint:            "seaweedfs.kubeflow:9000"
    serving.kserve.io/s3-usehttps:            "0"         # plain HTTP
    serving.kserve.io/s3-region:              "us-east-1" # any string works for SeaweedFS
    serving.kserve.io/s3-useanoncredential:   "false"
type: Opaque
stringData:
  # Default SeaweedFS credentials — update if yours differ
  AWS_ACCESS_KEY_ID:     kubeflow
  AWS_SECRET_ACCESS_KEY: kubeflow123

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kserve-sa
  namespace: kubeflow-user-example-com
imagePullSecrets:
- name: suse-ai-registry
secrets:
- name: kserve-s3-secret
