# Tutorial — Appendix D: PyTorchJob with GPU (NCCL backend)
# ==========================================================
# Identical workload to Part 6's pytorch_mnist_job.yaml but:
#   - Requests 1 NVIDIA GPU per replica
#   - Uses the NCCL communication backend (GPU-to-GPU NVLink / PCIe)
#   - Uses a CUDA-enabled PyTorch image
#
# Prerequisites
# -------------
#   At least one node must have the nvidia.com/gpu resource (NVIDIA device plugin).
#   Verify:
#     kubectl get nodes -o custom-columns="NODE:.metadata.name,GPUs:.status.allocatable.nvidia\.com/gpu"
#
# Apply
# -----
#   kubectl apply -f pytorch_mnist_gpu_job.yaml
#
# Monitor
# -------
#   kubectl get pytorchjob pytorch-mnist-gpu -n kubeflow-user-example-com
#   kubectl logs -n kubeflow-user-example-com \
#       $(kubectl get pods -n kubeflow-user-example-com \
#         -l training.kubeflow.org/job-name=pytorch-mnist-gpu,\
#            training.kubeflow.org/replica-type=master \
#         -o name | head -1) -f
#
# Clean up
# --------
#   kubectl delete pytorchjob pytorch-mnist-gpu -n kubeflow-user-example-com

apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: pytorch-mnist-gpu
  namespace: kubeflow-user-example-com
spec:
  pytorchReplicaSpecs:

    Master:
      replicas: 1
      restartPolicy: OnFailure
      template:
        spec:
          imagePullSecrets:
          - name: suse-ai-registry
          containers:
          - name: pytorch
            image: stgregistry.suse.com/ai/containers/pytorch:2.11.0-cuda12.8-cudnn9-runtime
            imagePullPolicy: IfNotPresent
            command:
            - python3
            - -c
            - |
              import os, torch, torch.distributed as dist
              import torch.nn as nn
              from torchvision import datasets, transforms
              from torch.utils.data import DataLoader

              dist.init_process_group(backend="nccl")
              rank  = dist.get_rank()
              world = dist.get_world_size()
              device = torch.device(f"cuda:{rank % torch.cuda.device_count()}")

              transform = transforms.Compose([transforms.ToTensor(),
                                              transforms.Normalize((0.1307,), (0.3081,))])
              dataset = datasets.MNIST('/tmp/data', train=True, download=True, transform=transform)
              sampler = torch.utils.data.distributed.DistributedSampler(
                  dataset, num_replicas=world, rank=rank)
              loader  = DataLoader(dataset, batch_size=64, sampler=sampler)

              model = nn.Sequential(
                  nn.Flatten(),
                  nn.Linear(784, 256), nn.ReLU(),
                  nn.Linear(256, 10)
              ).to(device)
              model = nn.parallel.DistributedDataParallel(model, device_ids=[rank % torch.cuda.device_count()])

              opt = torch.optim.Adam(model.parameters())
              for epoch in range(1, 4):
                  sampler.set_epoch(epoch)
                  model.train()
                  for batch_idx, (data, target) in enumerate(loader):
                      data, target = data.to(device), target.to(device)
                      opt.zero_grad()
                      loss = nn.CrossEntropyLoss()(model(data), target)
                      loss.backward()
                      opt.step()
                      if rank == 0 and batch_idx % 100 == 0:
                          print(f"Epoch {epoch} [{batch_idx*64}/{len(dataset)}]  Loss: {loss.item():.4f}")
              if rank == 0:
                  print("Training complete.")
            resources:
              requests:
                cpu: "1"
                memory: 2Gi
                nvidia.com/gpu: "1"
              limits:
                cpu: "4"
                memory: 8Gi
                nvidia.com/gpu: "1"

    Worker:
      replicas: 1
      restartPolicy: OnFailure
      template:
        spec:
          imagePullSecrets:
          - name: suse-ai-registry
          containers:
          - name: pytorch
            image: stgregistry.suse.com/ai/containers/pytorch:2.11.0-cuda12.8-cudnn9-runtime
            imagePullPolicy: IfNotPresent
            command:
            - python3
            - -c
            - |
              import os, torch, torch.distributed as dist
              import torch.nn as nn
              from torchvision import datasets, transforms
              from torch.utils.data import DataLoader

              dist.init_process_group(backend="nccl")
              rank  = dist.get_rank()
              world = dist.get_world_size()
              device = torch.device(f"cuda:{rank % torch.cuda.device_count()}")

              transform = transforms.Compose([transforms.ToTensor(),
                                              transforms.Normalize((0.1307,), (0.3081,))])
              dataset = datasets.MNIST('/tmp/data', train=True, download=True, transform=transform)
              sampler = torch.utils.data.distributed.DistributedSampler(
                  dataset, num_replicas=world, rank=rank)
              loader  = DataLoader(dataset, batch_size=64, sampler=sampler)

              model = nn.Sequential(
                  nn.Flatten(),
                  nn.Linear(784, 256), nn.ReLU(),
                  nn.Linear(256, 10)
              ).to(device)
              model = nn.parallel.DistributedDataParallel(model, device_ids=[rank % torch.cuda.device_count()])

              opt = torch.optim.Adam(model.parameters())
              for epoch in range(1, 4):
                  sampler.set_epoch(epoch)
                  model.train()
                  for batch_idx, (data, target) in enumerate(loader):
                      data, target = data.to(device), target.to(device)
                      opt.zero_grad()
                      loss = nn.CrossEntropyLoss()(model(data), target)
                      loss.backward()
                      opt.step()
            resources:
              requests:
                cpu: "1"
                memory: 2Gi
                nvidia.com/gpu: "1"
              limits:
                cpu: "4"
                memory: 8Gi
                nvidia.com/gpu: "1"
