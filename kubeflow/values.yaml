# --- Kubeflow Istio Resources ---
kubeflow-istio-resources:
  # Hostname for the Kubeflow web UI (e.g. kubeflow.example.com).
  # Leave empty for wildcard / IP+NodePort access.
  # Independent of TLS — a named hostname works over plain HTTP.
  hostname: ""                        # CHANGE: set to your FQDN

  # Indicate whether external-dns is enabled and that a DNS records shall be
  # created for the given hostname. If hostname is not specified or have an
  # empty value. Enabling external-dns has no effect.
  externalDNSEnabled: false

  tls:
    source: ""          # "" | "selfSigned" | "letsEncrypt" | "secret" | "issuerRef"
    issuer: ""          # Override ClusterIssuer name; auto-set to kubeflow-letsencrypt when source=letsEncrypt
    existingSecret: ""  # Pre-existing Secret in istio-system (source: secret)
    # Pre-existing Secret for the KServe wildcard server (source: secret +
    # global.kserveExternalHttps). SAN MUST cover "*.<global.kserveDomain>".
    # Reuse existingSecret here only if it is a multi-SAN/wildcard cert covering
    # both the dashboard host and the wildcard; otherwise inference-host TLS
    # handshakes fail. Required by chart validation in that mode.
    kserveExistingSecret: ""
    credentialName: kubeflow-gateway-tls
    httpsRedirect: true
    # Let's Encrypt ACME configuration (used when source: letsEncrypt).
    # The chart creates a `kubeflow-letsencrypt` ClusterIssuer automatically —
    # no manual kubectl steps required.
    letsEncrypt:
      email: ""               # Optional (recommended): ACME account email for expiry
                              # notices (e.g. admin@example.com). Let's Encrypt issues
                              # without it; when empty the ClusterIssuer omits the field.
      server: prod            # prod | staging
      solver: cloudflare      # cloudflare (dns01, requires externalDns.cloudflare.apiToken) | http01

    # If solver is cloudflare, you MUST configure the cloudflare block below
    # (chart validation fails fast if it is missing when global.kserveExternalHttps
    # is set with source: letsEncrypt + solver: cloudflare). Make sure the
    # apiTokenSecretRef is correctly configured with the name and key values. The
    # email field must contain the valid email you registered with Cloudflare.
    #
    # NOTE: the Secret referenced by apiTokenSecretRef must exist in cert-manager's
    # own namespace (typically `cert-manager`) — a ClusterIssuer resolves DNS-01
    # solver secretRefs there, NOT in the release namespace. This is a DIFFERENT
    # Secret from the chart-managed `cloudflare-api-token` (kubeflow namespace) used
    # by external-dns; create/copy the token Secret into cert-manager's namespace.
    #
    # TOKEN SCOPE: the Cloudflare API token needs Zone > DNS > Edit on the zone(s)
    # containing kserveDomain / the dashboard host (plus Zone > Zone > Read, which
    # cert-manager uses to discover the zone). Scope it to those specific zones, not
    # "All zones", to bound the blast radius if the Secret leaks.
    #
    # cloudflare:
    #   email: your-email@example.com
    #   apiTokenSecretRef:
    #     name: cloudflare-api-token-secret
    #     key: api-token

    # If you are using an existing cluster issuer (i.e. by setting source to
    # "issuerRef" above), you must fill in the issuerRef section.
    # NOTE: the existing issuer must be a "clusterissuer".
    #
    # issuerRef:
    #   name: <name of the existing cluster issuer>

# --- External DNS (optional) ---
# Automatically creates/updates DNS records for kubeflow-istio-resources.hostname.
# Watches the kubeflow-gateway Istio Gateway resource for the hostname.
externaldns:
  enabled: false

# see https://github.com/kubernetes-sigs/external-dns/tree/master/charts/external-dns
# for more information

  provider:
    name: cloudflare   # cloudflare | aws | azure | google | etc.

  # Cloudflare API token. When set (and provider.name=cloudflare), the chart:
  #   1. Creates a chart-managed `cloudflare-api-token` Secret in the kubeflow namespace.
  #   2. Auto-injects CF_API_TOKEN into the external-dns pod (via the bitnami chart's
  #      cloudflare.apiToken support — no manual env block needed).
  #   3. Reuses the same Secret for the `kubeflow-letsencrypt` ClusterIssuer when
  #      tls.source: letsEncrypt and tls.letsEncrypt.solver: cloudflare.
  cloudflare:
    apiToken: ""   # Set to your Cloudflare API token — chart manages the Secret

  # Limit DNS management to this domain (strongly recommended).
  domainFilters: []

  # Unique TXT record owner ID — prevents conflicts in shared clusters.
  txtOwnerId: "kubeflow"

  # istio-gateway: reads hostnames directly from Istio Gateway resources.
  sources:
    - istio-gateway

  # Advanced: extra provider env vars appended after auto-wired vars.
  # Cloudflare: not needed — set cloudflare.apiToken above instead.
  # AWS Route53 (with pod IAM role — no env vars needed):
  #   env: []
  # Other provider example:
  #   env:
  #     - name: SOME_PROVIDER_TOKEN
  #       valueFrom:
  #         secretKeyRef:
  #           name: my-provider-secret
  #           key: token
  env: []

# --- Kubeflow Namespace ---
# kubeflow-namespace:
#   namespace:
#     labels: {}
#     annotations: {}

# --- User Namespace ---
user-namespace:
  # Additional user profiles. Each entry creates a Profile CR and deploys all
  # KFP per-namespace resources (artifact server, viz server, credentials,
  # authorization policies) in the user's namespace.
  #
  # Example:
  #   additionalUsers:
  #     - email: alice@example.com
  #       namespace: alice        # explicit name recommended
  #     - email: bob@example.com
  #       namespace: bob
  additionalUsers: []

  # KFP per-namespace resources — credentials must match pipelines.seaweedfs above.
  pipelines:
    seaweedfs:
      accessKey: *seaweedfsAccessKey
      secretKey: *seaweedfsSecretKey
    visualizationServer:
      registry: registry.suse.com
      repository: ai/containers/kubeflow/kfp-visualization-server
      tag: "2.17.0"
    frontend:
      registry: registry.suse.com
      repository: ai/containers/kubeflow/kfp-frontend
      tag: "2.17.0"

# Test images for Helm hook test Pods.
# These are used in charts/kubeflow/templates/tests/ for connectivity checks.
testImages:
  # Default bci-busybox image for basic connectivity tests
  busybox:
    registry: dp.apps.rancher.io
    repository: containers/bci-busybox
    tag: "15.7"
    pullPolicy: IfNotPresent
  # MariaDB client for database connectivity tests
  mariadb:
    registry: dp.apps.rancher.io
    repository: containers/mariadb
    tag: "11.8.8-10.1"
    pullPolicy: IfNotPresent
  # kubectl for Kubernetes API tests
  kubectl:
    registry: dp.apps.rancher.io
    repository: containers/kubectl
    tag: "1.34.5"
    pullPolicy: IfNotPresent

