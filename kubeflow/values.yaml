# Default values for Kubeflow umbrella chart
# This is a YAML-formatted file.
#
# Prerequisites:
#   1. Create required namespaces:
#      kubectl create namespace cert-manager
#      kubectl create namespace istio-system
#      kubectl create namespace kubeflow
#
#   2. Create image pull secret in each namespace (for Rancher registry):
#      for ns in cert-manager istio-system kubeflow knative-serving; do
#        kubectl create secret docker-registry application-collection \
#          --docker-server=dp.apps.rancher.io \
#          --docker-username=<username> \
#          --docker-password=<token> \
#          -n $ns
#      done
#
#   3. Label kubeflow namespace for Helm:
#      kubectl label namespace kubeflow app.kubernetes.io/managed-by=Helm
#      kubectl annotate namespace kubeflow meta.helm.sh/release-name=kubeflow meta.helm.sh/release-namespace=kubeflow
#
#   4. Install cert-manager (required):
#      helm install cert-manager oci://dp.apps.rancher.io/charts/cert-manager \
#        --version 1.20.2 \
#        --namespace cert-manager \
#        --set crds.enabled=true \
#        --set crds.keep=true \
#        --set global.imagePullSecrets[0].name=application-collection
#
#   5. Install Istio (required):
#      helm install istio oci://dp.apps.rancher.io/charts/istio \
#        --version 1.1.3 \
#        --namespace istio-system \
#        --set global.imagePullSecrets[0].name=application-collection \
#        --set gateway.enabled=true
#
#   6. Create suse.com registry pull secret in static namespaces only:
#      for ns in cert-manager istio-system kubeflow knative-serving; do
#        kubectl create secret docker-registry suse-ai-registry \
#          --docker-server=registry.suse.com \
#          --docker-username=<username> \
#          --docker-password=<token> \
#          -n $ns
#      done
#      NOTE: User namespaces are handled automatically by ESO (externalSecrets.enabled=true).
#
#   7. Ensure storage provisioner (K3s/RKE2 clusters):
#      # Option A: Local Path Provisioner (development/testing)
#      kubectl apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.26/deploy/local-path-storage.yaml
#      kubectl patch storageclass local-path -p '{"metadata": {"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'
#
#      # Option B: Longhorn (production)
#      helm install longhorn oci://dp.apps.rancher.io/charts/longhorn \
#        --namespace longhorn-system --create-namespace \
#        --set defaultSettings.defaultDataPath="/var/lib/longhorn" \
#        --set persistence.defaultClassReplicaCount=1
#
#      Note: Delete any AWS-specific storage classes (e.g., gp2) before installing:
#      kubectl delete storageclass gp2
#
# Installation (from project root):
#   helm install kubeflow ./charts/kubeflow -n kubeflow
#
# Or from charts/kubeflow directory:
#   helm install kubeflow . -n kubeflow
#
# Access:
#   kubectl port-forward svc/istio -n istio-system 8080:80
#   Open http://localhost:8080
#
# Default credentials:
#   Email: user@example.com
#   Password: 12341234

# Global configuration applied to all sub-charts
global:
  # Storage class for PVCs (leave empty for cluster default)
  storageClass: ""

  # Image pull policy
  imagePullPolicy: IfNotPresent

  # Common labels applied to all resources
  labels: {}

  # Image pull secrets applied to every Deployment/StatefulSet in all sub-charts.
  # Third-party Bitnami-style sub-charts (mariadb) read this automatically.
  # Custom sub-chart templates reference .Values.global.imagePullSecrets directly.
  # Argo workflow executor pods are covered separately via workflowDefaults in
  # the workflow-controller-configmap (that configmap is rendered at pod-create time,
  # not Helm time, so it cannot use Helm values).
  imagePullSecrets:
    - name: application-collection
    - name: suse-ai-registry

  # Private/air-gapped registry prefix.
  # When set, sub-chart image helpers will prepend this value to all image references.
  # Example (Rancher registry mirror): dp.apps.rancher.io/containers
  # Example (air-gapped mirror):       my-registry.corp.com/kubeflow
  # Leave empty to use the default registry specified in each sub-chart's values.
  imageRegistry: ""

  # SUSE AI registry OVERRIDE for all SUSE AI images (registry.suse.com/ai/containers/*).
  # Leave empty (default) to use each component's own image.registry value.
  # When set, overrides every SUSE component's image.registry (e.g. "stgregistry.suse.com"
  # for QA against staging). SUSE Application Collection images are unaffected.
  # Precedence: global.imageRegistry > global.suseRegistry > component image.registry
  suseRegistry: ""

  # -- Application Collection registry OVERRIDE for all App Collection images
  # (dp.apps.rancher.io/containers/* that are wired through the chart's helpers).
  # Leave empty (default) to use each component's own image.registry value.
  # When set, overrides every App Collection component's image.registry.
  # Precedence: global.imageRegistry > global.suseApplicationCollectionRegistry > component image.registry
  suseApplicationCollectionRegistry: ""

  # Demo mode: set true ONLY for local development/tutorial.
  # When false (default), Helm fails at render time if any credential is a known demo default.
  # NEVER set true in production.
  demoMode: false

  # oauth2-proxy enablement
  oauth2Proxy:
    enabled: true

  gateway:
    name: "kubeflow/kubeflow-gateway"

  # Dedicated Istio Gateway ("<namespace>/<name>") for KServe/Knative inference.
  # Single source of truth consumed by three subcharts:
  #   - kubeflow-istio-resources renders the Gateway of this name/namespace
  #   - knative-serving  config-istio       key "gateway.<namespace>.<name>"
  #   - kserve           inferenceservice-config "ingressGateway"
  # Kept separate from global.gateway.name (the dashboard gateway) so the Knative
  # net-istio readiness prober only ever probes this gateway's ports, independent
  # of the dashboard's :443 TLS. Use the "<namespace>/<name>" slash form.
  kserveGateway:
    name: "kubeflow/kserve-ingress-gateway"

  # Base domain for KServe InferenceServices. Prefer a scoped subdomain
  # (e.g. "models.example.com") over a bare org-wide domain ("example.com"):
  # with kserveExternalHttps the cert is a "*.<kserveDomain>" wildcard, so a bare
  # domain widens its blast radius to your whole DNS zone.
  # Pushed automatically to knative-serving and kserve subcharts.
  # Empty (default) = fall back to the subchart-local knativeServing.domain /
  # kserve.ingressDomain (which default to "example.com"), preserving the behaviour
  # of installs that set the domain via those legacy knobs. Set this to make it the
  # single source of truth; REQUIRED when global.kserveExternalHttps is true.
  kserveDomain: ""

  # Enable external HTTPS to KServe inference on the dedicated kserve-ingress-gateway
  # (global.kserveGateway.name), separate from the dashboard's kubeflow-gateway.
  # When true, creates a wildcard cert (*.kserveDomain) and exposes it on :443.
  # Requires a DNS-01 solver. Flattens the route host to the single label
  # "{name}-{namespace}.{domain}" so the wildcard covers it. Knative/KServe render
  # this with Go's stdlib text/template (no Sprig), so the namespace cannot be
  # hashed — see README for the cross-tenant naming caveat this implies.
  kserveExternalHttps: false

# ============================================================================
# Secrets / Credentials
# ============================================================================
# Chart-managed credentials with lookup-idempotent patterns (random on first
# install, preserved on upgrade). Override with pre-created secrets for production.
auth:
  # OIDC client secret shared between Dex (staticClients) and oauth2-proxy.
  # Both components MUST use the same value.
  # DEMO DEFAULT — CHANGE IN PRODUCTION.
  # This is the single source of truth: it is referenced by dex.config.staticClients[0].secret
  # and passed to the oauth2-proxy sub-chart below.
  oidc:
    clientSecret: &oidcClientSecret "pUBnBOY80SnXgjibTYM9ZWNzY2xreNGQok"  # DEMO DEFAULT
    cookieSecret: &oidcCookieSecret "3GvvtL75w3Y8ERsQ9ma81nIngIx4YrjXNtQpCNDa4Vc=" # DEMO DEFAULT

  # Initial admin user for Dex login.
  # WARNING: Change these credentials immediately after first login.
  initialUser:
    email: "user@example.com"           # DEMO DEFAULT — CHANGE IN PRODUCTION
    # bcrypt hash of the password. Default password: 12341234
    # Generate: htpasswd -nbBC 12 "" <password> | tr -d ':\n' | sed 's/$2y/$2a/'
    passwordHash: "$2y$12$arGZ9p14vTUDsOg/GZ6DRu8UjXxtB60UI3A1Api5/UXjdBz5qTEjm"  # DEMO DEFAULT

# ============================================================================
# Infrastructure Components
# ============================================================================

# cert-manager - TLS certificate management
# NOTE: cert-manager must be installed separately to cert-manager namespace (see prerequisites above)
# Uses oci://dp.apps.rancher.io/charts/cert-manager
certManager:
  install: false  # Set true only if installing cert-manager via this chart (not recommended)
  crds:
    enabled: true
    keep: true

# Istio service mesh
# NOTE: Istio must be installed separately to istio-system namespace (see prerequisites above)
# Uses oci://dp.apps.rancher.io/charts/istio
istio:
  install: false  # Set true only if installing Istio via this chart (not recommended)
  gateway:
    enabled: true

# KServe / Knative external access — single source of truth.
# See global.kserveDomain and global.kserveExternalHttps above.

# Knative Serving (required for KServe)
knativeServing:
  enabled: true  # Required for KServe inference
  # domain is driven by global.kserveDomain via the knative-serving.domain helper
  # (single source of truth); no need to set it here. domainTemplate is likewise
  # auto-derived from global.kserveExternalHttps.

# Knative Eventing
knativeEventing:
  enabled: false  # Optional - for event-driven pipelines

# ============================================================================
# Authentication
# ============================================================================

# Dex OIDC provider (official dexidp chart)
dex:
  enabled: true
  # OIDC client credentials — wired from auth.oidc.clientSecret anchor above.
  # Override oidcClientSecret here or set existingOidcClientSecret to skip chart-managed secret.
  oidcClientId: "kubeflow-oidc-authservice"
  oidcClientSecret: *oidcClientSecret
  existingOidcClientSecret: ""  # set to a pre-existing Secret name to skip chart creation
  config:
    issuer: "http://kubeflow-dex.kubeflow.svc.cluster.local:5556/dex"
    oauth2:
      skipApprovalScreen: true
    storage:
      type: kubernetes
      config:
        inCluster: true
    web:
      http: 0.0.0.0:5556
    staticClients:
      - id: kubeflow-oidc-authservice
        redirectURIs:
          - /oauth2/callback
        name: kubeflow-oidc-authservice
        # References auth.oidc.clientSecret — change it there, not here.
        secret: *oidcClientSecret
    staticPasswords:
      # Default credentials (Email: user@example.com / Password: 12341234)
      # DEMO DEFAULT — CHANGE IN PRODUCTION.
      # In production, use auth.initialUser.email / auth.initialUser.passwordHash
      # or configure an external LDAP/OIDC connector via dex.config.connectors.
      - email: user@example.com  # DEMO DEFAULT
        hash: "$2y$12$arGZ9p14vTUDsOg/GZ6DRu8UjXxtB60UI3A1Api5/UXjdBz5qTEjm"  # DEMO DEFAULT
        username: user
        userID: "15841185641784"
    enablePasswordDB: true
  # Resource limits for the Dex container (via Rancher dex-idp chart)
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # PodDisruptionBudget — protects against voluntary disruptions (node drains).
  # With maxUnavailable: 1 and a single replica this is a no-op; meaningful protection
  # requires replicaCount >= 2 (use ha-overrides.yaml). Dex is in the critical auth
  # path — losing it blocks all logins.
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1


# oauth2-proxy sub-chart values
# clientSecret MUST match dex.config.staticClients[0].secret — both reference auth.oidc.clientSecret
oauth2-proxy:
  replicaCount: 2
  # Enable Istio sidecar injection for oauth2-proxy
  podAnnotations:
    sidecar.istio.io/inject: "true"
  # Extra environment variables to pass to the oauth2-proxy container
  extraEnv:
    # Automatically populated from the dynamic ConfigMap 'oauth2-proxy-dynamic-config'
    # based on the parent chart's TLS / external HTTPS configuration.
    - name: OAUTH2_PROXY_COOKIE_SECURE
      valueFrom:
        configMapKeyRef:
          name: oauth2-proxy-dynamic-config
          key: cookie-secure
    - name: OAUTH2_PROXY_SSL_INSECURE_SKIP_VERIFY
      value: "false"
    - name: OAUTH2_PROXY_SKIP_JWT_BEARER_TOKENS
      value: "true"
    - name: OAUTH2_PROXY_EXTRA_JWT_ISSUERS
      value: "http://kubeflow-dex.kubeflow.svc.cluster.local:5556/dex=kubeflow-oidc-authservice"

  podDisruptionBudget:
    enabled: true
    maxUnavailable: null
    minAvailable: 1
    unhealthyPodEvictionPolicy: ""
  config:
    clientID: "kubeflow-oidc-authservice"
    clientSecret: *oidcClientSecret
    cookieSecret: *oidcCookieSecret
    configFile: |-
      provider = "oidc"
      oidc_issuer_url = "http://kubeflow-dex.kubeflow.svc.cluster.local:5556/dex"
      scope = "profile email groups openid"
      email_domains = [ "*" ]

      # serve a static HTTP 200 upstream on for authentication success
      # we are using oauth2-proxy as an ExtAuthz to "check" each request, not pass it on
      upstreams = [ "static://200" ]

      # requests to paths matching these regex patterns will receive a 401 Unauthorized response
      # when not authenticated, instead of being redirected to the login page with a 302,
      # this prevents background requests being redirected to the login page,
      # and the accumulation of CSRF cookies
      api_routes = [
        # Generic
        # NOTE: included because most background requests contain these paths
        "/api/",
        "/apis/",

        # Kubeflow Pipelines
        # NOTE: included because KFP UI makes MANY background requests to these paths but because they are
        #       not `application/json` requests, oauth2-proxy will redirect them to the login page
        "^/ml_metadata",
      ]

      # OIDC Discovery has to be skipped and login url has to be provided directly
      # in order to enable relative auth redirect. Using OIDC Discovery would set
      # the redirect location to http://dex.auth.svc.cluster.local:5556 in the example
      # installation. This address is usually not available through the Web Browser.
      # If you have a setup where dex has it's url as other than the in-cluster
      # service, this is optional.
      skip_oidc_discovery = true
      login_url = "/dex/auth"
      redeem_url = "http://kubeflow-dex.kubeflow.svc.cluster.local:5556/dex/token"
      oidc_jwks_url = "http://kubeflow-dex.kubeflow.svc.cluster.local:5556/dex/keys"

      # if `false`, a sign-in page is displayed before starting the login flow
      # prevents background requests starting their own login flow on token expiry,
      # which can lead to many CSRF cookies, potentially exceeding the cookie limit
      skip_provider_button = true

      # style the sign-in page
      provider_display_name = "Dex"
      #custom_sign_in_logo = "/custom-theme/kubeflow-logo.svg"
      #banner = "-"
      #footer = "-"

      # oauth2-proxy sends "force" by default, which causes dex to always prompt for login
      # https://github.com/dexidp/dex/pull/3086
      prompt = "none"

      # set Authorization Bearer response header. This is needed in order to
      # forward the Authorization Bearer token to Istio and enable authorization
      # based on JWT.
      set_authorization_header = true

      # set X-Auth-Request-User, X-Auth-Request-Groups, X-Auth-Request-Email and
      # X-Auth-Request-Preferred-Username. This is optional for Kubeflow but you
      # may have other services that use standard auth headers.
      set_xauthrequest = true

      cookie_name = "oauth2_proxy_kubeflow"

      # Dex default cookie expiration is 24h.
      # If set to 168h (default oauth2-proxy), Istio will not be able to use the JWT after 24h,
      # but oauth2-proxy will still consider the cookie valid.
      # It's possible to configure the JWT Refresh Token to enable longer login session.
      cookie_expire = "24h"
      cookie_refresh = 0

      code_challenge_method = "S256"

      redirect_url = "/oauth2/callback"
      relative_redirect_url = true

# ============================================================================
# Kubeflow Applications
# ============================================================================

# Central Dashboard
centralDashboard:
  enabled: true

# Kubeflow Pipelines
pipelines:
  enabled: true
  # Set to the model-registry DB name when hub.enabled=true so KFP knows which DB to use.
  # Automatically populated here; override to "" to disable.
  embedmdDb: "modelregistry"
  # Rancher MariaDB sub-chart (oci://dp.apps.rancher.io/charts/mariadb 0.1.7)
  # MariaDB 11.x supports mysql_native_password natively, no compat flags needed
  mariadb:
    enabled: true
    fullnameOverride: "mysql"
    auth:
      existingSecret: "mysql-secret"
      rootPasswordKey: "password"
      database: "mlpipeline"
      username: ""
      # Disable replication user - single node setup
      replicationUsername: ""
    persistence:
      enabled: true
      storageClassName: ""
      resources:
        requests:
          storage: 20Gi
    metrics:
      enabled: false
    # Scheduled backup CronJob + PVC. Enabled by default.
    # Set enabled: false on resource-constrained clusters.
    backup:
      enabled: false
      schedule: "0 2 * * *"  # daily at 02:00 UTC
      storageSize: 10Gi
      storageClass: ""        # empty = cluster default

  seaweedfs:
    enabled: true
    storageClass: ""
    storageSize: 20Gi
    accessKey: &seaweedfsAccessKey kubeflow      # DEMO DEFAULT
    secretKey: &seaweedfsSecretKey kubeflow123   # DEMO DEFAULT

# Jupyter Notebooks
notebooks:
  enabled: true
  controller:
    enabled: true
  webApp:
    enabled: true

# Katib - Hyperparameter Tuning
katib:
  enabled: true
  mariadb:
    persistence:
      storageSize: 10Gi

# KServe - Model Serving
kserve:
  enabled: true
  # ingressDomain and urlScheme are driven by global.kserveDomain and
  # global.kserveExternalHttps (via the kserve.kserveDomain / kserve.kserveUrlScheme
  # helpers, single source of truth); no need to set them here.

# Kubeflow Hub (formerly Model Registry) - Model Registry + Model Catalog.
# Single consolidated chart; serves /api/model_registry/ via the model-registry
# VirtualService and provides the registry server, UI, and (optional) catalog.
# Requires pipelines.enabled=true (shares KFP's MariaDB and mysql-secret).
hub:
  enabled: true
  catalog:
    # Disabled by default: catalog deploys a PostgreSQL StatefulSet and is only useful
    # when HuggingFace credentials are configured. Enable explicitly when needed.
    enabled: false

# Training Operator
trainingOperator:
  enabled: true

# Trainer V2 — TrainJob / TrainingRuntime / ClusterTrainingRuntime
# Distinct from Training Operator V1 (trainingOperator) which provides PyTorchJob/TFJob/etc.
# Requires JobSet v0.10.1 (installed automatically; set trainer.jobset.installCRDs=false if already present)
trainer:
  enabled: true
  runtimes:
    enabled: true
    torchtune:
      enabled: false

# Profiles & KFAM - Multi-tenancy
profiles:
  enabled: true

# Volumes Web App
# pvcviewer-controller is automatically deployed together with volumes-web-app
# (Chart.yaml condition: volumesWebApp.enabled) — no separate toggle needed.
volumesWebApp:
  enabled: true

# Tensorboard
tensorboard:
  controller:
    enabled: true
  webApp:
    enabled: true

# ============================================================================
# Security / Network
# ============================================================================

# NetworkPolicies — when enabled, deny-all-ingress with explicit allow rules.
# Egress is unrestricted so components can reach external services (HuggingFace, registries, etc.).
# Supported by Calico, Cilium, Canal, and any other CNI that enforces NetworkPolicy.
# Disable if your CNI does not enforce NetworkPolicy.
networkPolicies:
  enabled: false

# Pre-install preflight checks (Helm hook Job).
# Validates: default StorageClass exists, cert-manager CRDs present.
preflightChecks:
  enabled: false  # set true to enable preflight validation on install/upgrade
  image:
    registry: dp.apps.rancher.io
    repository: containers/kubectl
    tag: "1.36.2"
    pullPolicy: IfNotPresent

# Observability — ServiceMonitors + PrometheusRules.
# Requires Rancher Monitoring (kube-prometheus-stack) to be installed first.
monitoring:
  enabled: false  # set true after Rancher Monitoring is installed

# External Secrets Operator — set enabled=true only if ESO is NOT already installed
# cluster-wide. runMe.sh pre-installs ESO before the main chart (same pattern as
# cert-manager / Istio) so this defaults to false. If you manage ESO yourself,
# keep false and ensure ESO CRDs are present before helm install.
externalSecretsOperator:
  enabled: false
  installCRDs: true

# Secret propagation to user namespaces — requires ESO (via externalSecretsOperator or pre-existing install).
# Propagates registry pull secrets from sourceNamespace to all namespaces labelled
# app.kubernetes.io/part-of: kubeflow-profile (user namespaces created by the profiles controller).
externalSecrets:
  enabled: true
  imagePullSecrets:
    sourceNamespace: kubeflow
    secrets:
      - name: suse-ai-registry
      - name: application-collection
  namespaceSelector:
    matchLabels:
      app.kubernetes.io/part-of: kubeflow-profile
  refreshInterval: "1h"

