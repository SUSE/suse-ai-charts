# Default values for Kubeflow umbrella chart
# This is a YAML-formatted file.
#
# Prerequisites:
#   1. Create required namespaces:
#      kubectl create namespace cert-manager
#      kubectl create namespace istio-system
#      kubectl create namespace kubeflow
#      kubectl create namespace knative-serving
#
#   2. Create image pull secret in each namespace (for Rancher registry):
#      for ns in cert-manager istio-system kubeflow knative-serving; do
#        kubectl create secret docker-registry application-collection \
#          --docker-server=dp.apps.rancher.io \
#          --docker-username=<username> \
#          --docker-password=<token> \
#          -n $ns
#      done
#
#   3. Label the kubeflow and knative-serving namespaces for Helm (the release adopts them):
#      for ns in kubeflow knative-serving; do
#        kubectl label namespace $ns app.kubernetes.io/managed-by=Helm
#        kubectl annotate namespace $ns meta.helm.sh/release-name=kubeflow meta.helm.sh/release-namespace=kubeflow
#      done
#
#   4. Install cert-manager (required):
#      helm install cert-manager oci://dp.apps.rancher.io/charts/cert-manager \
#        --version 1.20.2 \
#        --namespace cert-manager \
#        --set crds.enabled=true \
#        --set crds.keep=true \
#        --set global.imagePullSecrets[0].name=application-collection
#
#   5. Install Istio (required), with the native gateway auth provider and istio-cni (both files
#      ship in this chart):
#      helm install istio oci://dp.apps.rancher.io/charts/istio \
#        --version 1.3.0 \
#        --namespace istio-system \
#        --set global.imagePullSecrets[0].name=application-collection \
#        --set gateway.enabled=true \
#        -f istio-native-authz-values.yaml -f istio-cni-values.yaml
#
#   6. Create suse.com registry pull secret in static namespaces only:
#      for ns in cert-manager istio-system kubeflow knative-serving; do
#        kubectl create secret docker-registry suse-ai-registry \
#          --docker-server=registry.suse.com \
#          --docker-username=<username> \
#          --docker-password=<token> \
#          -n $ns
#      done
#      NOTE: User namespaces are handled automatically by ESO (externalSecrets.enabled=true).
#
#   7. Install the External Secrets Operator (required while externalSecrets.enabled=true):
#      helm install external-secrets-operator oci://dp.apps.rancher.io/charts/external-secrets-operator \
#        --version 2.6.0 \
#        --namespace kubeflow \
#        --set installCRDs=true \
#        --set global.imagePullSecrets[0].name=application-collection
#
#   8. Ensure storage provisioner (K3s/RKE2 clusters):
#      # Option A: Local Path Provisioner (development/testing)
#      kubectl apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.26/deploy/local-path-storage.yaml
#      kubectl patch storageclass local-path -p '{"metadata": {"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'
#
#      # Option B: Longhorn (production)
#      helm install longhorn oci://dp.apps.rancher.io/charts/longhorn \
#        --namespace longhorn-system --create-namespace \
#        --set defaultSettings.defaultDataPath="/var/lib/longhorn" \
#        --set persistence.defaultClassReplicaCount=1
#
#      Note: Delete any AWS-specific storage classes (e.g., gp2) before installing:
#      kubectl delete storageclass gp2
#
# Installation (release name and namespace must both be kubeflow):
#   helm upgrade --install kubeflow oci://registry.suse.com/ai/charts/kubeflow --version <chart-version> \
#     -n kubeflow --force-conflicts --server-side=true --wait --timeout 15m
#
# Or from a checkout of the chart repository (root directory):
#   helm dependency build kubeflow
#   helm upgrade --install kubeflow ./kubeflow -n kubeflow --force-conflicts --server-side=true --wait --timeout 15m
#
# Access:
#   kubectl port-forward svc/istio -n istio-system 8080:80
#   Open http://localhost:8080
#
# Login: user@example.com. The password is generated on first install:
#   kubectl -n kubeflow get secret kubeflow-initial-user -o jsonpath='{.data.password}' | base64 -d
# (With global.demoMode=true the published demo password 12341234 is used instead.)

# Global configuration applied to all sub-charts
global:
  # Storage class for PVCs (leave empty for cluster default)
  storageClass: ""

  # Image pull policy
  imagePullPolicy: IfNotPresent

  # Common labels applied to all resources
  labels: {}

  # Image pull secrets applied to every Deployment/StatefulSet in all sub-charts.
  # Third-party Bitnami-style sub-charts (mariadb) read this automatically.
  # Custom sub-chart templates reference .Values.global.imagePullSecrets directly.
  # Argo workflow executor pods are covered separately via workflowDefaults in
  # the workflow-controller-configmap (that configmap is rendered at pod-create time,
  # not Helm time, so it cannot use Helm values).
  imagePullSecrets:
    - name: application-collection
    - name: suse-ai-registry

  # Private/air-gapped registry: replaces the registry of every image (SUSE AI and Application
  # Collection); repositories keep their path, e.g. containers/kubectl -> <imageRegistry>/containers/kubectl.
  # Example (air-gapped mirror): my-registry.corp.com
  # Leave empty to use the default registry specified in each sub-chart's values.
  imageRegistry: ""

  # SUSE AI registry OVERRIDE for all SUSE AI images (registry.suse.com/ai/containers/*).
  # Leave empty (default) to use each component's own image.registry value.
  # When set, overrides every SUSE component's image.registry (e.g. "stgregistry.suse.com"
  # for QA against staging). SUSE Application Collection images are unaffected.
  # Precedence: global.imageRegistry > global.suseRegistry > component image.registry
  suseRegistry: ""

  # -- Application Collection registry OVERRIDE for all App Collection images
  # (dp.apps.rancher.io/containers/* that are wired through the chart's helpers).
  # Leave empty (default) to use each component's own image.registry value.
  # When set, overrides every App Collection component's image.registry.
  # Precedence: global.imageRegistry > global.suseApplicationCollectionRegistry > component image.registry
  suseApplicationCollectionRegistry: ""

  # Demo mode: set true ONLY for local development/tutorial. When true, empty credentials
  # (auth.oidc.*, auth.initialUser.passwordHash, pipelines.seaweedfs.*) take the published demo
  # values (login user@example.com / 12341234) instead of being generated. When false (default),
  # they are generated, and Helm fails at render time if any is set to a known demo value.
  # NEVER set true in production.
  demoMode: false

  # oauth2-proxy enablement
  oauth2Proxy:
    enabled: true
    # Ingress-gateway authentication mode. One of:
    #   native      — upstream-parity Istio-native ext_authz: a CUSTOM
    #                 AuthorizationPolicy calls oauth2-proxy via an istiod
    #                 MeshConfig extensionProvider, a RequestAuthentication
    #                 (dex-jwt) verifies the Dex JWT and a DENY AuthorizationPolicy
    #                 (require-jwt) enforces it. This is the DEFAULT and matches
    #                 kubeflow/community-distribution.
    #                 PREREQUISITE: istiod MeshConfig must carry the "oauth2-proxy"
    #                 extensionProvider. runMe.sh adds it by default
    #                 (istio-native-authz-values.yaml); the native-authz-guard
    #                 template fails the install fast if it is missing, to prevent a
    #                 CUSTOM-policy gateway lockout. For BYO-istio that cannot add
    #                 the provider, use envoyfilter mode.
    #   envoyfilter — self-contained hand-written EnvoyFilter ext_authz chain
    #                 (authn-filter). No istiod MeshConfig change required, so it
    #                 works on any BYO-istio. Opt in with -f values-envoyfilter-authz.yaml
    #                 (or runMe.sh --legacy-authz).
    gatewayAuthMode: native

  gateway:
    name: "kubeflow/kubeflow-gateway"


  # Model Registry layout: perProfile (one registry per profile namespace, as upstream) or shared
  # (deprecated: one registry in kubeflow on KFP's MariaDB). Models are not migrated between modes;
  # see docs/upgrade-notes.md#model-registry-per-profile.
  modelRegistry:
    mode: perProfile

  # Istio ingress-gateway identity — SINGLE SOURCE OF TRUTH.
  # Consumed by every subchart that references the mesh ingress gateway:
  #   - kubeflow-istio-resources : Gateway selector, authn EnvoyFilter
  #     workloadSelector, and the native ext_authz / require-jwt / dex-jwt CRs
  #   - kubeflow-hub             : model-registry / -ui / -catalog AuthorizationPolicies
  #   - user-namespace           : per-profile Model Registry AuthorizationPolicy
  #   - profiles-and-kfam        : ISTIO_INGRESS_GATEWAY_PRINCIPAL (each profile's ns-owner-access-istio)
  #   - knative-serving          : knative-local-gateway Gateway + fronting Service
  # Flipping Rancher <-> upstream Istio is a single change here.
  istio:
    # Must match how Istio is installed: true = with istio-cni (profile namespaces enforce Pod
    # Security baseline), false = classic istio-init. See docs/production-and-tenancy.md#9-pod-security-standards-on-profile-namespaces.
    cni: true
    ingressGateway:
      # ServiceAccount principal of the ingress gateway (used by AuthorizationPolicy
      # source.principals). Rancher/AppCo Istio runs the gateway as SA 'istio';
      # upstream Kubeflow uses 'istio-ingressgateway-service-account'.
      #   Verify: kubectl get pod -n istio-system -l app=istio \
      #             -o jsonpath='{.items[0].spec.serviceAccountName}'
      # Must not be empty (the render fails): the profiles controller would otherwise fall back to
      # upstream's istio-ingressgateway-service-account and block gateway access to profiles.
      principal: "cluster.local/ns/istio-system/sa/istio"
      # Workload label selector of the ingress-gateway pods. Shared by the Gateway
      # CRs, the authn EnvoyFilter workloadSelector, and the native auth CRs, so they
      # can never drift. Must be non-empty (an empty selector on the istio-system
      # authn EnvoyFilter — patches are context: GATEWAY — would attach ext_authz to
      # EVERY gateway in the mesh). Rancher: {istio: istio}; upstream: {istio: ingressgateway}.
      selector:
        istio: istio

  # Dedicated Istio Gateway ("<namespace>/<name>") for KServe/Knative inference.
  # Single source of truth consumed by three subcharts:
  #   - kubeflow-istio-resources renders the Gateway of this name/namespace
  #   - knative-serving  config-istio       key "gateway.<namespace>.<name>"
  #   - kserve           inferenceservice-config "ingressGateway"
  # Kept separate from global.gateway.name (the dashboard gateway) so the Knative
  # net-istio readiness prober only ever probes this gateway's ports, independent
  # of the dashboard's :443 TLS. Use the "<namespace>/<name>" slash form.
  kserveGateway:
    name: "kubeflow/kserve-ingress-gateway"

  # Base domain for KServe InferenceServices. Prefer a scoped subdomain
  # (e.g. "models.example.com") over a bare org-wide domain ("example.com"):
  # with kserveExternalHttps the cert is a "*.<kserveDomain>" wildcard, so a bare
  # domain widens its blast radius to your whole DNS zone.
  # Pushed automatically to knative-serving and kserve subcharts.
  # Empty (default) = the whole stack uses "example.com" (knativeServing.domain and
  # kserve.ingressDomain also default to "example.com"), which the dedicated
  # kserve-ingress-gateway serves as "*.example.com".
  # This is the SINGLE source of truth for the inference domain. To override the
  # domain you MUST set it here — the legacy subchart-local knobs
  # (knativeServing.domain / kserve.ingressDomain) alone are no longer sufficient:
  # they feed the Knative/KServe configs but NOT the dedicated gateway's hosts, so
  # setting them without global.kserveDomain diverges the gateway from the routes and
  # breaks inference readiness. The umbrella validations.yaml fails fast on that
  # combination. REQUIRED when global.kserveExternalHttps is true.
  kserveDomain: ""

  # Enable external HTTPS to KServe inference on the dedicated kserve-ingress-gateway
  # (global.kserveGateway.name), separate from the dashboard's kubeflow-gateway.
  # When true, creates a wildcard cert (*.kserveDomain) and exposes it on :443.
  # Requires a DNS-01 solver. Flattens the route host to the single label
  # "{name}-{namespace}.{domain}" so the wildcard covers it. Knative/KServe render
  # this with Go's stdlib text/template (no Sprig), so the namespace cannot be
  # hashed — see docs/access-and-tls.md (External HTTPS for KServe inference) for the
  # cross-tenant naming caveat this implies.
  kserveExternalHttps: false

# ============================================================================
# Secrets / Credentials
# ============================================================================
# Chart-managed credentials with lookup-idempotent patterns (random on first
# install, preserved on upgrade). Override with pre-created secrets for production.
auth:
  # OIDC client credentials shared by Dex (staticClients) and oauth2-proxy.
  # This is the single source of truth: the chart writes these values to the
  # kubeflow-oidc-client Secret, and Dex and oauth2-proxy both read that Secret,
  # so overrides set here with -f/--set reach both components.
  oidc:
    # "" generates a random value on first install and keeps it on upgrade (needs a render that
    # sees the cluster: helm install/upgrade, not helm template). With global.demoMode=true, ""
    # means the published demo value instead.
    clientSecret: ""
    cookieSecret: ""
    # true: don't create the kubeflow-oidc-client Secret; provide a Secret with that
    # name and the keys client-id, client-secret and cookie-secret yourself (e.g. with
    # External Secrets); client-id must be kubeflow-oidc-authservice, the id Dex registers.
    # clientSecret/cookieSecret are then unused.
    existingSecret: false

  # Initial user for Dex's password login. The chart writes it to the kubeflow-initial-user Secret,
  # which Dex reads (dex.envVars + staticPasswords[].hashFromEnv below). Unused when an external
  # identity provider replaces the password login (dex.config.enablePasswordDB: false).
  initialUser:
    email: "user@example.com"  # keep equal to dex.config.staticPasswords[0].email
    # bcrypt hash of the password. Generate: htpasswd -nbBC 12 "" <password> | tr -d ':\n' | sed 's/$2y/$2a/'
    # "" generates a random password on first install and keeps it on upgrade (needs a render that
    # sees the cluster); read it from the password key of Secret kubeflow/kubeflow-initial-user.
    # With global.demoMode=true, "" means the demo password 12341234.
    passwordHash: ""

# ============================================================================
# Infrastructure Components
# ============================================================================

# cert-manager - TLS certificate management
# NOTE: cert-manager must be installed separately to cert-manager namespace (see prerequisites above)
# Uses oci://dp.apps.rancher.io/charts/cert-manager
certManager:
  install: false  # Set true only if installing cert-manager via this chart (not recommended)
  crds:
    enabled: true
    keep: true

# Istio service mesh
# NOTE: Istio must be installed separately to istio-system namespace (see prerequisites above)
# Uses oci://dp.apps.rancher.io/charts/istio
istio:
  install: false  # Set true only if installing Istio via this chart (not recommended)
  # Not read by any template (kept so existing override files stay valid). To turn
  # off the Kubeflow Gateways/VirtualServices/AuthorizationPolicies use
  # istioResources.enabled below.
  gateway:
    enabled: true

# Kubeflow Istio resources (kubeflow-istio-resources sub-chart): the kubeflow-gateway
# and kserve-ingress-gateway Gateways (the latter switchable with
# kubeflow-istio-resources.kserveGateway.enabled), the Dex/oauth2-proxy VirtualServices, the
# gateway AuthorizationPolicies/EnvoyFilters and the kubeflow-istio-* ClusterRoles.
# Requires Istio CRDs. Disable only for installs without Istio (e.g. trainer-only,
# see docs/use-cases/trainer-only-install.md). Every component that needs Istio must then be
# disabled too; the chart fails fast and lists the ones still enabled (each component declares
# whether it needs Istio in components.yaml).
istioResources:
  enabled: true
  # true: an auth layer this chart doesn't manage protects the gateway and sets kubeflow-userid,
  # so global.oauth2Proxy.enabled=false is allowed. Otherwise that combination fails the install.
  externalAuth: false

# KServe / Knative external access — single source of truth.
# See global.kserveDomain and global.kserveExternalHttps above.

# Knative Serving (required for KServe, unless KServe's deployment mode is Standard)
knativeServing:
  enabled: true
  # domain is driven by global.kserveDomain via the knative-serving.domain helper
  # (single source of truth); no need to set it here. domainTemplate is likewise
  # auto-derived from global.kserveExternalHttps.

# Knative Eventing
knativeEventing:
  enabled: false  # Optional - for event-driven pipelines

# ============================================================================
# Authentication
# ============================================================================

# Dex OIDC provider (SUSE Application Collection dex-idp chart)
dex:
  enabled: true
  # The OIDC client secret reaches Dex through the kubeflow-oidc-client Secret
  # (envVars + staticClients[].secretEnv below). oidcClientId, oidcClientSecret and
  # existingOidcClientSecret are not read by this chart; use auth.oidc.* instead.
  oidcClientId: "kubeflow-oidc-authservice"
  oidcClientSecret: ""
  existingOidcClientSecret: ""
  envVars:
    - name: KUBEFLOW_OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: kubeflow-oidc-client  # created from auth.oidc.* (templates/secrets)
          key: client-secret
    - name: KUBEFLOW_INITIAL_USER_HASH
      valueFrom:
        secretKeyRef:
          name: kubeflow-initial-user  # created from auth.initialUser.* (templates/secrets)
          key: hash
  config:
    issuer: "http://kubeflow-dex.kubeflow.svc.cluster.local:5556/dex"
    oauth2:
      skipApprovalScreen: true
    storage:
      type: kubernetes
      config:
        inCluster: true
    web:
      http: 0.0.0.0:5556
    staticClients:
      - id: kubeflow-oidc-authservice
        redirectURIs:
          - /oauth2/callback
        name: kubeflow-oidc-authservice
        # Read from the kubeflow-oidc-client Secret via the env var above;
        # change auth.oidc.clientSecret, not this.
        secretEnv: KUBEFLOW_OIDC_CLIENT_SECRET
    staticPasswords:
      # The password hash comes from auth.initialUser.passwordHash (via the env var above); change
      # it there. For an external LDAP/OIDC/SAML provider, add dex.config.connectors and set
      # staticPasswords: [] and enablePasswordDB: false.
      - email: user@example.com  # keep equal to auth.initialUser.email
        hashFromEnv: KUBEFLOW_INITIAL_USER_HASH
        username: user
        userID: "15841185641784"
    enablePasswordDB: true
  # Resource limits for the Dex container (via Rancher dex-idp chart)
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # PodDisruptionBudget — protects against voluntary disruptions (node drains).
  # With maxUnavailable: 1 and a single replica this is a no-op; meaningful protection
  # requires replicaCount >= 2 (use ha-overrides.yaml). Dex is in the critical auth
  # path — losing it blocks all logins.
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1


# oauth2-proxy sub-chart values
# The OIDC client secret comes from the kubeflow-oidc-client Secret (auth.oidc.*), which Dex reads too.
oauth2-proxy:
  replicaCount: 2
  # Enable Istio sidecar injection for oauth2-proxy
  podAnnotations:
    sidecar.istio.io/inject: "true"
  # Extra environment variables to pass to the oauth2-proxy container
  extraEnv:
    # Automatically populated from the dynamic ConfigMap 'oauth2-proxy-dynamic-config'
    # based on the parent chart's TLS / external HTTPS configuration.
    - name: OAUTH2_PROXY_COOKIE_SECURE
      valueFrom:
        configMapKeyRef:
          name: oauth2-proxy-dynamic-config
          key: cookie-secure
    - name: OAUTH2_PROXY_SSL_INSECURE_SKIP_VERIFY
      value: "false"
    - name: OAUTH2_PROXY_SKIP_JWT_BEARER_TOKENS
      value: "true"
    - name: OAUTH2_PROXY_EXTRA_JWT_ISSUERS
      value: "http://kubeflow-dex.kubeflow.svc.cluster.local:5556/dex=kubeflow-oidc-authservice"

  podDisruptionBudget:
    enabled: true
    maxUnavailable: null
    minAvailable: 1
    unhealthyPodEvictionPolicy: ""
  config:
    clientID: "kubeflow-oidc-authservice"
    # client-id, client-secret and cookie-secret come from the kubeflow-oidc-client
    # Secret; change auth.oidc.* rather than setting them here.
    existingSecret: kubeflow-oidc-client
    # NOTE: the oauth2-proxy chart renders this whole string through `tpl`
    # (charts/oauth2-proxy templates/_helpers.tpl: `tpl .Values.config.configFile $`),
    # so Helm directives below are evaluated with the chart root context and can read
    # shared `global` values. Any LITERAL `{{`/`}}` added here must be escaped.
    configFile: |-
      provider = "oidc"
      oidc_issuer_url = "http://kubeflow-dex.kubeflow.svc.cluster.local:5556/dex"
      scope = "profile email groups openid"
      email_domains = [ "*" ]

      # serve a static HTTP 200 upstream on for authentication success
      # we are using oauth2-proxy as an ExtAuthz to "check" each request, not pass it on
      upstreams = [ "static://200" ]

      {{- if eq ($.Values.global.oauth2Proxy.gatewayAuthMode | default "native") "native" }}
      # Skip authentication for the Dex login paths. Native ext_authz mode (the
      # default, gatewayAuthMode: native) sends the ext_authz check to oauth2-proxy,
      # so oauth2-proxy itself must allow /dex/ through (belt-and-suspenders with the
      # CUSTOM AuthorizationPolicy notPaths). This block is single-sourced here and
      # rendered ONLY in native mode: in envoyfilter mode the authn EnvoyFilter's Lua
      # handles the skip instead, so gatewayAuthMode=envoyfilter drops it via this
      # conditional (no duplicated configFile override needed). Matches
      # kubeflow/community-distribution.
      skip_auth_routes = [
        "^/dex/",
      ]
      {{- end }}

      # requests to paths matching these regex patterns will receive a 401 Unauthorized response
      # when not authenticated, instead of being redirected to the login page with a 302,
      # this prevents background requests being redirected to the login page,
      # and the accumulation of CSRF cookies
      api_routes = [
        # Generic
        # NOTE: included because most background requests contain these paths
        "/api/",
        "/apis/",

        # Kubeflow Pipelines
        # NOTE: included because KFP UI makes MANY background requests to these paths but because they are
        #       not `application/json` requests, oauth2-proxy will redirect them to the login page
        "^/ml_metadata",
      ]

      # OIDC Discovery has to be skipped and login url has to be provided directly
      # in order to enable relative auth redirect. Using OIDC Discovery would set
      # the redirect location to http://dex.auth.svc.cluster.local:5556 in the example
      # installation. This address is usually not available through the Web Browser.
      # If you have a setup where dex has it's url as other than the in-cluster
      # service, this is optional.
      skip_oidc_discovery = true
      login_url = "/dex/auth"
      redeem_url = "http://kubeflow-dex.kubeflow.svc.cluster.local:5556/dex/token"
      oidc_jwks_url = "http://kubeflow-dex.kubeflow.svc.cluster.local:5556/dex/keys"

      # if `false`, a sign-in page is displayed before starting the login flow
      # prevents background requests starting their own login flow on token expiry,
      # which can lead to many CSRF cookies, potentially exceeding the cookie limit
      skip_provider_button = true

      # style the sign-in page
      provider_display_name = "Dex"
      #custom_sign_in_logo = "/custom-theme/kubeflow-logo.svg"
      #banner = "-"
      #footer = "-"

      # oauth2-proxy sends "force" by default, which causes dex to always prompt for login
      # https://github.com/dexidp/dex/pull/3086
      prompt = "none"

      # set Authorization Bearer response header. This is needed in order to
      # forward the Authorization Bearer token to Istio and enable authorization
      # based on JWT.
      set_authorization_header = true

      # set X-Auth-Request-User, X-Auth-Request-Groups, X-Auth-Request-Email and
      # X-Auth-Request-Preferred-Username. This is optional for Kubeflow but you
      # may have other services that use standard auth headers.
      set_xauthrequest = true

      cookie_name = "oauth2_proxy_kubeflow"

      # Dex default cookie expiration is 24h.
      # If set to 168h (default oauth2-proxy), Istio will not be able to use the JWT after 24h,
      # but oauth2-proxy will still consider the cookie valid.
      # It's possible to configure the JWT Refresh Token to enable longer login session.
      cookie_expire = "24h"
      cookie_refresh = 0

      code_challenge_method = "S256"

      redirect_url = "/oauth2/callback"
      relative_redirect_url = true

# ============================================================================
# Kubeflow Applications
# ============================================================================

# Central Dashboard
centralDashboard:
  enabled: true

# Kubeflow Pipelines
pipelines:
  enabled: true
  # Set to the model-registry DB name when hub.enabled=true so KFP knows which DB to use.
  # Only consumed by the shared registry (global.modelRegistry.mode=shared); unused in perProfile.
  # Automatically populated here; override to "" to disable.
  embedmdDb: "modelregistry"
  # Rancher MariaDB sub-chart (oci://dp.apps.rancher.io/charts/mariadb 0.1.7)
  # MariaDB 11.x supports mysql_native_password natively, no compat flags needed
  mariadb:
    enabled: true
    fullnameOverride: "mysql"
    auth:
      existingSecret: "mysql-secret"
      rootPasswordKey: "password"
      database: "mlpipeline"
      username: ""
      # Disable replication user - single node setup
      replicationUsername: ""
    persistence:
      enabled: true
      storageClassName: ""
      resources:
        requests:
          storage: 20Gi
    metrics:
      enabled: false
    # Scheduled backup CronJob + PVC. Disabled by default; needs extra storage when enabled.
    backup:
      enabled: false
      schedule: "0 2 * * *"  # daily at 02:00 UTC
      storageSize: 10Gi
      storageClass: ""        # empty = cluster default

  seaweedfs:
    enabled: true
    storageClass: ""
    storageSize: 20Gi
    # "" generates a random value on first install and keeps it on upgrade (needs a render that
    # sees the cluster). With global.demoMode=true, "" means kubeflow / kubeflow123.
    # Use letters and digits only: SeaweedFS registers the keys through a shell command.
    accessKey: ""
    secretKey: ""

# Jupyter Notebooks
notebooks:
  enabled: true
  controller:
    enabled: true
  webApp:
    enabled: true

# Katib - Hyperparameter Tuning
katib:
  enabled: true
  mariadb:
    persistence:
      storageSize: 10Gi

# KServe - Model Serving
kserve:
  enabled: true
  # ingressDomain and urlScheme are driven by global.kserveDomain and
  # global.kserveExternalHttps (via the kserve.kserveDomain / kserve.kserveUrlScheme
  # helpers, single source of truth); no need to set them here.

# Kubeflow Hub: Model Registry UI/BFF, (optional) catalog, controller and CSI. Where the registry
# servers run is set by global.modelRegistry.mode.
hub:
  enabled: true
  catalog:
    # Disabled by default: catalog deploys a PostgreSQL StatefulSet and is only useful
    # when HuggingFace credentials are configured. Enable explicitly when needed.
    enabled: false

# Training Operator
trainingOperator:
  enabled: true

# Trainer V2 — TrainJob / TrainingRuntime / ClusterTrainingRuntime
# Distinct from Training Operator V1 (trainingOperator) which provides PyTorchJob/TFJob/etc.
# Requires JobSet v0.13.0 (installed automatically; set trainer.jobset.installCRDs=false if already present)
trainer:
  enabled: true
  runtimes:
    enabled: true
    torchtune:
      enabled: false

# Profiles & KFAM - Multi-tenancy
profiles:
  enabled: true

# Kubeflow aggregated ClusterRoles (kubeflow-roles sub-chart): kubeflow-{admin,edit,view}
# and kubeflow-kubernetes-{admin,edit,view}. Component charts aggregate their rules
# into these; Profiles binds them to users. Not needed for a trainer-only install.
kubeflowRoles:
  enabled: true

# PodDefaults admission webhook (admission-webhook sub-chart). Injects PodDefaults
# into notebook pods. Requires cert-manager CRDs (it ships a cert-manager Issuer and
# Certificate). Disable for installs without cert-manager; notebooks then run without
# PodDefaults.
admissionWebhook:
  enabled: true

# Volumes Web App
# pvcviewer-controller is automatically deployed together with volumes-web-app
# (Chart.yaml condition: volumesWebApp.enabled) — no separate toggle needed.
volumesWebApp:
  enabled: true

# Tensorboard
tensorboard:
  controller:
    enabled: true
  webApp:
    enabled: true

# ============================================================================
# Security / Network
# ============================================================================

# NetworkPolicies — when enabled, deny-all-ingress with explicit allow rules.
# Egress is unrestricted so components can reach external services (HuggingFace, registries, etc.).
# Supported by Calico, Cilium, Canal, and any other CNI that enforces NetworkPolicy.
# Disable if your CNI does not enforce NetworkPolicy.
networkPolicies:
  enabled: false

# Pre-install preflight checks (Helm hook Job): default StorageClass, cert-manager CRDs, Istio CNI.
# Recommended when rendering with helm template, where the chart's live-cluster checks do not run.
preflightChecks:
  enabled: false  # set true to enable preflight validation on install/upgrade
  # Same kubectl image as trainer.runtimes.applier.image and testImages.kubectl;
  # keep the tags equal (CI checks this).
  image:
    registry: dp.apps.rancher.io
    repository: containers/kubectl
    tag: "1.36.2"
    pullPolicy: IfNotPresent
  # For the preflight and webhook-secret-migration Jobs; set so they also run in
  # namespaces whose ResourceQuota requires requests/limits.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Observability — ServiceMonitors + PrometheusRules.
# Requires Rancher Monitoring (kube-prometheus-stack) to be installed first.
monitoring:
  enabled: false  # set true after Rancher Monitoring is installed

# External Secrets Operator — set enabled=true only if ESO is NOT already installed
# cluster-wide. runMe.sh pre-installs ESO before the main chart (same pattern as
# cert-manager / Istio) so this defaults to false. If you manage ESO yourself,
# keep false and ensure ESO CRDs are present before helm install.
externalSecretsOperator:
  enabled: false
  installCRDs: true

# Secret propagation to user namespaces — requires ESO (via externalSecretsOperator or pre-existing install).
# Propagates registry pull secrets from sourceNamespace to all namespaces labelled
# app.kubernetes.io/part-of: kubeflow-profile (user namespaces created by the profiles controller).
externalSecrets:
  enabled: true
  imagePullSecrets:
    sourceNamespace: kubeflow
    secrets:
      - name: suse-ai-registry
      - name: application-collection
  namespaceSelector:
    matchLabels:
      app.kubernetes.io/part-of: kubeflow-profile
  # Also copy the pull secrets into these namespaces, by name (e.g. [knative-serving] when the
  # secrets exist only in the kubeflow namespace). Don't list a namespace whose secrets of these
  # names something else manages: ESO would then fail to take them over. With an empty
  # namespaceSelector, only these namespaces get them.
  extraNamespaces: []
  refreshInterval: "1h"

