apiVersion: v1
kind: Service
metadata:
  name: {{ include "admission-webhook.fullname" . }}
  labels:
    {{- include "admission-webhook.labels" . | nindent 4 }}
spec:
  ports:
  - name: https-webhook
    port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPort }}
  selector:
    {{- include "admission-webhook.selectorLabels" . | nindent 4 }}
