global:
  # -- Global override for container image registry
  imageRegistry: ""
  # -- Global override for SUSE AI container image registry (e.g. staging registry)
  suseRegistry: ""
  # -- Global override for Application Collection image registry (e.g. dp.apps.rancher.io mirror)
  suseApplicationCollection: ""
  # -- Global override for container image pull secrets
  imagePullSecrets: []

# -- Default registry for all container images
image:
  registry: registry.suse.com

# Top-level fallback registry for Application Collection images
appCollection:
  registry: dp.apps.rancher.io

controller:
  image:
    registry: registry.suse.com
    repository: ai/containers/kubeflow/katib/katib-controller
    tag: v0.19.0
    pullPolicy: IfNotPresent
    digest: ""  # optional: sha256:... pins this image for supply-chain security
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

ui:
  image:
    registry: registry.suse.com
    repository: ai/containers/kubeflow/katib/katib-ui
    tag: v0.19.0
    pullPolicy: IfNotPresent
    digest: ""  # optional: sha256:... pins this image for supply-chain security
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  port: 8080
  env:
    APP_DISABLE_AUTH: "false"
  livenessProbe:
    httpGet:
      path: /katib/
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 30
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /katib/
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3

dbManager:
  image:
    registry: registry.suse.com
    repository: ai/containers/kubeflow/katib/katib-db-manager
    tag: v0.19.0
    pullPolicy: IfNotPresent
    digest: ""  # optional: sha256:... pins this image for supply-chain security
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  port: 6789

mariadb:
  image:
    registry: dp.apps.rancher.io
    repository: containers/mariadb
    tag: "11.8.8-10.1"
    pullPolicy: IfNotPresent
    digest: ""  # optional: sha256:... pins this image for supply-chain security
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  port: 3306
  persistence:
    storageClass: ""
    storageSize: 10Gi
    accessMode: ReadWriteOnce

# Structured Katib runtime config — rendered into the katib-config ConfigMap.
# Images use only repository and tag; the registry is resolved at render time
# via the katib.suseImageRegistry helper (respects global.suseRegistry).
katibConfig:
  suggestions:
    - algorithmName: random
      image:
        repository: ai/containers/kubeflow/katib/suggestion-hyperopt
        tag: v0.19.0
      serviceAccountName: katib-suggestion
    - algorithmName: tpe
      image:
        repository: ai/containers/kubeflow/katib/suggestion-hyperopt
        tag: v0.19.0
      serviceAccountName: katib-suggestion
    - algorithmName: grid
      image:
        repository: ai/containers/kubeflow/katib/suggestion-optuna
        tag: v0.19.0
      serviceAccountName: katib-suggestion
    - algorithmName: hyperband
      image:
        repository: ai/containers/kubeflow/katib/suggestion-hyperband
        tag: v0.19.0
      serviceAccountName: katib-suggestion
    - algorithmName: bayesianoptimization
      image:
        repository: ai/containers/kubeflow/katib/suggestion-skopt
        tag: v0.19.0
      serviceAccountName: katib-suggestion
    - algorithmName: cmaes
      image:
        repository: ai/containers/kubeflow/katib/suggestion-goptuna
        tag: v0.19.0
      serviceAccountName: katib-suggestion
    - algorithmName: sobol
      image:
        repository: ai/containers/kubeflow/katib/suggestion-goptuna
        tag: v0.19.0
      serviceAccountName: katib-suggestion
    - algorithmName: multivariate-tpe
      image:
        repository: ai/containers/kubeflow/katib/suggestion-optuna
        tag: v0.19.0
      serviceAccountName: katib-suggestion
    - algorithmName: enas
      image:
        repository: ai/containers/kubeflow/katib/suggestion-enas
        tag: v0.19.0
      serviceAccountName: katib-suggestion
      resources:
        limits:
          memory: "200Mi"
    - algorithmName: darts
      image:
        repository: ai/containers/kubeflow/katib/suggestion-darts
        tag: v0.19.0
      serviceAccountName: katib-suggestion
    - algorithmName: pbt
      image:
        repository: ai/containers/kubeflow/katib/suggestion-pbt
        tag: v0.19.0
      serviceAccountName: katib-suggestion
      persistentVolumeClaimSpec:
        accessModes:
          - ReadWriteMany
        resources:
          requests:
            storage: "5Gi"
  metricsCollectors:
    - kind: StdOut
      image:
        repository: ai/containers/kubeflow/katib/file-metrics-collector
        tag: v0.19.0
    - kind: File
      image:
        repository: ai/containers/kubeflow/katib/file-metrics-collector
        tag: v0.19.0
    - kind: TensorFlowEvent
      image:
        repository: ai/containers/kubeflow/katib/tfevent-metrics-collector
        tag: v0.19.0
      resources:
        limits:
          memory: "1Gi"
  earlyStoppings:
    - algorithmName: medianstop
      image:
        repository: ai/containers/kubeflow/katib/earlystopping-medianstop
        tag: v0.19.0
      serviceAccountName: katib-suggestion

# Trial templates images for the trial-templates ConfigMap
trialImages:
  mxnetMNIST:
    registry: registry.suse.com
    repository: ai/containers/kubeflowkatib/mxnet-mnist
    tag: v0.15.0
    pullPolicy: IfNotPresent
  enasCNNCIFAR10CPU:
    registry: registry.suse.com
    repository: ai/containers/kubeflow/katib/enas-cnn-cifar10-cpu
    tag: v0.19.0
    pullPolicy: IfNotPresent
  pyTorchMNISTCPU:
    registry: registry.suse.com
    repository: ai/containers/kubeflow/katib/pytorch-mnist-cpu
    tag: v0.19.0
    pullPolicy: IfNotPresent
