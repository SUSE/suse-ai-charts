global:
  # -- Global override for container image registry
  imageRegistry: ""
  # -- Global override for container image pull secrets
  imagePullSecrets: []

controller:
  image:
    registry: stgregistry.suse.com
    repository: ai/containers/kubeflow/katib/katib-controller
    tag: v0.19.0
    pullPolicy: IfNotPresent
    digest: ""  # optional: sha256:...

ui:
  image:
    registry: stgregistry.suse.com
    repository: ai/containers/kubeflow/katib/katib-ui
    tag: v0.19.0
    pullPolicy: IfNotPresent
    digest: ""  # optional: sha256:...

dbManager:
  image:
    registry: stgregistry.suse.com
    repository: ai/containers/kubeflow/katib/katib-db-manager
    tag: v0.19.0
    pullPolicy: IfNotPresent
    digest: ""  # optional: sha256:...

# Katib config - KatibConfig v1beta1 format required by Katib v0.17+
# Must be under the key "katib-config.yaml" in the katib-config ConfigMap.
# The old multi-key format (suggestion/early-stopping/metrics-collector-sidecar)
# was removed in v0.17; the webhook rejects Experiments if the key is missing.
katibConfig:
  content: |-
    apiVersion: config.kubeflow.org/v1beta1
    kind: KatibConfig
    runtime:
      suggestions:
        - algorithmName: random
          image: "stgregistry.suse.com/ai/containers/kubeflow/katib/suggestion-hyperopt:v0.19.0"
          serviceAccountName: katib-suggestion
        - algorithmName: tpe
          image: "stgregistry.suse.com/ai/containers/kubeflow/katib/suggestion-hyperopt:v0.19.0"
          serviceAccountName: katib-suggestion
        - algorithmName: grid
          image: "stgregistry.suse.com/ai/containers/kubeflow/katib/suggestion-optuna:v0.19.0"
          serviceAccountName: katib-suggestion
        - algorithmName: hyperband
          image: "stgregistry.suse.com/ai/containers/kubeflow/katib/suggestion-hyperband:v0.19.0"
          serviceAccountName: katib-suggestion
        - algorithmName: bayesianoptimization
          image: "stgregistry.suse.com/ai/containers/kubeflow/katib/suggestion-skopt:v0.19.0"
          serviceAccountName: katib-suggestion
        - algorithmName: cmaes
          image: "stgregistry.suse.com/ai/containers/kubeflow/katib/suggestion-goptuna:v0.19.0"
          serviceAccountName: katib-suggestion
        - algorithmName: sobol
          image: "stgregistry.suse.com/ai/containers/kubeflow/katib/suggestion-goptuna:v0.19.0"
          serviceAccountName: katib-suggestion
        - algorithmName: multivariate-tpe
          image: "stgregistry.suse.com/ai/containers/kubeflow/katib/suggestion-optuna:v0.19.0"
          serviceAccountName: katib-suggestion
        - algorithmName: enas
          image: "stgregistry.suse.com/ai/containers/kubeflow/katib/suggestion-enas:v0.19.0"
          serviceAccountName: katib-suggestion
          resources:
            limits:
              memory: "200Mi"
        - algorithmName: darts
          image: "stgregistry.suse.com/ai/containers/kubeflow/katib/suggestion-darts:v0.19.0"
          serviceAccountName: katib-suggestion
        - algorithmName: pbt
          image: "stgregistry.suse.com/ai/containers/kubeflow/katib/suggestion-pbt:v0.19.0"
          serviceAccountName: katib-suggestion
          persistentVolumeClaimSpec:
            accessModes:
              - ReadWriteMany
            resources:
              requests:
                storage: "5Gi"
      metricsCollectors:
        - kind: StdOut
          image: "stgregistry.suse.com/ai/containers/kubeflow/katib/file-metrics-collector:v0.19.0"
        - kind: File
          image: "stgregistry.suse.com/ai/containers/kubeflow/katib/file-metrics-collector:v0.19.0"
        - kind: TensorFlowEvent
          image: "stgregistry.suse.com/ai/containers/kubeflow/katib/tfevent-metrics-collector:v0.19.0"
          resources:
            limits:
              memory: "1Gi"
      earlyStoppings:
        - algorithmName: medianstop
          image: "stgregistry.suse.com/ai/containers/kubeflow/katib/earlystopping-medianstop:v0.19.0"
          serviceAccountName: katib-suggestion
