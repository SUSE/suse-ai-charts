{{- /*
  Lookup-idempotent Katib MariaDB credentials secret.
  On first install: generates a random 24-char password.
  On upgrade:       preserves the existing secret (no re-render).
  To rotate:        delete the secret, then helm upgrade to regenerate.
*/}}
{{- $secretName := "katib-mysql-secrets" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- if not $existing }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    katib.kubeflow.org/component: mysql
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  MYSQL_ROOT_PASSWORD: {{ randAlphaNum 24 | b64enc | quote }}
{{- end }}
