apiVersion: serving.kserve.io/v1alpha1
kind: ClusterServingRuntime
metadata:
  name: kserve-paddleserver
spec:
  annotations:
    prometheus.kserve.io/path: /metrics
    prometheus.kserve.io/port: '8080'
  containers:
  - args:
    - --model_name={{`{{.Name}}`}}
    - --model_dir=/mnt/models
    - --http_port=8080
    image: "{{ with (coalesce .Values.global.imageRegistry .Values.paddleServer.image.registry) }}{{ . }}/{{ end }}{{ .Values.paddleServer.image.repository }}{{- if .Values.paddleServer.image.digest }}@{{ .Values.paddleServer.image.digest }}{{- else }}:{{ .Values.paddleServer.image.tag }}{{- end }}"
    name: kserve-container
    resources:
      limits:
        cpu: '1'
        memory: 2Gi
      requests:
        cpu: '1'
        memory: 2Gi
  protocolVersions:
  - v1
  supportedModelFormats:
  - autoSelect: true
    name: paddle
    version: '2'
