apiVersion: serving.kserve.io/v1alpha1
kind: ClusterServingRuntime
metadata:
  name: kserve-tensorflow-serving
spec:
  annotations:
    prometheus.kserve.io/path: /metrics
    prometheus.kserve.io/port: '8080'
  containers:
  - args:
    - --model_name={{`{{.Name}}`}}
    - --port=9000
    - --rest_api_port=8080
    - --model_base_path=/mnt/models
    - --rest_api_timeout_in_ms=60000
    command:
    - /usr/bin/tensorflow_model_server
    image: "{{ with (coalesce .Values.global.imageRegistry .Values.tensorflowServing.image.registry) }}{{ . }}/{{ end }}{{ .Values.tensorflowServing.image.repository }}{{- if .Values.tensorflowServing.image.digest }}@{{ .Values.tensorflowServing.image.digest }}{{- else }}:{{ .Values.tensorflowServing.image.tag }}{{- end }}"
    name: kserve-container
    resources:
      limits:
        cpu: '1'
        memory: 2Gi
      requests:
        cpu: '1'
        memory: 2Gi
  protocolVersions:
  - v1
  - grpc-v1
  supportedModelFormats:
  - autoSelect: true
    name: tensorflow
    version: '1'
  - autoSelect: true
    name: tensorflow
    version: '2'
