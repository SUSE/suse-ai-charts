apiVersion: serving.kserve.io/v1alpha1
kind: ClusterServingRuntime
metadata:
  name: kserve-huggingfaceserver
spec:
  annotations:
    prometheus.kserve.io/path: /metrics
    prometheus.kserve.io/port: '8080'
  containers:
  - image: "{{ with (coalesce .Values.global.imageRegistry .Values.huggingfaceServer.image.registry) }}{{ . }}/{{ end }}{{ .Values.huggingfaceServer.image.repository }}{{- if .Values.huggingfaceServer.image.digest }}@{{ .Values.huggingfaceServer.image.digest }}{{- else }}:{{ .Values.huggingfaceServer.image.tag }}{{- end }}"
    name: kserve-container
    args:
    - --model_name={{`{{.Name}}`}}
    resources:
      limits:
        cpu: '4'
        memory: 8Gi
      requests:
        cpu: '1'
        memory: 2Gi
  protocolVersions:
  - v1
  - v2
  - grpc-v2
  supportedModelFormats:
  - autoSelect: true
    name: huggingface
    version: '1'
