apiVersion: v1
data:
  agent: |-
    {
        "image" : "{{- $registry := include "kserve.suseImageRegistry" (dict "ctx" . "registry" .Values.inferenceServiceConfig.agentConfig.image.registry) -}}{{- if $registry }}{{ $registry }}/{{ end }}{{ .Values.inferenceServiceConfig.agentConfig.image.repository }}:{{ .Values.inferenceServiceConfig.agentConfig.image.tag }}",
        "memoryRequest": "{{ .Values.inferenceServiceConfig.agentConfig.memoryRequest }}",
        "memoryLimit": "{{ .Values.inferenceServiceConfig.agentConfig.memoryLimit }}",
        "cpuRequest": "{{ .Values.inferenceServiceConfig.agentConfig.cpuRequest }}",
        "cpuLimit": "{{ .Values.inferenceServiceConfig.agentConfig.cpuLimit }}"
    }
  batcher: |-
    {
        "image" : "{{- $registry := include "kserve.suseImageRegistry" (dict "ctx" . "registry" .Values.inferenceServiceConfig.batcherConfig.image.registry) -}}{{- if $registry }}{{ $registry }}/{{ end }}{{ .Values.inferenceServiceConfig.batcherConfig.image.repository }}:{{ .Values.inferenceServiceConfig.batcherConfig.image.tag }}",
        "memoryRequest": "{{ .Values.inferenceServiceConfig.batcherConfig.memoryRequest }}",
        "memoryLimit": "{{ .Values.inferenceServiceConfig.batcherConfig.memoryLimit }}",
        "cpuRequest": "{{ .Values.inferenceServiceConfig.batcherConfig.cpuRequest }}",
        "cpuLimit": "{{ .Values.inferenceServiceConfig.batcherConfig.cpuLimit }}"
    }
  credentials: |-
    {{- .Values.inferenceServiceConfig.credentials | nindent 4 }}
  deploy: |-
    {{- .Values.inferenceServiceConfig.deploy | nindent 4 }}
  explainers: |-
    {
        "alibi": {
            "image" : "{{- $registry := include "kserve.suseImageRegistry" (dict "ctx" . "registry" .Values.inferenceServiceConfig.explainersConfig.alibi.image.registry) -}}{{- if $registry }}{{ $registry }}/{{ end }}{{ .Values.inferenceServiceConfig.explainersConfig.alibi.image.repository }}",
            "defaultImageVersion": "{{ .Values.inferenceServiceConfig.explainersConfig.alibi.image.tag }}"
        },
        "aix": {
            "image" : "{{- $registry := include "kserve.suseImageRegistry" (dict "ctx" . "registry" .Values.inferenceServiceConfig.explainersConfig.aix.image.registry) -}}{{- if $registry }}{{ $registry }}/{{ end }}{{ .Values.inferenceServiceConfig.explainersConfig.aix.image.repository }}",
            "defaultImageVersion": "{{ .Values.inferenceServiceConfig.explainersConfig.aix.image.tag }}"
        },
        "art": {
            "image" : "{{- $registry := include "kserve.suseImageRegistry" (dict "ctx" . "registry" .Values.inferenceServiceConfig.explainersConfig.art.image.registry) -}}{{- if $registry }}{{ $registry }}/{{ end }}{{ .Values.inferenceServiceConfig.explainersConfig.art.image.repository }}",
            "defaultImageVersion": "{{ .Values.inferenceServiceConfig.explainersConfig.art.image.tag }}"
        }
    }
  ingress: |-
    {{- /* domainTemplate stays as-is (KServe's default hyphen host = status.url,
           unchanged by the opt-in); ingressDomain and urlScheme are derived from
           the umbrella globals, and ingressGateway from global.kserveGateway.name
           (single source of truth for the dedicated inference gateway). */}}
    {{- mergeOverwrite (.Values.inferenceServiceConfig.ingress | fromJson) (dict "ingressDomain" (include "kserve.kserveDomain" .) "urlScheme" (include "kserve.kserveUrlScheme" .) "ingressGateway" (include "kserve.kserveGatewayRef" .)) | toJson | nindent 4 }}
  logger: |-
    {
        "image" : "{{- $registry := include "kserve.suseImageRegistry" (dict "ctx" . "registry" .Values.inferenceServiceConfig.loggerConfig.image.registry) -}}{{- if $registry }}{{ $registry }}/{{ end }}{{ .Values.inferenceServiceConfig.loggerConfig.image.repository }}:{{ .Values.inferenceServiceConfig.loggerConfig.image.tag }}",
        "memoryRequest": "{{ .Values.inferenceServiceConfig.loggerConfig.memoryRequest }}",
        "memoryLimit": "{{ .Values.inferenceServiceConfig.loggerConfig.memoryLimit }}",
        "cpuRequest": "{{ .Values.inferenceServiceConfig.loggerConfig.cpuRequest }}",
        "cpuLimit": "{{ .Values.inferenceServiceConfig.loggerConfig.cpuLimit }}",
        "defaultUrl": "{{ .Values.inferenceServiceConfig.loggerConfig.defaultUrl }}"
    }
  metricsAggregator: |-
    {{- .Values.inferenceServiceConfig.metricsAggregator | nindent 4 }}
  router: |-
    {
        "image" : "{{- $registry := include "kserve.suseImageRegistry" (dict "ctx" . "registry" .Values.inferenceServiceConfig.routerConfig.image.registry) -}}{{- if $registry }}{{ $registry }}/{{ end }}{{ .Values.inferenceServiceConfig.routerConfig.image.repository }}:{{ .Values.inferenceServiceConfig.routerConfig.image.tag }}",
        "memoryRequest": "{{ .Values.inferenceServiceConfig.routerConfig.memoryRequest }}",
        "memoryLimit": "{{ .Values.inferenceServiceConfig.routerConfig.memoryLimit }}",
        "cpuRequest": "{{ .Values.inferenceServiceConfig.routerConfig.cpuRequest }}",
        "cpuLimit": "{{ .Values.inferenceServiceConfig.routerConfig.cpuLimit }}"
    }
  storageInitializer: |-
    {
        "image" : "{{- $registry := include "kserve.suseImageRegistry" (dict "ctx" . "registry" .Values.inferenceServiceConfig.storageInitializerConfig.image.registry) -}}{{- if $registry }}{{ $registry }}/{{ end }}{{ .Values.inferenceServiceConfig.storageInitializerConfig.image.repository }}:{{ .Values.inferenceServiceConfig.storageInitializerConfig.image.tag }}",
        "memoryRequest": "{{ .Values.inferenceServiceConfig.storageInitializerConfig.memoryRequest }}",
        "memoryLimit": "{{ .Values.inferenceServiceConfig.storageInitializerConfig.memoryLimit }}",
        "cpuRequest": "{{ .Values.inferenceServiceConfig.storageInitializerConfig.cpuRequest }}",
        "cpuLimit": "{{ .Values.inferenceServiceConfig.storageInitializerConfig.cpuLimit }}",
        "storageSpecSecretName": "{{ .Values.inferenceServiceConfig.storageInitializerConfig.storageSpecSecretName }}",
        "caBundleConfigMapName": "{{ .Values.inferenceServiceConfig.storageInitializerConfig.caBundleConfigMapName }}",
        "caBundleVolumeMountPath": "{{ .Values.inferenceServiceConfig.storageInitializerConfig.caBundleVolumeMountPath }}",
        "enableModelcar": {{ .Values.inferenceServiceConfig.storageInitializerConfig.enableModelcar }},
        "cpuModelcar": "{{ .Values.inferenceServiceConfig.storageInitializerConfig.cpuModelcar }}",
        "memoryModelcar": "{{ .Values.inferenceServiceConfig.storageInitializerConfig.memoryModelcar }}",
        "uidModelcar": {{ .Values.inferenceServiceConfig.storageInitializerConfig.uidModelcar }}
    }
kind: ConfigMap
metadata:
  labels:
    app: kserve
    app.kubernetes.io/name: kserve
  name: inferenceservice-config
  namespace: kubeflow
