apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: kserve
    app.kubernetes.io/name: kserve
    control-plane: kserve-controller-manager
    controller-tools.k8s.io: '1.0'
  name: kserve-controller-manager
  namespace: kubeflow
spec:
  replicas: {{ .Values.controllerManager.replicaCount }}
  selector:
    matchLabels:
      app: kserve
      app.kubernetes.io/name: kserve
      control-plane: kserve-controller-manager
      controller-tools.k8s.io: '1.0'
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        sidecar.istio.io/inject: 'false'
      labels:
        app: kserve
        app.kubernetes.io/name: kserve
        control-plane: kserve-controller-manager
        controller-tools.k8s.io: '1.0'
    spec:
      {{- include "kserve.imagePullSecrets" . | nindent 6 }}
      containers:
      - args:
        - --metrics-addr=127.0.0.1:8080
        - --leader-elect
        command:
        - /manager
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: SECRET_NAME
          value: kserve-webhook-server-cert
        image: "{{- $registry := include "kserve.suseImageRegistry" (dict "ctx" . "registry" .Values.controllerManager.image.registry) -}}{{- if $registry }}{{ $registry }}/{{ end }}{{ .Values.controllerManager.image.repository }}{{- if .Values.controllerManager.image.digest }}@{{ .Values.controllerManager.image.digest }}{{- else }}:{{ .Values.controllerManager.image.tag }}{{- end }}"
        imagePullPolicy: {{ .Values.controllerManager.image.pullPolicy }}
        name: manager
        ports:
          - containerPort: 9443
            name: webhook-server
            protocol: TCP
        livenessProbe:
          tcpSocket:
            port: 9443
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 9443
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        {{- with .Values.controllerManager.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
        volumeMounts:
          - mountPath: /tmp/k8s-webhook-server/serving-certs
            name: cert
            readOnly: true
      - args:
        - --secure-listen-address=0.0.0.0:8443
        - --upstream=http://127.0.0.1:8080/
        - --logtostderr=true
        - --v=10
        image: "{{- $registry := include "kserve.suseApplicationCollectionRegistry" (dict "ctx" . "registry" .Values.kubeRbacProxy.image.registry) -}}{{- if $registry }}{{ $registry }}/{{ end }}{{ .Values.kubeRbacProxy.image.repository }}{{- if .Values.kubeRbacProxy.image.digest }}@{{ .Values.kubeRbacProxy.image.digest }}{{- else }}:{{ .Values.kubeRbacProxy.image.tag }}{{- end }}"
        name: kube-rbac-proxy
        ports:
          - containerPort: 8443
            name: https
            protocol: TCP
        {{- with .Values.kubeRbacProxy.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      securityContext:
        runAsNonRoot: true
      serviceAccountName: kserve-controller-manager
      terminationGracePeriodSeconds: 10
      volumes:
      - name: cert
        secret:
          defaultMode: 420
          secretName: kserve-webhook-server-cert
