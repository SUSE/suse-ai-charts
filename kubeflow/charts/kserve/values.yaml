# Domain for InferenceService external URLs.
# Automatically set from global.kserveDomain.
ingressDomain: "example.com"

# Scheme KServe stamps into each InferenceService's status.url.
# Automatically set from global.kserveExternalHttps.
urlScheme: "http"

inferenceServiceConfig:
  agentConfig:
    image:
      registry: registry.suse.com
      repository: ai/containers/kserve/agent
      tag: v0.19.0
    memoryRequest: "100Mi"
    memoryLimit: "1Gi"
    cpuRequest: "100m"
    cpuLimit: "1"

  batcherConfig:
    image:
      registry: registry.suse.com
      repository: ai/containers/kserve/agent
      tag: v0.19.0
    memoryRequest: "1Gi"
    memoryLimit: "1Gi"
    cpuRequest: "1"
    cpuLimit: "1"

  credentials: |
    {
       "gcs": {
           "gcsCredentialFileName": "gcloud-application-credentials.json"
       },
       "s3": {
           "s3AccessKeyIDName": "AWS_ACCESS_KEY_ID",
           "s3SecretAccessKeyName": "AWS_SECRET_ACCESS_KEY",
           "s3Endpoint": "",
           "s3UseHttps": "",
           "s3Region": "",
           "s3VerifySSL": "",
           "s3UseVirtualBucket": "",
           "s3UseAnonymousCredential": "",
           "s3CABundle": ""
       }
    }
  deploy: |
    {
      "defaultDeploymentMode": "Serverless"
    }

  explainersConfig:
    alibi:
      image:
        registry: registry.suse.com
        repository: ai/containers/kserve/alibi-explainer
        tag: v0.19.0
    aix:
      image:
        registry: registry.suse.com
        repository: ai/containers/kserve/aix-explainer
        tag: v0.19.0
    art:
      image:
        registry: registry.suse.com
        repository: ai/containers/kserve/art-explainer
        tag: v0.19.0

  # NOTE: ingressGateway is the DEDICATED KServe gateway (rendered by the
  # kubeflow-istio-resources sub-chart), not the shared kubeflow-gateway — so the
  # Knative net-istio readiness prober only probes that gateway's ports and stays
  # independent of the dashboard's :443 TLS. When installed under the umbrella it
  # is overridden by global.kserveGateway.name (single source of truth); the value
  # below is only the fallback for standalone kserve installs.
  ingress: |
    {
      "ingressGateway": "kubeflow/kserve-ingress-gateway",
      "ingressService": "istio.istio-system.svc.cluster.local",
      "localGateway": "knative-serving/knative-local-gateway",
      "localGatewayService": "knative-local-gateway.istio-system.svc.cluster.local",
      "ingressDomain": "example.com",
      "ingressClassName": "istio",
      "domainTemplate": "{{ .Name }}-{{ .Namespace }}.{{ .IngressDomain }}",
      "urlScheme": "http",
      "disableIstioVirtualHost": false
    }

  loggerConfig:
    image:
      registry: registry.suse.com
      repository: ai/containers/kserve/agent
      tag: v0.19.0
    memoryRequest: "100Mi"
    memoryLimit: "1Gi"
    cpuRequest: "100m"
    cpuLimit: "1"
    defaultUrl: "http://default-broker"

  metricsAggregator: |
    {
      "enableMetricAggregation": "false",
      "enablePrometheusScraping" : "false"
    }

  routerConfig:
    image:
      registry: registry.suse.com
      repository: ai/containers/kserve/router
      tag: v0.19.0
    memoryRequest: "100Mi"
    memoryLimit: "1Gi"
    cpuRequest: "100m"
    cpuLimit: "1"

  storageInitializerConfig:
    image:
      registry: registry.suse.com
      repository: ai/containers/kserve/storage-initializer
      tag: v0.19.0
    memoryRequest: "100Mi"
    memoryLimit: "1Gi"
    cpuRequest: "100m"
    cpuLimit: "1"
    storageSpecSecretName: "storage-config"
    caBundleConfigMapName: ""
    caBundleVolumeMountPath: "/etc/ssl/custom-certs"
    enableModelcar: false
    cpuModelcar: "10m"
    memoryModelcar: "15Mi"
    uidModelcar: 10
