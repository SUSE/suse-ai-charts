global:
  # -- Global override for container image registry
  imageRegistry: ""
  # -- Global override for SUSE AI container image registry (staging vs production)
  suseRegistry: ""
  # -- Global override for Application Collection image registry (e.g. dp.apps.rancher.io mirror)
  suseApplicationCollection: ""
  # -- Global override for container image registry pull secrets
  imagePullSecrets: []

# Top-level registry fallback for SUSE AI images
image:
  registry: registry.suse.com

# Top-level fallback registry for Application Collection images
appCollection:
  registry: dp.apps.rancher.io

controllerManager:
  # Increase to 2+ via ha-overrides.yaml for HA deployments.
  replicaCount: 1
  image:
    registry: registry.suse.com
    repository: ai/containers/kserve-controller
    tag: v0.16.0
    pullPolicy: IfNotPresent
    digest: ""  # optional: sha256:... pins this image for supply-chain security
  resources:
    limits:
      cpu: 100m
      memory: 300Mi
    requests:
      cpu: 100m
      memory: 200Mi

kubeRbacProxy:
  image:
    registry: dp.apps.rancher.io
    repository: containers/kube-rbac-proxy
    tag: "0.20.2"
    pullPolicy: IfNotPresent
    digest: ""  # optional: sha256:... pins this image for supply-chain security
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

storageInitializer:
  image:
    registry: registry.suse.com
    repository: ai/containers/storage-initializer
    tag: v0.16.0
    pullPolicy: IfNotPresent

# Serving runtime images - these are used by ClusterServingRuntime resources
tensorflowServing:
  image:
    registry: registry.suse.com
    repository: ai/containers/serving
    tag: "2.6.2"
    pullPolicy: IfNotPresent

huggingfaceServer:
  image:
    registry: registry.suse.com
    repository: ai/containers/huggingfaceserver
    tag: v0.16.0
    pullPolicy: IfNotPresent

xgbServer:
  image:
    registry: registry.suse.com
    repository: ai/containers/xgbserver
    tag: v0.15.2
    pullPolicy: IfNotPresent

lgbServer:
  image:
    registry: registry.suse.com
    repository: ai/containers/lgbserver
    tag: v0.15.2
    pullPolicy: IfNotPresent

sklearnServer:
  image:
    registry: registry.suse.com
    repository: ai/containers/sklearnserver
    tag: v0.15.2
    pullPolicy: IfNotPresent

paddleServer:
  image:
    registry: registry.suse.com
    repository: ai/containers/paddleserver
    tag: v0.15.2
    pullPolicy: IfNotPresent

pmmlServer:
  image:
    registry: registry.suse.com
    repository: ai/containers/pmmlserver
    tag: v0.15.2
    pullPolicy: IfNotPresent

tritonServer:
  image:
    registry: nvcr.io
    repository: nvidia/tritonserver
    tag: "23.05-py3"
    pullPolicy: IfNotPresent

mlServer:
  image:
    registry: registry.suse.com
    repository: ai/containers/mlserver
    tag: "1.5.0"
    pullPolicy: IfNotPresent

torchServe:
  image:
    registry: registry.suse.com
    repository: ai/containers/torchserve-kfs
    tag: "0.9.0"
    pullPolicy: IfNotPresent

# Domain for InferenceService external URLs.
# Must match knativeServing.domain — both are set from the _kserveAccess.domain
# anchor in the umbrella chart so they stay in sync automatically.
ingressDomain: "example.com"

inferenceServiceConfig:
  agentConfig:
    image:
      repository: ai/containers/agent
      tag: v0.16.0
    memoryRequest: "100Mi"
    memoryLimit: "1Gi"
    cpuRequest: "100m"
    cpuLimit: "1"

  batcherConfig:
    image:
      repository: ai/containers/agent
      tag: v0.16.0
    memoryRequest: "1Gi"
    memoryLimit: "1Gi"
    cpuRequest: "1"
    cpuLimit: "1"

  credentials: |
    {
       "gcs": {
           "gcsCredentialFileName": "gcloud-application-credentials.json"
       },
       "s3": {
           "s3AccessKeyIDName": "AWS_ACCESS_KEY_ID",
           "s3SecretAccessKeyName": "AWS_SECRET_ACCESS_KEY",
           "s3Endpoint": "",
           "s3UseHttps": "",
           "s3Region": "",
           "s3VerifySSL": "",
           "s3UseVirtualBucket": "",
           "s3UseAnonymousCredential": "",
           "s3CABundle": ""
       }
    }
  deploy: |
    {
      "defaultDeploymentMode": "Serverless"
    }

  explainersConfig:
    alibi:
      image:
        repository: ai/containers/alibi-explainer
        tag: v0.16.0
    aix:
      image:
        repository: ai/containers/aix-explainer
        tag: v0.16.0
    art:
      image:
        registry: kserve
        repository: art-explainer
        tag: v0.16.0

  ingress: |
    {
      "ingressGateway": "kubeflow/kubeflow-gateway",
      "ingressService": "istio.istio-system.svc.cluster.local",
      "localGateway": "knative-serving/knative-local-gateway",
      "localGatewayService": "knative-local-gateway.istio-system.svc.cluster.local",
      "ingressDomain": "example.com",
      "ingressClassName": "istio",
      "domainTemplate": "{{ .Name }}-{{ .Namespace }}.{{ .IngressDomain }}",
      "urlScheme": "http",
      "disableIstioVirtualHost": false
    }

  loggerConfig:
    image:
      repository: ai/containers/agent
      tag: v0.16.0
    memoryRequest: "100Mi"
    memoryLimit: "1Gi"
    cpuRequest: "100m"
    cpuLimit: "1"
    defaultUrl: "http://default-broker"

  metricsAggregator: |
    {
      "enableMetricAggregation": "false",
      "enablePrometheusScraping" : "false"
    }

  routerConfig:
    image:
      repository: ai/containers/router
      tag: v0.16.0
    memoryRequest: "100Mi"
    memoryLimit: "1Gi"
    cpuRequest: "100m"
    cpuLimit: "1"

  storageInitializerConfig:
    image:
      repository: ai/containers/storage-initializer
      tag: v0.16.0
    memoryRequest: "100Mi"
    memoryLimit: "1Gi"
    cpuRequest: "100m"
    cpuLimit: "1"
    storageSpecSecretName: "storage-config"
    caBundleConfigMapName: ""
    caBundleVolumeMountPath: "/etc/ssl/custom-certs"
    enableModelcar: false
    cpuModelcar: "10m"
    memoryModelcar: "15Mi"
    uidModelcar: 10
