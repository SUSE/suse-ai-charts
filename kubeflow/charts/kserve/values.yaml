    pullPolicy: IfNotPresent

lgbServer:
  image:
    registry: registry.suse.com
    repository: ai/containers/kserve/lgbserver
    tag: v0.19.0
    pullPolicy: IfNotPresent

sklearnServer:
  image:
    registry: registry.suse.com
    repository: ai/containers/kserve/sklearnserver
