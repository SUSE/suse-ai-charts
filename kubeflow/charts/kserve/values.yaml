global:
  # -- Global override for container image registry
  imageRegistry: ""
  # -- Global override for SUSE AI container image registry (staging vs production)
  suseRegistry: ""
  # -- Global override for Application Collection image registry (e.g. dp.apps.rancher.io mirror)
  suseApplicationCollectionRegistry: ""
  # -- Global override for container image registry pull secrets
  imagePullSecrets: []

controllerManager:
  # Increase to 2+ via ha-overrides.yaml for HA deployments.
  replicaCount: 1
  image:
    registry: registry.suse.com
    repository: ai/containers/kserve/kserve-controller
    tag: v0.19.0
    pullPolicy: IfNotPresent
    digest: ""  # optional: sha256:... pins this image for supply-chain security
  resources:
    limits:
      cpu: 100m
      memory: 300Mi
    requests:
      cpu: 100m
      memory: 200Mi

kubeRbacProxy:
  image:
    registry: dp.apps.rancher.io
    repository: containers/kube-rbac-proxy
    tag: "0.22.0"
    pullPolicy: IfNotPresent
    digest: ""  # optional: sha256:... pins this image for supply-chain security
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

storageInitializer:
  image:
    registry: registry.suse.com
    repository: ai/containers/kserve/storage-initializer
    tag: v0.19.0
    pullPolicy: IfNotPresent

