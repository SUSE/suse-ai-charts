# Default values for kubeflow-istio-resources

# Global defaults for standalone sub-chart installs. When this chart is installed
# as a dependency of the umbrella `kubeflow` chart, the parent's globals override
# these. They must exist here so a standalone `helm install`/`template` does not
# nil-pointer: several templates dereference nested global fields directly —
# .Values.global.gateway.name (dex / oauth2-proxy VirtualServices) and
# .Values.global.oauth2Proxy.enabled (authn EnvoyFilter, oauth2-proxy resources) —
# where an absent parent map errors before any `| default` can apply.
global:
  # Master switch for the oauth2-proxy auth layer (ext_authz chain).
  # Default false for a STANDALONE sub-chart install: this chart does not ship
  # oauth2-proxy itself (the umbrella `kubeflow` chart does), so defaulting to
  # true here would render the authn EnvoyFilter pointing ext_authz at an
  # oauth2-proxy service that doesn't exist — every request through the gateway
  # would then 503. The umbrella overrides this to true (parent globals win), so
  # the bundled auth chain is still enabled for the normal umbrella install.
  oauth2Proxy:
    enabled: false
    # Ingress-gateway auth mode: "native" (upstream Istio-native ext_authz) or
    # "envoyfilter" (self-contained EnvoyFilter). See umbrella values.yaml. The
    # native CRs / authn EnvoyFilter render per this value; umbrella parent overrides.
    gatewayAuthMode: native
  # Istio ingress-gateway identity — single source of truth.
  # Standalone default reproduces the Rancher literals; umbrella parent overrides.
  # Rancher/AppCo Istio: SA 'istio', selector {istio: istio}.
  # Upstream Istio: 'istio-ingressgateway-service-account', {istio: ingressgateway}.
  istio:
    ingressGateway:
      principal: "cluster.local/ns/istio-system/sa/istio"
      selector:
        istio: istio
  # Dashboard gateway (kubeflow-gateway): the VirtualServices in this chart bind to it. hostname "" serves
  # the wildcard listener (IP / NodePort access); externalDNS annotates the Gateway for an external-dns.
  gateway:
    name: "kubeflow/kubeflow-gateway"
    hostname: ""
    externalDNS: false
  # Gateway TLS (see the umbrella values.yaml for every option). source: "" | selfSigned | letsEncrypt |
  # secret | issuerRef | edge. STANDALONE NOTE: the Certificates and issuers that create the TLS Secret live
  # in the umbrella chart; installed on its own, this chart only references Secrets, so use source "secret"
  # (or "edge") and create the Secret(s) yourself.
  tls:
    source: ""
    secretName: kubeflow-gateway-tls
    httpsRedirect: true
    letsEncrypt:
      server: prod
      solver: cloudflare
  # KServe inference exposure: the dedicated kserve-ingress-gateway ("<namespace>/<name>"; knative-serving
  # and kserve reference the same value) and the external-HTTPS opt-in.
  kserve:
    domain: ""
    externalHttps: false
    gateway:
      name: "kubeflow/kserve-ingress-gateway"
      enabled: true
    tls:
      secretName: ""

# Gateway server configuration (plain-HTTP port; annotations are added to kubeflow-gateway)
gateway:
  annotations: {}
  port:
    name: http
    number: 80
    protocol: HTTP
