apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: dex
  namespace: kubeflow
spec:
  gateways:
  - {{ .Values.global.gateway.name | default "kubeflow/kubeflow-gateway" }}
  hosts:
  - '*'
  http:
  - match:
    - uri:
        prefix: /dex
    route:
    - destination:
        host: kubeflow-dex.kubeflow.svc.cluster.local
        port:
          number: 5556
