{{/*
Sub-chart prerequisite validations. This file renders nothing but fails fast
with a human-readable error when the gateway / KServe-external-HTTPS options are
misconfigured.

kubeflow-istio-resources is independently installable, so these guards must live
here (not only in the umbrella templates/validations.yaml) — a standalone install
sets .Values.hostname and global.kserveExternalHttps / global.kserveDomain
directly, bypassing the umbrella checks. Keep the messages consistent with the
umbrella copy.
*/}}

{{- /*
  Reject a literal '*' as the gateway hostname. Leaving hostname empty already
  serves the wildcard '*' listener for IP/NodePort access; setting hostname: "*"
  additionally makes the auth-bypass filter trust every host, reinstating the
  auth bypass on an internet-facing named listener. Use "" for wildcard access.
  NOTE: values.schema.json (hostname `not: { pattern: "\\*" }`) is now the PRIMARY
  reject and fires before this template renders, so this fail() is normally
  unreachable. It is kept as defense-in-depth: it still catches '*' if the schema
  pattern is ever weakened or schema validation is skipped.
*/}}
{{- if and .Values.hostname (eq .Values.hostname "*") }}
{{- fail "kubeflow-istio-resources.hostname must not be '*'. Leave it empty (\"\") for wildcard / IP+NodePort access, or set a concrete FQDN to scope the gateway (and the auth bypass) to that host." }}
{{- end }}

{{- /*
  KServe external HTTPS: the dedicated kserve-ingress-gateway wildcard cert only
  works if a real gateway hostname is set and the ACME challenge can issue a
  wildcard. Without a hostname the dashboard gateway serves the '*' listener with
  is_trusted_host=true; the dedicated kserve-ingress-gateway template refuses to
  render its "*.<domain>:443" wildcard server in that case, and we fail fast here
  so the misconfiguration is explicit rather than silently dropped.
*/}}
{{- if and .Values.global .Values.global.kserveExternalHttps }}
{{-   $g := .Values.global | default dict }}
{{-   $tlsSource := .Values.tls.source | default "" }}
{{-   $errs := list }}
{{-   if not .Values.global.kserveDomain }}
{{-     $errs = append $errs "global.kserveDomain must be set (a scoped subdomain such as \"models.example.com\" is recommended over a bare org-wide domain) to use global.kserveExternalHttps — it is the base domain for the '*.<kserveDomain>' wildcard cert and inference hosts." }}
{{-   end }}
{{-   if not (and .Values.global.oauth2Proxy .Values.global.oauth2Proxy.enabled) }}
{{-     $errs = append $errs "global.oauth2Proxy.enabled must be true to use global.kserveExternalHttps — the bundled ext_authz auth chain (authn-filter EnvoyFilter) is only rendered when oauth2-proxy is enabled, so with it disabled the '*.<kserveDomain>:443' wildcard server would perform no gateway auth. Because every app VirtualService binds hosts: ['*'], that exposes the ENTIRE Kubeflow surface (not just inference) unauthenticated. If you front Kubeflow with your own IdP at the gateway, do not enable the bundled global.kserveExternalHttps opt-in." }}
{{-   end }}
{{-   if not .Values.hostname }}
{{-     $errs = append $errs "kubeflow-istio-resources.hostname must be set to use global.kserveExternalHttps — otherwise the gateway serves the '*' listener with the auth-bypass filter trusting every host, and the KServe wildcard server is refused." }}
{{-   end }}
{{-   if not (has $tlsSource (list "letsEncrypt" "selfSigned" "secret" "issuerRef")) }}
{{-     $errs = append $errs "kubeflow-istio-resources.tls.source must be one of {letsEncrypt, selfSigned, secret, issuerRef} to use global.kserveExternalHttps — with source \"\" there is no :443 server or wildcard cert, so advertised https:// inference URLs would be dead." }}
{{-   end }}
{{-   if and (eq $tlsSource "secret") (not .Values.tls.kserveExistingSecret) }}
{{-     $errs = append $errs "kubeflow-istio-resources.tls.kserveExistingSecret must be set when tls.source is \"secret\" and global.kserveExternalHttps is true — the KServe wildcard server needs a Secret whose SAN covers \"*.<global.kserveDomain>\". Reusing the dashboard's tls.existingSecret silently fails the TLS handshake on inference hosts; point this at that Secret only if it is a multi-SAN/wildcard cert covering both hosts." }}
{{-   end }}
{{-   if eq $tlsSource "letsEncrypt" }}
{{- /* `| default dict`: an explicit tls.letsEncrypt: null otherwise nil-derefs
      on `.solver` with a raw Go panic instead of reaching this validation. */}}
{{-     $le := .Values.tls.letsEncrypt | default dict }}
{{-     if eq $le.solver "http01" }}
{{-       $errs = append $errs "tls.letsEncrypt.solver must be a DNS-01 solver (e.g. cloudflare) — Let's Encrypt HTTP-01 cannot issue wildcard certificates." }}
{{-     else if eq ($le.solver | default "cloudflare") "cloudflare" }}
{{-       if not (and .Values.tls.cloudflare .Values.tls.cloudflare.apiTokenSecretRef .Values.tls.cloudflare.apiTokenSecretRef.name) }}
{{-         $errs = append $errs "kubeflow-istio-resources.tls.cloudflare.apiTokenSecretRef.name must be set for the cloudflare DNS-01 solver — the token Secret must exist in cert-manager's namespace (see values.yaml)." }}
{{-       end }}
{{-     end }}
{{-   end }}
{{-   if $errs }}
{{-     fail (printf "global.kserveExternalHttps is true, but the external-HTTPS-for-inference opt-in is incomplete. Fix all of the following:\n  - %s" (join "\n  - " $errs)) }}
{{-   end }}
{{- end }}
