{{- /*
  Native ingress-auth mode — require-jwt DENY AuthorizationPolicy.
  Denies any request that lacks a verified JWT request-principal, EXCEPT the login
  paths (/dex, /oauth2). Together with the CUSTOM ext_authz policy this enforces:
  an unauthenticated request has no principal -> falls to ext_authz -> redirected to
  Dex; an authenticated request carries a Dex JWT -> dex-jwt RequestAuthentication
  sets its principal -> this policy passes it through. Rendered ONLY in native mode.

  NOTE: this selects the shared ingress gateway and
  denies principal-less traffic on all non-login paths. Cookie-less inference POSTs
  to KServe on this SAME gateway would be denied; KServe internal traffic uses the
  dedicated cluster-local gateway, but external shared-gateway inference must be
  scoped/verified before combining native authz with the KServe wildcard-TLS opt-in.
*/}}
{{- if and .Values.global.oauth2Proxy.enabled (eq (include "kubeflow-istio-resources.gatewayAuthMode" .) "native") }}
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: istio-ingressgateway-require-jwt
  namespace: istio-system
spec:
  action: DENY
  selector:
    matchLabels:
      {{- include "kubeflow-istio-resources.ingressGatewaySelector" . | nindent 6 }}
  rules:
  - from:
    - source:
        notRequestPrincipals: ["*"]
    to:
    - operation:
        # Scope the DENY to the gateway's HTTP/HTTPS listener ports. A DENY rule
        # built from HTTP-only attributes (notRequestPrincipals / notPaths) with no
        # port would, for non-HTTP TCP, match unconditionally and deny ALL traffic to
        # every TCP port under the selector (e.g. the 15021 status / 15090 metrics
        # ports) — Istio emits a validation warning for exactly this. Pinning the
        # ports keeps the JWT requirement on real ingress traffic while leaving other
        # TCP ports unaffected.
        #
        # Port 80 is listed UNCONDITIONALLY: the kserve-ingress-gateway hard-codes its
        # plain-HTTP listener at :80, and the kubeflow-gateway's HTTP->HTTPS redirect
        # server is also :80 — neither tracks .Values.gateway.port. If the custom
        # gateway HTTP port below were the only HTTP entry in this list, overriding it
        # to anything other than 80 would leave those :80 listeners OUTSIDE the DENY and
        # the JWT requirement would silently fail OPEN on them. Listing a port the
        # selector never serves is harmless (it simply matches no traffic).
        #
        # The custom HTTP port additionally tracks the kubeflow-gateway's own plain-HTTP
        # server (.Values.gateway.port) for the non-TLS render, so customising it keeps
        # the JWT requirement there too. The HTTPS port is fixed at 443, matching the
        # hard-coded HTTPS server in both gateway templates. If you add HTTP/HTTPS
        # listener ports beyond these, update this rule too.
        ports:
        {{- $httpPort := toString ((.Values.gateway.port | default dict).number | default 80) }}
        - "80"
        {{- if ne $httpPort "80" }}
        - {{ $httpPort | quote }}
        {{- end }}
        - "443"
        notPaths:
        - /dex/*
        - /oauth2/*
{{- end }}
