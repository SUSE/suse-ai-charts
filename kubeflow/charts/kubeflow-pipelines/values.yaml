# Default values for kubeflow-pipelines

# PodDisruptionBudgets for KFP critical path components.
# Enable in production to protect against voluntary disruptions during node drains.
global:
  # -- Global override for container image registry
  imageRegistry: ""
  # -- Global override for SUSE AI container image registry (staging vs production)
  suseRegistry: ""
  # -- Global override for Application Collection image registry (e.g. dp.apps.rancher.io mirror)
  suseApplicationCollectionRegistry: ""
  # -- Global override for container image pull secrets
  imagePullSecrets: []

# PodDisruptionBudgets for KFP critical path components.
# With maxUnavailable: 1 and single replicas this is a no-op; meaningful protection
# requires replicaCount >= 2 (use ha-overrides.yaml).
pdb:
  enabled: true
  maxUnavailable: 1

# MySQL/MariaDB secret configuration.
# password: "" (default) generates a random 24-char password on first install and
# preserves it across upgrades via Helm lookup(). Set an explicit value only if you
# need a deterministic password (e.g. disaster recovery from an external backup).
# On upgrades the existing secret value is always preserved via Helm lookup().
mysqlSecret:
  password: ""  # leave empty for auto-generated password (recommended)

# Database name used by Kubeflow Hub (model registry proxy over the KFP MySQL instance).
# Must match the embedmdDb key in the pipeline-install-config ConfigMap.
embedmdDb: "model_registry"

# Post-install hook Job that creates the metadb database required by MLMD.
# Runs automatically after MariaDB is ready on every install and upgrade.
metadbInit:
  image:
    registry: dp.apps.rancher.io
    repository: containers/mariadb
    tag: "11.8.8-10.1"
    pullPolicy: IfNotPresent
    digest: ""  # optional: sha256:... pins this image for supply-chain security

# MariaDB sub-chart (Rancher oci://dp.apps.rancher.io/charts/mariadb)
mariadb:
  enabled: true
  fullnameOverride: "mysql"
  auth:
    # Reuse the mysql-secret managed by this chart; key "password" holds the root password
    existingSecret: "mysql-secret"
    rootPasswordKey: "password"
    database: "mlpipeline"
    username: ""
    # Disable replication user - single node setup
    replicationUsername: ""
  persistence:
    enabled: true
    storageClassName: ""
    resources:
      requests:
        storage: 20Gi
  metrics:
    enabled: false
  # Scheduled backup CronJob — dumps mlpipeline + metadb to a PVC.
  # Enabled by default; set enabled: false to disable on resource-constrained clusters.
  # To restore: kubectl exec -n kubeflow deploy/mysql -- sh -c
  #   "mariadb --ssl=false -u root < /backup/<filename>.sql"
  backup:
    enabled: true
    schedule: "0 2 * * *"    # daily at 02:00 UTC
    retention: 7              # number of backup files to keep
    storageSize: 10Gi
    storageClass: ""          # empty = cluster default

# Inline SeaweedFS deployment — S3-compatible artifact store for KFP.
# Credentials are shared with all KFP consumers via the 'mlpipeline-minio-artifact' Secret
# (that name is hardcoded in KFP upstream and cannot be changed).
# SeaweedFS reads those credentials via envFrom and registers them as its IAM user.
seaweedfs:
  image:
    registry: registry.suse.com
    repository: ai/containers/chrislusf/seaweedfs
    tag: "4.00"
    pullPolicy: IfNotPresent
  enabled: true
  # S3 credentials — must match the IAM user SeaweedFS registers at startup.
  # These values are written into the 'mlpipeline-minio-artifact' Secret and
  # consumed by all KFP components and the SeaweedFS postStart hook.
  accessKey: kubeflow      # DEMO DEFAULT
  secretKey: kubeflow123   # DEMO DEFAULT
  # existingSecret: if set, the chart will NOT create the mlpipeline-minio-artifact
  # Secret from accessKey/secretKey above. You must pre-create a Secret named
  # 'mlpipeline-minio-artifact' (name is hardcoded by KFP upstream) with keys:
  #   accesskey: <your-access-key>
  #   secretkey: <your-secret-key>
  # Example: kubectl create secret generic mlpipeline-minio-artifact \
  #            --from-literal=accesskey=<key> --from-literal=secretkey=<secret> -n kubeflow
  existingSecret: ""
  persistence:
    size: 20Gi
    storageClass: ""
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

# kfp-launcher — init container injected into every pipeline task pod.
# Pinned to match the API server version; kfp-launcher:latest now defaults
# to seaweedfs.kubeflow:9000 (upstream migration) which does not exist here.
launcher:
  image:
