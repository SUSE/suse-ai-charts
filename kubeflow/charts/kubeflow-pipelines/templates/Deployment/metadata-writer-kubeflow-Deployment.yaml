apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: metadata-writer
    app.kubernetes.io/component: ml-pipeline
    app.kubernetes.io/name: kubeflow-pipelines
    application-crd-id: kubeflow-pipelines
  name: metadata-writer
  namespace: kubeflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metadata-writer
      app.kubernetes.io/component: ml-pipeline
      app.kubernetes.io/name: kubeflow-pipelines
      application-crd-id: kubeflow-pipelines
  template:
    metadata:
      labels:
        app: metadata-writer
        app.kubernetes.io/component: ml-pipeline
        app.kubernetes.io/name: kubeflow-pipelines
        application-crd-id: kubeflow-pipelines
    spec:
      {{- include "kubeflow-pipelines.imagePullSecrets" . | nindent 6 }}
      containers:
      - env:
        - name: NAMESPACE_TO_WATCH
          value: ''
        image: "{{ include "kubeflow-pipelines.suseImageRegistry" . }}/{{ .Values.metadataWriter.image.repository }}{{- if .Values.metadataWriter.image.digest }}@{{ .Values.metadataWriter.image.digest }}{{- else }}:{{ .Values.metadataWriter.image.tag }}{{- end }}"
        imagePullPolicy: {{ .Values.metadataWriter.image.pullPolicy }}
        name: main
        {{- with .Values.metadataWriter.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      serviceAccountName: kubeflow-pipelines-metadata-writer
