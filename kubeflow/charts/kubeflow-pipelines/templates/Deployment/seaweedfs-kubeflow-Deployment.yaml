apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: seaweedfs
    app.kubernetes.io/component: ml-pipeline
    app.kubernetes.io/name: kubeflow-pipelines
    application-crd-id: kubeflow-pipelines
  name: seaweedfs
  namespace: kubeflow
spec:
  selector:
    matchLabels:
      app: seaweedfs
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        # SeaweedFS does not run in the Istio mesh — native sidecar injection causes
        # the K3s 1.34 kubelet to never start the main container (PodInitializing deadlock).
        # S3 clients authenticate via accessKey/secretKey; no mTLS needed for object storage.
        # The DestinationRule is set to DISABLE so mesh clients skip mTLS to this pod.
        sidecar.istio.io/inject: 'false'
      labels:
        app: seaweedfs
        app.kubernetes.io/component: ml-pipeline
        app.kubernetes.io/name: kubeflow-pipelines
        application-crd-id: kubeflow-pipelines
    spec:
      # Give SeaweedFS time to flush and release LevelDB flock before pod is removed.
      # Without this, a rapid delete+recreate races against the flock and the new
      # pod gets "resource temporarily unavailable" on /data/filerldb2/00/LOCK.
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1000
        # Only re-chown the /data volume when its top-level ownership does not already
        # match fsGroup — avoids a full recursive relabel on every restart of a large
        # volume. Matches the upstream community-distribution seaweedfs profile.
        fsGroupChangePolicy: "OnRootMismatch"
      serviceAccountName: seaweedfs
      {{- include "kubeflow-pipelines.imagePullSecrets" . | nindent 6 }}
      containers:
      - name: seaweedfs
        image: "{{- $registry := include "kubeflow-pipelines.suseImageRegistry" (dict "ctx" . "registry" .Values.seaweedfs.image.registry) -}}{{- if $registry }}{{ $registry }}/{{ end }}{{ .Values.seaweedfs.image.repository }}{{- if .Values.seaweedfs.image.digest }}@{{ .Values.seaweedfs.image.digest }}{{- else }}:{{ .Values.seaweedfs.image.tag }}{{- end }}"
        imagePullPolicy: IfNotPresent
        args:
        - server
        - -dir=/data
        - -s3
        - -iam
        - -filer
        - -master.volumePreallocate=false
        # Each S3 bucket maps to its own SeaweedFS collection (SeaweedFS enforces
        # 1 bucket = 1 collection; it cannot be shared). By default each collection
        # grows volumes in batches of 7 (WEED_MASTER_VOLUME_GROWTH_COPY_1, set to 1
        # below) and the per-directory cap is disk-auto (~14 on a small disk), so a
        # third bucket exhausts it and new PutObjects fail with "No writable volumes
        # / Not enough data nodes". With growth=1 each bucket costs ~1 volume, so a
        # modest explicit cap covers many buckets. Empty slots are cheap and real
        # usage stays bounded by persistence.size, so this is safe on a single node.
        # (Upstream relies on a single bucket and does not tune this; SUSE creates
        # per-model KServe buckets, so we add the safeguard.)
        - -volume.max={{ .Values.seaweedfs.volumeMax }}
        # Run as the seaweed user (uid/gid 1000) directly. The image entrypoint
        # otherwise starts as root and chown+su-execs down to this user, which
        # needs CHOWN/SETUID/SETGID and crash-loops under a dropped-capability
        # context. Running as 1000 up front skips that privileged dance: the pod
        # fsGroup (1000, below) makes the /data PVC group-writable, and the
        # entrypoint detects it is already the seaweed user and execs weed
        # directly. This keeps the container non-root with all capabilities
        # dropped (Pod Security "restricted" posture), matching the upstream
        # community-distribution seaweedfs securityContext. readOnlyRootFilesystem
        # is intentionally NOT set (upstream omits it too) — the postStart weed
        # shell and /tmp scratch writes need a writable root fs.
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          privileged: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
        env:
        # Grow one volume at a time per collection instead of the default batch of 7,
        # so each S3 bucket costs ~1 volume rather than ~7. The embedded master in
        # `weed server` honours this WEED_MASTER_* viper binding (verified live).
        - name: WEED_MASTER_VOLUME_GROWTH_COPY_1
          value: "1"
        envFrom:
        - secretRef:
            name: mlpipeline-minio-artifact
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/sh
              - -c
              - |
                # Wait for master+filer to be ready, then configure IAM user and bucket.
                # Uses 127.0.0.1 (not localhost) because /etc/hosts maps localhost to ::1
                # and SeaweedFS only listens on IPv4.
                # Pipes stdin because weed shell 4.x does not support -run flag.
                # -actions=Admin (no -buckets) gives full S3 admin access to all buckets,
                # matching S3 admin access so KFP and KServe can create buckets freely.
                #
                # Loop until the identity is actually PERSISTED. During early startup
                # the filer can echo the applied config (satisfying a naive grep of the
                # apply output) before the write lands, leaving S3 with no identity and
                # every signed request rejected. So we apply, then verify with a fresh
                # read-back (bare s3.configure prints the stored config) and only exit
                # once the user is present in the persisted config; a raced/lost write
                # is retried on the next iteration.
                #
                # The verify grep is whitespace-tolerant ("name"<ws>:<ws>"kubeflow-admin")
                # so a change in SeaweedFS's JSON marshalling (compact vs indented) does
                # not silently break the match. The loop is also BOUNDED: an unbounded
                # "until" here would hang postStart forever with stderr discarded, so a
                # default install could wedge with nothing in the logs. After max_attempts
                # we log the failure (WITHOUT dumping the stored config, which contains
                # the S3 access/secret keys in cleartext) and exit non-zero, surfacing a
                # FailedPostStartHook event instead of a silent hang.
                attempt=0
                max_attempts=60
                until \
                  printf '%s\n%s\n' \
                    "s3.bucket.create -name mlpipeline" \
                    "s3.configure -access_key=${accesskey} -secret_key=${secretkey} -user=kubeflow-admin -actions=Admin -apply" \
                    | weed shell -master 127.0.0.1:9333 >/dev/null 2>&1; \
                  printf 's3.configure\n' \
                    | weed shell -master 127.0.0.1:9333 2>/dev/null \
                    | grep -Eq '"name"[[:space:]]*:[[:space:]]*"kubeflow-admin"'; do
                  attempt=$((attempt + 1))
                  if [ "$attempt" -ge "$max_attempts" ]; then
                    # Do NOT dump the stored s3.configure output here: it prints
                    # accessKey/secretKey in cleartext, which would leak the S3
                    # credentials into `kubectl logs`. Report only whether the
                    # identity was found; the FailedPostStartHook event surfaces
                    # the failure without exposing secrets.
                    echo "seaweedfs postStart: kubeflow-admin S3 identity not persisted after ${max_attempts} attempts (${max_attempts}x3s). Check master/filer readiness on 127.0.0.1:9333." >&2
                    exit 1
                  fi
                  sleep 3
                done
          preStop:
            exec:
              # Give SeaweedFS time to flush and release the LevelDB flock cleanly
              # before kubelet sends SIGTERM to the container process.
              command: ["/bin/sh", "-c", "sleep 5"]
        ports:
        - name: http-s3
          containerPort: 8333
        - name: http-iam
          containerPort: 8111
        - name: http-master
          containerPort: 9333
        - name: http-filer
          containerPort: 8888
        # Startup probe: allow up to 5 min for IAM bootstrap (postStart) to complete.
        # Master /cluster/status returns 200 once the server is accepting requests.
        startupProbe:
          httpGet:
            path: /cluster/status
            port: 9333
          failureThreshold: 60
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /cluster/status
            port: 9333
          initialDelaySeconds: 0
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /cluster/status
            port: 9333
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        {{- with .Values.seaweedfs.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
        - mountPath: /data
          name: seaweedfs-pvc
      volumes:
      - name: seaweedfs-pvc
        persistentVolumeClaim:
          claimName: seaweedfs-pvc
