apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: metacontroller
    application-crd-id: kubeflow-pipelines
    kustomize.component: metacontroller
  name: metacontroller
  namespace: kubeflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metacontroller
      application-crd-id: kubeflow-pipelines
      kustomize.component: metacontroller
  serviceName: ''
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: 'false'
        # Restart, and so resync every profile, when what the profile controller syncs changes.
        checksum/profile-controller: {{ print (.Files.Get "files/profile-controller/sync.py")
          (include (print $.Template.BasePath "/DecoratorController/kubeflow-pipelines-profile-controller-kubeflow-DecoratorController.yaml") .)
          (include (print $.Template.BasePath "/ConfigMap/kubeflow-pipelines-profile-controller-env-5252m69c4c-kubeflow-ConfigMap.yaml") .)
          .Values.artifacts.proxyEnabled .Values.artifacts.retentionDays | sha256sum | trunc 16 }}
      labels:
        app: metacontroller
        application-crd-id: kubeflow-pipelines
        kustomize.component: metacontroller
    spec:
      {{- include "kubeflow-pipelines.imagePullSecrets" . | nindent 6 }}
      containers:
      - command:
        - /usr/bin/metacontroller
        - --zap-log-level=4
        - --discovery-interval=3600s
        image: "{{- $registry := include "kubeflow-pipelines.suseApplicationCollectionRegistry" (dict "ctx" . "registry" .Values.metacontroller.image.registry) -}}{{- if $registry }}{{ $registry }}/{{ end }}{{ .Values.metacontroller.image.repository }}{{- if .Values.metacontroller.image.digest }}@{{ .Values.metacontroller.image.digest }}{{- else }}:{{ .Values.metacontroller.image.tag }}{{- end }}"
        imagePullPolicy: {{ .Values.metacontroller.image.pullPolicy }}
        name: metacontroller
        {{- with .Values.metacontroller.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
      serviceAccountName: meta-controller-service
  volumeClaimTemplates: []
