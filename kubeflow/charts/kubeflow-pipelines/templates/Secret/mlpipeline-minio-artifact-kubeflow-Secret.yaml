{{- if not .Values.seaweedfs.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  labels:
    application-crd-id: kubeflow-pipelines
  name: mlpipeline-minio-artifact
  namespace: kubeflow
stringData:
  accesskey: {{ .Values.seaweedfs.accessKey | quote }}
  secretkey: {{ .Values.seaweedfs.secretKey | quote }}
{{- end }}
