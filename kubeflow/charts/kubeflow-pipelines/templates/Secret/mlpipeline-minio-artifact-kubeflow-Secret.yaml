{{- if not .Values.seaweedfs.existingSecret }}
{{- /* An empty accessKey or secretKey takes the demo value (kubeflow / kubeflow123) with
       global.demoMode=true; otherwise it is generated on first install and kept on upgrade (lookup),
       and the umbrella fails a render that can't see the cluster. */}}
{{- $existing := (lookup "v1" "Secret" "kubeflow" "mlpipeline-minio-artifact").data | default dict }}
{{- $demoMode := (.Values.global | default dict).demoMode | default false }}
{{- $accessKey := .Values.seaweedfs.accessKey | default (ternary "kubeflow" "" $demoMode) | default (index $existing "accesskey" | default "" | b64dec) | default (randAlphaNum 20 | lower) }}
{{- $secretKey := .Values.seaweedfs.secretKey | default (ternary "kubeflow123" "" $demoMode) | default (index $existing "secretkey" | default "" | b64dec) | default (randAlphaNum 40) }}
apiVersion: v1
kind: Secret
metadata:
  labels:
    application-crd-id: kubeflow-pipelines
  name: mlpipeline-minio-artifact
  namespace: kubeflow
stringData:
  accesskey: {{ $accessKey | quote }}
  secretkey: {{ $secretKey | quote }}
{{- end }}
