{{- /*
  Lookup-idempotent MySQL/MariaDB credentials secret.
  On first install:  preserves empty root password (MariaDB is configured with
                     MARIADB_ALLOW_EMPTY_ROOT_PASSWORD=yes for development).
  On upgrade:        preserves whatever password is already stored in the cluster.
  Override the password via .Values.mysqlSecret.password (umbrella chart: pipelines.mysqlSecret.password).
*/}}
{{- $secretName := "mysql-secret" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $password := "" }}
{{- if $existing }}
  {{- $password = index $existing.data "password" | default "" }}
{{- else if .Values.mysqlSecret.password }}
  {{- $password = .Values.mysqlSecret.password | b64enc }}
{{- else }}
  {{- $password = "" | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  labels:
    app.kubernetes.io/component: ml-pipeline
    app.kubernetes.io/name: kubeflow-pipelines
    application-crd-id: kubeflow-pipelines
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  # DEMO DEFAULT — password is empty; CHANGE IN PRODUCTION
  password: {{ $password }}
  username: {{ "root" | b64enc }}
  replicationPassword: {{ "replication" | b64enc }}
