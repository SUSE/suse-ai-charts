{{- /*
  Lookup-idempotent MySQL/MariaDB credentials secret.
  On first install: generates a random 24-char alphanumeric password.
  On upgrade:       preserves the existing secret value (no re-render).
  To rotate:        delete the secret, then helm upgrade to regenerate.
  Override:         set pipelines.mysqlSecret.password in your values file.
*/}}
{{- $secretName := "mysql-secret" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $password := "" }}
{{- if $existing }}
  {{- $password = index $existing.data "password" | default "" }}
{{- else if .Values.mysqlSecret.password }}
  {{- $password = .Values.mysqlSecret.password | b64enc }}
{{- else }}
  {{- $password = randAlphaNum 24 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  labels:
    app.kubernetes.io/component: ml-pipeline
    app.kubernetes.io/name: kubeflow-pipelines
    application-crd-id: kubeflow-pipelines
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  # Auto-generated on first install; preserved on upgrade via lookup above.
  password: {{ $password }}
  username: {{ "root" | b64enc }}
  # replication is disabled (auth.replicationUsername: ""); this key is kept in case
  # the MariaDB subchart reads it from existingSecret during initialization.
  replicationPassword: {{ "replication" | b64enc }}
