  FRONTEND_TAG: '{{ .Values.frontend.image.tag }}'
  # SUSE: pull secrets for the optional per-profile artifact-proxy Deployment
  IMAGE_PULL_SECRETS: '{{ range $i, $s := .Values.global.imagePullSecrets }}{{ if $i }},{{ end }}{{ if kindIs "string" $s }}{{ $s }}{{ else }}{{ $s.name }}{{ end }}{{ end }}'
kind: ConfigMap
metadata:
