apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: kubeflow
  labels:
    app: seaweedfs
    app.kubernetes.io/component: ml-pipeline
    app.kubernetes.io/name: kubeflow-pipelines
    application-crd-id: kubeflow-pipelines
spec:
  ports:
  # SeaweedFS IAM API (upstream http-iam). The KFP profile controller creates each profile's own
  # access key + policy through it (AWS_ENDPOINT_URL=http://seaweedfs.kubeflow:8111).
  - name: http-iam
    port: 8111
    targetPort: 8111
    protocol: TCP
  - name: http-s3-compat
    port: 9000
    targetPort: 8333
    protocol: TCP
  - name: http-s3
    port: 8333
    targetPort: 8333
    protocol: TCP
  - name: http-master
    port: 9333
    targetPort: 9333
    protocol: TCP
  selector:
    app: seaweedfs
