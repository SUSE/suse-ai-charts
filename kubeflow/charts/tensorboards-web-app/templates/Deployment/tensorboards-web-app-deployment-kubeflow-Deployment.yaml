apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: tensorboards-web-app
    kustomize.component: tensorboards-web-app
  name: tensorboards-web-app-deployment
  namespace: kubeflow
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: tensorboards-web-app
      kustomize.component: tensorboards-web-app
  template:
    metadata:
      labels:
        app: tensorboards-web-app
        kustomize.component: tensorboards-web-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      {{- include "tensorboards-web-app.imagePullSecrets" . | nindent 6 }}
      containers:
      - env:
        - name: APP_PREFIX
          value: {{ .Values.env.APP_PREFIX | quote }}
        - name: USERID_HEADER
          value: {{ .Values.env.USERID_HEADER | quote }}
        - name: USERID_PREFIX
          value: {{ .Values.env.USERID_PREFIX | quote }}
        - name: APP_SECURE_COOKIES
          value: {{ .Values.env.APP_SECURE_COOKIES | quote }}
        image: "{{- $registry := include "tensorboards-web-app.suseImageRegistry" (dict "ctx" . "registry" .Values.image.registry) -}}{{- if $registry }}{{ $registry }}/{{ end }}{{ .Values.image.repository }}{{- if .Values.image.digest }}@{{ .Values.image.digest }}{{- else }}:{{ .Values.image.tag }}{{- end }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        name: tensorboards-web-app
        ports:
        - containerPort: {{ .Values.service.targetPort }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
          readOnlyRootFilesystem: false  # Flask app writes session/temp files
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.startupProbe }}
        startupProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.livenessProbe }}
        livenessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.readinessProbe }}
        readinessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      serviceAccountName: tensorboards-web-app-service-account
      volumes:
      - emptyDir: {}
        name: tmp
