{{- range .Values.additionalUsers }}
{{- $emailSlug := .email | lower | replace "." "-" | replace "@" "--" }}
{{- $namespaceName := .namespace | default $emailSlug }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: metadata-grpc-configmap
  namespace: {{ $namespaceName }}
data:
  METADATA_GRPC_SERVICE_HOST: metadata-grpc-service.kubeflow
  METADATA_GRPC_SERVICE_PORT: "8080"
{{- end }}
