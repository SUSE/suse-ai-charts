{{- if .Values.profile.enabled }}
apiVersion: kubeflow.org/v1beta1
kind: Profile
metadata:
  name: {{ .Values.profile.name }}
  labels:
    # The umbrella's pre-delete hook selects the release's Profiles by these.
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  owner:
    kind: {{ .Values.profile.owner.kind }}
    name: {{ .Values.profile.owner.name }}
  {{- if .Values.awsIamForServiceAccount.awsIamRole }}
  plugins:
  - kind: AwsIamForServiceAccount
    spec:
      awsIamRole: '{{ .Values.awsIamForServiceAccount.awsIamRole }}'
      annotateOnly: true
  {{- end }}
{{- end }}
