{{- range .Values.additionalUsers }}
{{- $namespaceName := include "user-namespace.profileNamespace" . }}
---
apiVersion: kubeflow.org/v1beta1
kind: Profile
metadata:
  name: {{ $namespaceName }}
  labels:
    # The umbrella's pre-delete hook selects the release's Profiles by these.
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
spec:
  owner:
    kind: User
    name: {{ .email }}
  {{- if .resourceQuota }}
  resourceQuotaSpec:
    hard:
      {{- toYaml .resourceQuota | nindent 6 }}
  {{- end }}
{{- end }}
