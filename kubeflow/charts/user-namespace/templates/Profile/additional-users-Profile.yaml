{{- range .Values.additionalUsers }}
{{- $namespaceName := include "user-namespace.profileNamespace" . }}
---
apiVersion: kubeflow.org/v1beta1
kind: Profile
metadata:
  name: {{ $namespaceName }}
spec:
  owner:
    kind: User
    name: {{ .email }}
  {{- if .resourceQuota }}
  resourceQuotaSpec:
    hard:
      {{- toYaml .resourceQuota | nindent 6 }}
  {{- end }}
{{- end }}
