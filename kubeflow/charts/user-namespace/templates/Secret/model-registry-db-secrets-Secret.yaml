{{- if and (include "user-namespace.modelRegistry.enabled" .) (eq .Values.modelRegistry.db.mode "embedded") (not .Values.modelRegistry.db.embedded.existingSecret) }}
{{- $e := .Values.modelRegistry.db.embedded }}
{{- range (include "user-namespace.modelRegistry.namespaces" . | fromJsonArray) }}
{{- $existing := lookup "v1" "Secret" .namespace "model-registry-db-secrets" }}
---
# Generated once, then reused via lookup so the password matches the initialized PVC.
apiVersion: v1
kind: Secret
metadata:
  name: model-registry-db-secrets
  namespace: {{ .namespace }}
  labels:
    component: db
    {{- include "user-namespace.modelRegistry.labels" $ | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing $existing.data }}
  POSTGRES_USER: {{ index $existing.data "POSTGRES_USER" }}
  POSTGRES_PASSWORD: {{ index $existing.data "POSTGRES_PASSWORD" }}
  {{- else }}
  POSTGRES_USER: {{ $e.username | b64enc }}
  POSTGRES_PASSWORD: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
{{- end }}
{{- end }}
