apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ml-pipeline-ui-artifact
  name: ml-pipeline-ui-artifact
  namespace: kubeflow-user-example-com
spec:
  selector:
    matchLabels:
      app: ml-pipeline-ui-artifact
  template:
    metadata:
      labels:
        app: ml-pipeline-ui-artifact
    spec:
      containers:
      - name: ml-pipeline-ui-artifact
        image: "{{ include "user-namespace.suseImageRegistry" (dict "ctx" . "registry" .Values.pipelines.frontend.registry) }}/{{ .Values.pipelines.frontend.repository }}{{- if .Values.pipelines.frontend.digest }}@{{ .Values.pipelines.frontend.digest }}{{- else }}:{{ .Values.pipelines.frontend.tag }}{{- end }}"
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              key: accesskey
              name: mlpipeline-minio-artifact
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              key: secretkey
              name: mlpipeline-minio-artifact
        - name: FRONTEND_SERVER_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        resources:
          requests:
            cpu: 10m
            memory: 70Mi
          limits:
            cpu: 100m
            memory: 500Mi
      serviceAccountName: default-editor
