apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ml-pipeline-visualizationserver
  name: ml-pipeline-visualizationserver
  namespace: kubeflow-user-example-com
spec:
  selector:
    matchLabels:
      app: ml-pipeline-visualizationserver
  template:
    metadata:
      labels:
        app: ml-pipeline-visualizationserver
    spec:
      containers:
      - image: "{{ include "user-namespace.suseImageRegistry" (dict "ctx" . "registry" .Values.pipelines.visualizationServer.registry) }}/{{ .Values.pipelines.visualizationServer.repository }}{{- if .Values.pipelines.visualizationServer.digest }}@{{ .Values.pipelines.visualizationServer.digest }}{{- else }}:{{ .Values.pipelines.visualizationServer.tag }}{{- end }}"
        imagePullPolicy: IfNotPresent
        name: ml-pipeline-visualizationserver
        ports:
        - containerPort: 8888
        resources:
          requests:
            cpu: 50m
            memory: 200Mi
          limits:
            cpu: 500m
            memory: 1Gi
      serviceAccountName: default-editor
