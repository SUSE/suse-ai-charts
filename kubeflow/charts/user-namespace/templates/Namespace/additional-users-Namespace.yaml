{{- range .Values.additionalUsers }}
{{- /* Name resolution (explicit .namespace, else email slug): see user-namespace.profileNamespace. */}}
{{- $namespaceName := include "user-namespace.profileNamespace" . }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $namespaceName }}
  labels:
    {{- include "user-namespace.profileNamespaceLabels" $ | nindent 4 }}
  annotations:
    # Pre-set owner annotation so the profiles controller can reconcile immediately.
    owner: {{ .email }}
{{- end }}
