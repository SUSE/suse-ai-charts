{{- if .Values.jobset.controller.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  labels:
    control-plane: jobset-controller-manager
  name: jobset-mutating-webhook-configuration
# failurePolicy: Fail — JobSet mutation is critical; an invalid JobSet would prevent
# worker pods from being created. Trainer webhooks use Ignore (non-blocking validation).
webhooks:
- admissionReviewVersions: [v1]
  clientConfig:
    service:
      name: jobset-webhook-service
      namespace: kubeflow
      path: /mutate-jobset-x-k8s-io-v1alpha2-jobset
      port: 443
  failurePolicy: Fail
  name: mjobset.kb.io
  rules:
  - apiGroups: [jobset.x-k8s.io]
    apiVersions: [v1alpha2]
    operations: [CREATE]
    resources: [jobsets]
  sideEffects: None
- admissionReviewVersions: [v1]
  clientConfig:
    service:
      name: jobset-webhook-service
      namespace: kubeflow
      path: /mutate--v1-pod
      port: 443
  failurePolicy: Fail
  name: mpod.kb.io
  objectSelector:
    matchExpressions:
    - key: jobset.sigs.k8s.io/jobset-name
      operator: Exists
  rules:
  - apiGroups: [""]
    apiVersions: [v1]
    operations: [CREATE]
    resources: [pods]
  sideEffects: None
{{- end }}
