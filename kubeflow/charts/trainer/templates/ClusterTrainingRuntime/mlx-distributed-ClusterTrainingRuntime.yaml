{{- if .Values.runtimes.enabled }}
apiVersion: trainer.kubeflow.org/v1alpha1
kind: ClusterTrainingRuntime
metadata:
  name: mlx-distributed
  labels:
    trainer.kubeflow.org/framework: mlx
spec:
  mlPolicy:
    numNodes: 1
    mpi:
      numProcPerNode: 1
      mpiImplementation: OpenMPI
      sshAuthMountPath: /home/mpiuser/.ssh
      runLauncherAsNode: true
  template:
    spec:
      network:
        publishNotReadyAddresses: true
      successPolicy:
        operator: All
        targetReplicatedJobs:
          - launcher
      replicatedJobs:
        - name: launcher
          template:
            metadata:
              labels:
                trainer.kubeflow.org/trainjob-ancestor-step: trainer
            spec:
              template:
                spec:
                  containers:
                    - name: node
                      image: "{{ with (coalesce .Values.global.imageRegistry .Values.runtimes.mlx.image.registry) }}{{ . }}/{{ end }}{{ .Values.runtimes.mlx.image.repository }}{{- if .Values.runtimes.mlx.image.digest }}@{{ .Values.runtimes.mlx.image.digest }}{{- else }}:{{ .Values.runtimes.mlx.image.tag }}{{- end }}"
                      securityContext:
                        runAsUser: 1000
        - name: node
          template:
            spec:
              template:
                spec:
                  containers:
                    - name: node
                      image: "{{ with (coalesce .Values.global.imageRegistry .Values.runtimes.mlx.image.registry) }}{{ . }}/{{ end }}{{ .Values.runtimes.mlx.image.repository }}{{- if .Values.runtimes.mlx.image.digest }}@{{ .Values.runtimes.mlx.image.digest }}{{- else }}:{{ .Values.runtimes.mlx.image.tag }}{{- end }}"
                      securityContext:
                        runAsUser: 1000
                      command:
                        - /usr/sbin/sshd
                      args:
                        - -De
                        - -f
                        - /home/mpiuser/.sshd_config
                      readinessProbe:
                        tcpSocket:
                          port: 2222
                        initialDelaySeconds: 5
{{- end }}
