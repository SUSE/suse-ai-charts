{{- if .Values.runtimes.torchtune.enabled }}
apiVersion: trainer.kubeflow.org/v1alpha1
kind: ClusterTrainingRuntime
metadata:
  name: torchtune-llama3.2-1b
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
  labels:
    trainer.kubeflow.org/framework: torchtune
spec:
  mlPolicy:
    numNodes: 1
    torch:
      numProcPerNode: auto
  template:
    spec:
      replicatedJobs:
        - name: dataset-initializer
          template:
            metadata:
              labels:
                trainer.kubeflow.org/trainjob-ancestor-step: dataset-initializer
            spec:
              template:
                spec:
                  containers:
                    - name: dataset-initializer
                      image: "{{- $registry := include "trainer.suseImageRegistry" (dict "ctx" . "registry" .Values.runtimes.torchtune.images.datasetInitializer.registry) -}}{{- if $registry }}{{ $registry }}/{{ end }}{{ .Values.runtimes.torchtune.images.datasetInitializer.repository }}{{- if .Values.runtimes.torchtune.images.datasetInitializer.digest }}@{{ .Values.runtimes.torchtune.images.datasetInitializer.digest }}{{- else }}:{{ .Values.runtimes.torchtune.images.datasetInitializer.tag }}{{- end }}"
                      env:
                        - name: STORAGE_URI
                          value: hf://tatsu-lab/alpaca
                      volumeMounts:
                        - mountPath: /workspace
                          name: initializer
                  volumes:
                    - name: initializer
                      persistentVolumeClaim:
                        claimName: torchtune-llama3.2-1b
        - name: model-initializer
          template:
            metadata:
              labels:
                trainer.kubeflow.org/trainjob-ancestor-step: model-initializer
            spec:
              template:
                spec:
                  containers:
                    - name: model-initializer
                      image: "{{- $registry := include "trainer.suseImageRegistry" (dict "ctx" . "registry" .Values.runtimes.torchtune.images.modelInitializer.registry) -}}{{- if $registry }}{{ $registry }}/{{ end }}{{ .Values.runtimes.torchtune.images.modelInitializer.repository }}{{- if .Values.runtimes.torchtune.images.modelInitializer.digest }}@{{ .Values.runtimes.torchtune.images.modelInitializer.digest }}{{- else }}:{{ .Values.runtimes.torchtune.images.modelInitializer.tag }}{{- end }}"
                      env:
                        - name: STORAGE_URI
                          value: hf://meta-llama/Llama-3.2-1B-Instruct
                      volumeMounts:
                        - name: initializer
                          mountPath: /workspace
                  volumes:
                    - name: initializer
                      persistentVolumeClaim:
                        claimName: torchtune-llama3.2-1b
        - name: node
          dependsOn:
            - name: dataset-initializer
              status: Complete
            - name: model-initializer
              status: Complete
          template:
            metadata:
              labels:
                trainer.kubeflow.org/trainjob-ancestor-step: trainer
            spec:
              template:
                spec:
                  containers:
                    - name: node
                      image: "{{- $registry := include "trainer.suseImageRegistry" (dict "ctx" . "registry" .Values.runtimes.torchtune.images.trainer.registry) -}}{{- if $registry }}{{ $registry }}/{{ end }}{{ .Values.runtimes.torchtune.images.trainer.repository }}{{- if .Values.runtimes.torchtune.images.trainer.digest }}@{{ .Values.runtimes.torchtune.images.trainer.digest }}{{- else }}:{{ .Values.runtimes.torchtune.images.trainer.tag }}{{- end }}"
                      command:
                        - tune
                        - run
                        - --rdzv_endpoint=localhost:29500
                        - full_finetune_distributed
                        - --config
                        - llama3_2/1B_full
                        - dataset=torchtune.datasets.instruct_dataset
                        - dataset.source=parquet
                        - dataset.data_dir=/workspace/dataset/data
                        - output_dir=/workspace/output
                        - tokenizer.path=/workspace/model/original/tokenizer.model
                        - checkpointer.checkpoint_dir=/workspace/model
                      resources:
                        limits:
                          nvidia.com/gpu: 2
                      volumeMounts:
                        - mountPath: /workspace
                          name: initializer
                  volumes:
                    - name: initializer
                      persistentVolumeClaim:
                        claimName: torchtune-llama3.2-1b
{{- end }}
