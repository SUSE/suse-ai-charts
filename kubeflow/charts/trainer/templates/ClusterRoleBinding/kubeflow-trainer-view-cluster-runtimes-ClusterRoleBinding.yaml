apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeflow-trainer-view-cluster-runtimes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubeflow-trainer-view-cluster-runtimes
subjects:
  # system:authenticated is intentional: ClusterTrainingRuntime objects describe available
  # training runtimes and are non-sensitive. All authenticated users need read access so
  # the Trainer UI and SDK can enumerate available runtimes cluster-wide.
  # This matches the upstream Kubeflow Trainer RBAC design.
  - kind: Group
    name: system:authenticated
    apiGroup: rbac.authorization.k8s.io
