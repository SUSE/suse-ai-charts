{{- if .Values.jobset.controller.enabled }}
apiVersion: v1
kind: Service
metadata:
  labels:
    control-plane: jobset-controller-manager
  name: jobset-webhook-service
  namespace: kubeflow
spec:
  ports:
  - port: 443
    protocol: TCP
    targetPort: 9443
  selector:
    control-plane: jobset-controller-manager
{{- end }}
