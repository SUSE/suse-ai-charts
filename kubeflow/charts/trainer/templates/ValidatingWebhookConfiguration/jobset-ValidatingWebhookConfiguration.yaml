{{- if .Values.jobset.controller.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  labels:
    control-plane: jobset-controller-manager
  name: jobset-validating-webhook-configuration
# failurePolicy: Fail — see MutatingWebhookConfiguration comment.
webhooks:
- admissionReviewVersions: [v1]
  clientConfig:
    service:
      name: jobset-webhook-service
      namespace: kubeflow
      path: /validate-jobset-x-k8s-io-v1alpha2-jobset
      port: 443
  failurePolicy: Fail
  name: vjobset.kb.io
  rules:
  - apiGroups: [jobset.x-k8s.io]
    apiVersions: [v1alpha2]
    operations: [CREATE, UPDATE]
    resources: [jobsets]
  sideEffects: None
- admissionReviewVersions: [v1]
  clientConfig:
    service:
      name: jobset-webhook-service
      namespace: kubeflow
      path: /validate--v1-pod
      port: 443
  failurePolicy: Fail
  name: vpod.kb.io
  objectSelector:
    matchExpressions:
    - key: jobset.sigs.k8s.io/jobset-name
      operator: Exists
  rules:
  - apiGroups: [""]
    apiVersions: [v1]
    operations: [CREATE]
    resources: [pods]
  sideEffects: None
{{- end }}
