{{- if .Values.jobset.controller.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    control-plane: jobset-controller-manager
  name: jobset-manager-secrets-role
  namespace: kubeflow
rules:
- apiGroups: [""]
  resources: [secrets]
  verbs: [get, list, update, watch]
{{- end }}
