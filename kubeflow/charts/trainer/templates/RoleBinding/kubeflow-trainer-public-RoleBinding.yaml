apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubeflow-trainer-public
  namespace: kubeflow
  labels:
    {{- include "trainer.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubeflow-trainer-public
subjects:
- kind: Group
  apiGroup: rbac.authorization.k8s.io
  name: system:authenticated
