{{- if .Values.controller.enabled }}
# Upstream options/controller/rbac/leader_election_role_binding.yaml (release-26.03.1).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app: model-registry
    app.kubernetes.io/component: model-registry-controller
    app.kubernetes.io/name: model-registry
    kustomize.component: model-registry
  name: model-registry-controller-leader-election
  namespace: kubeflow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: model-registry-controller-leader-election
subjects:
- kind: ServiceAccount
  name: model-registry-controller
  namespace: kubeflow
{{- end }}
