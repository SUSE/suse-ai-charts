{{- if .Values.catalog.enabled }}
{{/*
  NOTE (Helm-only idempotency): this Secret is generated once at install time and
  preserved on upgrade via `helm.sh/resource-policy: keep` and the `lookup` guard
  below. Both are Helm runtime features: `lookup` returns empty under `helm template`
  and default ArgoCD/Flux dry rendering, and `resource-policy: keep` is ignored by
  those tools. Under a GitOps controller a fresh random password would be re-applied
  against a PVC that still holds the original credentials, causing auth failures.
  For GitOps flows, pre-create this Secret (or point postgresql.auth.existingSecret
  at an externally managed Secret) and leave catalog password generation disabled.
  The namespace is hardcoded to `kubeflow` to match every other resource in this
  chart (Deployments/Services/SAs), so the pod's secretKeyRef always resolves here.
*/}}
{{- $existing := lookup "v1" "Secret" "kubeflow" "model-catalog-postgres" }}
{{- if not $existing }}
apiVersion: v1
kind: Secret
metadata:
  name: model-catalog-postgres
  namespace: kubeflow
  labels:
    app: model-registry
    app.kubernetes.io/component: model-catalog-server
    app.kubernetes.io/name: model-registry
    kustomize.component: model-registry
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  # Passwords generated once at install time; helm.sh/resource-policy: keep preserves them on upgrade.
  # Rotation is NOT automatic: the PostgreSQL data directory persists on its PVC, so simply
  # deleting this Secret and re-running `helm upgrade` regenerates credentials that no longer
  # match the initialized database. To rotate, also reset the DB user password (or recreate the
  # PVC) so the stored password and this Secret agree.
  password: {{ randAlphaNum 24 | b64enc | quote }}
  postgres-password: {{ randAlphaNum 24 | b64enc | quote }}
  replicationPassword: {{ randAlphaNum 24 | b64enc | quote }}
{{- end }}
{{- end }}
