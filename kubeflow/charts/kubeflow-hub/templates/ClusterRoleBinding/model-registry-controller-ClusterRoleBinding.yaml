{{- if .Values.controller.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app: model-registry
    app.kubernetes.io/component: model-registry-controller
    app.kubernetes.io/name: model-registry
    kustomize.component: model-registry
  name: model-registry-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: model-registry-controller
subjects:
- kind: ServiceAccount
  name: model-registry-controller
  namespace: kubeflow
{{- end }}
