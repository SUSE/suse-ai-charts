{{- if .Values.catalog.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: model-registry
    app.kubernetes.io/component: model-catalog-server
    app.kubernetes.io/name: model-registry
    kustomize.component: model-registry
  name: model-catalog
  namespace: kubeflow
spec:
  gateways:
  - {{ .Values.global.gateway.name | default "kubeflow/kubeflow-gateway" }}
  hosts:
  - '*'
  http:
  - match:
    - uri:
        prefix: /api/model_catalog/
    route:
    - destination:
        host: model-catalog.kubeflow.svc.cluster.local
        port:
          number: 8080
{{- end }}
