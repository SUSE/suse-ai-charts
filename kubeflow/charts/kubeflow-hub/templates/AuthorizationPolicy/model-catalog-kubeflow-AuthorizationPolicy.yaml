{{- if .Values.catalog.enabled }}
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  labels:
    app: model-registry
    app.kubernetes.io/component: model-catalog-server
    app.kubernetes.io/name: model-registry
    kustomize.component: model-registry
  name: model-catalog
  namespace: kubeflow
spec:
  action: ALLOW
  rules:
  - from:
    - source:
        namespaces:
        - istio-system
        - kubeflow
  selector:
    matchLabels:
      app: model-registry
      app.kubernetes.io/component: model-catalog-server
      app.kubernetes.io/name: model-registry
      kustomize.component: model-registry
{{- end }}
