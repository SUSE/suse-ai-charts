apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  labels:
    app: model-registry
    app.kubernetes.io/component: model-registry-ui
    app.kubernetes.io/name: model-registry
    kustomize.component: model-registry
  name: model-registry-ui
  namespace: kubeflow
spec:
  action: ALLOW
  rules:
  {{- if .Values.authorizationPolicy.strict }}
  # STRICT (default): aligned to kubeflow/community-distribution release-26.03.1 hub UI policy
  # (applications/hub/upstream/options/ui/overlays/istio/authorization-policy-ui.yaml). The UI
  # is reached only through the ingress gateway, where users authenticate at oauth2-proxy, so
  # only the gateway SA principal is allowed. Requires mesh mTLS.
  - from:
    - source:
        principals:
        - {{ .Values.authorizationPolicy.ingressGatewayPrincipal }}
  {{- else }}
  # LOOSE (authorizationPolicy.strict=false): namespace-scoped fallback.
  - from:
    - source:
        namespaces:
        - istio-system
        - kubeflow
  {{- end }}
  selector:
    matchLabels:
      app: model-registry
      app.kubernetes.io/component: model-registry-ui
      app.kubernetes.io/name: model-registry
      kustomize.component: model-registry
