{{- /* Used by the shared server (modelRegistry.mode=shared) AND by the model-catalog Deployment,
     which is control plane and keeps rendering in perProfile. Render when either needs it. */}}
{{- if or (include "kubeflow-hub.isShared" .) .Values.catalog.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app: model-registry
    app.kubernetes.io/component: model-registry-server
    app.kubernetes.io/name: model-registry
    kustomize.component: model-registry
  name: model-registry-server
  namespace: kubeflow
{{- end }}
