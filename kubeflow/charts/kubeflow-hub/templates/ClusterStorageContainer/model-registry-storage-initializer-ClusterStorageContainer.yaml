{{- if .Values.kserve.storageContainer.enabled }}
apiVersion: serving.kserve.io/v1alpha1
kind: ClusterStorageContainer
metadata:
  labels:
    app: model-registry
    app.kubernetes.io/component: model-registry-storage-initializer
    app.kubernetes.io/name: model-registry
    kustomize.component: model-registry
  name: model-registry-storage-initializer
spec:
  container:
    name: storage-initializer
    image: "{{- $registry := include "kubeflow-hub.suseImageRegistry" (dict "ctx" . "registry" .Values.kserve.storageContainer.image.registry) -}}{{- if $registry }}{{ $registry }}/{{ end }}{{ .Values.kserve.storageContainer.image.repository }}{{- if .Values.kserve.storageContainer.image.digest }}@{{ .Values.kserve.storageContainer.image.digest }}{{- else }}:{{ .Values.kserve.storageContainer.image.tag }}{{- end }}"
    imagePullPolicy: {{ .Values.kserve.storageContainer.image.pullPolicy }}
    env:
    - name: MODEL_REGISTRY_BASE_URL
      # model-registry-service is created with a hardcoded `kubeflow` namespace (like every
      # Service/Deployment in this chart), so target it explicitly rather than Release.Namespace.
      value: "model-registry-service.kubeflow.svc.cluster.local:8080"
    resources:
      requests:
        cpu: 100m
        memory: 100Mi
      limits:
        cpu: 500m
        memory: 1Gi
  supportedUriFormats:
  - prefix: "model-registry://"
{{- end }}
