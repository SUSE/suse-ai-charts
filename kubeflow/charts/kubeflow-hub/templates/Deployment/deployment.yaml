apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-registry-server
  namespace: kubeflow
  labels:
    component: model-registry-server
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      component: model-registry-server
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "true"
      labels:
        component: model-registry-server
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: model-registry-server
      {{- include "kubeflow-hub.imagePullSecrets" . | nindent 6 }}
      containers:
      - name: model-registry-server
        image: "{{ include "kubeflow-hub.suseImageRegistry" (dict "ctx" . "registry" .Values.image.registry) }}/{{ .Values.image.repository }}{{- if .Values.image.digest }}@{{ .Values.image.digest }}{{- else }}:{{ .Values.image.tag }}{{- end }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
        - /model-registry
        - proxy
        args:
        - --hostname=0.0.0.0
        - --port=8080
        - --datastore-type=embedmd
        - --embedmd-database-dsn=$(DBCONFIG_USER):$(DBCONFIG_PASSWORD)@tcp($(MYSQL_HOST):$(MYSQL_PORT))/$(MYSQL_DATABASE)?charset=utf8mb4
        ports:
        - name: http-api
          containerPort: 8080
        env:
        - name: DBCONFIG_USER
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: username
        - name: DBCONFIG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: password
        - name: MYSQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: pipeline-install-config
              key: embedmdDb
        - name: MYSQL_HOST
          valueFrom:
            configMapKeyRef:
              name: pipeline-install-config
              key: dbHost
        - name: MYSQL_PORT
          valueFrom:
            configMapKeyRef:
              name: pipeline-install-config
              key: dbPort
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /readyz/isDirty
            port: http-api
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /readyz/isDirty
            port: http-api
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /readyz/health
            port: http-api
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
