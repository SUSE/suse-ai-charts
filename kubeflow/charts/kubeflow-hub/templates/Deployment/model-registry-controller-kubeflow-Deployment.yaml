{{- if .Values.controller.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: model-registry
    app.kubernetes.io/component: model-registry-controller
    app.kubernetes.io/name: model-registry
    kustomize.component: model-registry
  name: model-registry-controller
  namespace: kubeflow
spec:
  replicas: {{ .Values.controller.replicaCount }}
  selector:
    matchLabels:
      app: model-registry
      app.kubernetes.io/component: model-registry-controller
      app.kubernetes.io/name: model-registry
      kustomize.component: model-registry
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: 'true'
      labels:
        app: model-registry
        app.kubernetes.io/component: model-registry-controller
        app.kubernetes.io/name: model-registry
        kustomize.component: model-registry
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      {{- include "kubeflow-hub.imagePullSecrets" . | nindent 6 }}
      containers:
      - command:
        - /manager
        args:
        - --leader-elect
        - --health-probe-bind-address=:8081
        env:
        - name: INFERENCE_SERVICE_CONTROLLER
          value: {{ include "kubeflow-hub.inferenceServiceController" . | quote }}
        - name: REGISTRIES_NAMESPACE
          value: {{ include "kubeflow-hub.registriesNamespace" . | quote }}
        - name: SKIP_TLS_VERIFY
          value: {{ .Values.controller.env.skipTlsVerify | quote }}
        # Upstream options/controller/overlays/base/params.env — required (non-empty) when
        # INFERENCE_SERVICE_CONTROLLER=managed, otherwise the manager exits at startup.
        - name: NAMESPACE_LABEL
          value: {{ .Values.controller.env.namespaceLabel | quote }}
        - name: NAME_LABEL
          value: {{ .Values.controller.env.nameLabel | quote }}
        - name: URL_ANNOTATION
          value: {{ .Values.controller.env.urlAnnotation | quote }}
        - name: INFERENCE_SERVICE_ID_LABEL
          value: {{ .Values.controller.env.inferenceServiceIdLabel | quote }}
        - name: MODEL_VERSION_ID_LABEL
          value: {{ .Values.controller.env.modelVersionIdLabel | quote }}
        - name: REGISTERED_MODEL_ID_LABEL
          value: {{ .Values.controller.env.registeredModelIdLabel | quote }}
        - name: FINALIZER
          value: {{ .Values.controller.env.finalizer | quote }}
        - name: SERVICE_ANNOTATION
          value: {{ .Values.controller.env.serviceAnnotation | quote }}
        image: "{{- $registry := include "kubeflow-hub.suseImageRegistry" (dict "ctx" . "registry" .Values.controller.image.registry) -}}{{- if $registry }}{{ $registry }}/{{ end }}{{ .Values.controller.image.repository }}{{- if .Values.controller.image.digest }}@{{ .Values.controller.image.digest }}{{- else }}:{{ .Values.controller.image.tag }}{{- end }}"
        imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
          readOnlyRootFilesystem: false
        {{- with .Values.controller.livenessProbe }}
        livenessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.controller.readinessProbe }}
        readinessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        name: model-registry-controller
        ports:
        - containerPort: 8081
          name: health
        {{- with .Values.controller.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      serviceAccountName: model-registry-controller
{{- end }}
