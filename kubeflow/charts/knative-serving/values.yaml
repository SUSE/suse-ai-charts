# Knative Serving component configuration
# Images use registry/repository/pullPolicy/digest format

global:
  # -- Global override for container image registry
  imageRegistry: ""
  # -- Global override for container image pull secrets
  imagePullSecrets: []
  # -- Global override for image pull policy
  imagePullPolicy: IfNotPresent

controller:
  image:
    registry: gcr.io
    repository: knative-releases/knative.dev/serving/cmd/controller
