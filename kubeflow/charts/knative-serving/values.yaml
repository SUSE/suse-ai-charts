# Knative Serving component configuration
# Images use registry/repository/pullPolicy/digest format

global:
  # -- Global override for container image registry
  imageRegistry: ""
  # -- Global override for SUSE AI container image registry (e.g. staging registry)
  suseRegistry: ""
  # -- Global override for container image pull secrets
  imagePullSecrets: []
  # -- Global override for image pull policy
  imagePullPolicy: IfNotPresent
  # Dedicated KServe/Knative inference gateway ("<namespace>/<name>"). Single
  # source of truth (umbrella parent overrides this); config-istio derives its
  # "gateway.<namespace>.<name>" key from it so net-istio binds Knative ingress
  # to the same Gateway the kubeflow-istio-resources sub-chart renders.
  kserveGateway:
    name: "kubeflow/kserve-ingress-gateway"

controller:
  image:
    registry: registry.suse.com
    repository: ai/containers/knative-releases/knative.dev/serving/cmd/controller
    tag: "v1.22.0"  # unused when digest is set
    digest: ""  # optional: sha256:... pins this image for supply-chain security
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 1000m
      memory: 1000Mi
    requests:
      cpu: 100m
      memory: 100Mi

activator:
  image:
    registry: registry.suse.com
    repository: ai/containers/knative-releases/knative.dev/serving/cmd/activator
    tag: "v1.22.0"  # unused when digest is set
    digest: ""  # optional: sha256:... pins this image for supply-chain security
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 1000m
      memory: 600Mi
    requests:
      cpu: 300m
      memory: 60Mi

autoscaler:
  image:
    registry: registry.suse.com
    repository: ai/containers/knative-releases/knative.dev/serving/cmd/autoscaler
    tag: "v1.22.0"  # unused when digest is set
    digest: ""  # optional: sha256:... pins this image for supply-chain security
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 1000m
      memory: 1000Mi
    requests:
      cpu: 100m
      memory: 100Mi

webhook:
  image:
    registry: registry.suse.com
    repository: ai/containers/knative-releases/knative.dev/serving/cmd/webhook
    tag: "v1.22.0"  # unused when digest is set
    digest: ""  # optional: sha256:... pins this image for supply-chain security
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 500Mi
    requests:
      cpu: 100m
      memory: 100Mi

netIstioController:
  image:
    registry: registry.suse.com
    repository: ai/containers/knative-releases/knative.dev/net-istio/cmd/controller
    tag: "v1.22.0"  # unused when digest is set
    digest: ""  # optional: sha256:... pins this image for supply-chain security
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 300m
      memory: 400Mi
    requests:
      cpu: 30m
      memory: 40Mi

netIstioWebhook:
  image:
    registry: registry.suse.com
    repository: ai/containers/knative-releases/knative.dev/net-istio/cmd/webhook
