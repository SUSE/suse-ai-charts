# Knative Serving component configuration
# Images use registry/repository/pullPolicy/digest format

global:
  # -- Global override for container image registry
  imageRegistry: ""
  # -- Global override for SUSE AI container image registry (e.g. staging registry)
  suseRegistry: ""
  # -- Global override for container image pull secrets
  imagePullSecrets: []
  # -- Global override for image pull policy
  imagePullPolicy: IfNotPresent

# Top-level image registry for fallback when global overrides are not set
image:
  registry: stgregistry.suse.com

controller:
  image:
    registry: stgregistry.suse.com
    repository: ai/containers/knative-releases/knative.dev/serving/cmd/controller
    tag: "v1.22.0"  # unused when digest is set
    digest: ""  # optional: sha256:... pins this image for supply-chain security
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 1000m
      memory: 1000Mi
    requests:
      cpu: 100m
      memory: 100Mi

activator:
  image:
    registry: stgregistry.suse.com
    repository: ai/containers/knative-releases/knative.dev/serving/cmd/activator
    tag: "v1.22.0"  # unused when digest is set
    digest: ""  # optional: sha256:... pins this image for supply-chain security
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 1000m
      memory: 600Mi
    requests:
      cpu: 300m
      memory: 60Mi

autoscaler:
  image:
    registry: stgregistry.suse.com
    repository: ai/containers/knative-releases/knative.dev/serving/cmd/autoscaler
    tag: "v1.22.0"  # unused when digest is set
    digest: ""  # optional: sha256:... pins this image for supply-chain security
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 1000m
      memory: 1000Mi
    requests:
      cpu: 100m
      memory: 100Mi

webhook:
  image:
    registry: stgregistry.suse.com
    repository: ai/containers/knative-releases/knative.dev/serving/cmd/webhook
    tag: "v1.22.0"  # unused when digest is set
    digest: ""  # optional: sha256:... pins this image for supply-chain security
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 500Mi
    requests:
      cpu: 100m
      memory: 100Mi

netIstioController:
  image:
    registry: stgregistry.suse.com
    repository: ai/containers/knative-releases/knative.dev/net-istio/cmd/controller
    tag: "v1.22.0"  # unused when digest is set
    digest: ""  # optional: sha256:... pins this image for supply-chain security
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 300m
      memory: 400Mi
    requests:
      cpu: 30m
      memory: 40Mi

netIstioWebhook:
  image:
    registry: stgregistry.suse.com
    repository: ai/containers/knative-releases/knative.dev/net-istio/cmd/webhook
    tag: "v1.22.0"  # unused when digest is set
    digest: ""  # optional: sha256:... pins this image for supply-chain security
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 200m
      memory: 200Mi
    requests:
      cpu: 20m
      memory: 20Mi

# Queue sidecar image used in config-deployment ConfigMap
queueSidecarImage:
  image:
    registry: stgregistry.suse.com
    repository: ai/containers/knative-releases/knative.dev/serving/cmd/queue
    tag: "v1.22.0"
    digest: ""  # optional: sha256:... pins this image for supply-chain security
    pullPolicy: IfNotPresent

# Queue proxy image used in the queue-proxy Image resource
queueProxy:
  image:
    registry: stgregistry.suse.com
    repository: ai/containers/knative-releases/knative.dev/serving/cmd/queue
    tag: "v1.22.0"
    digest: ""  # optional: sha256:... pins this image for supply-chain security
    pullPolicy: IfNotPresent

# Registries that Knative skips image tag resolving for (digest pinning).
# Supports a comma-separated list of registries.
# Defaults to the resolved SUSE AI registry; override to list multiple registries.
registriesSkippingTagResolving: ""

# Domain for InferenceService external URLs.
# Override with <node-ip>.nip.io or your real domain.
domain: "example.com"
