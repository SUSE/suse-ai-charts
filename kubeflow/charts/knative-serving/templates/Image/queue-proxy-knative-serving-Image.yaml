apiVersion: caching.internal.knative.dev/v1alpha1
kind: Image
metadata:
  labels:
    app.kubernetes.io/component: queue-proxy
    app.kubernetes.io/name: knative-serving
    app.kubernetes.io/version: 1.8.0
  name: queue-proxy
  namespace: knative-serving
spec:
  image: "{{ include "knative-serving.suseImageRegistry" . }}/{{ .Values.queueProxy.image.repository }}{{- if .Values.queueProxy.image.digest }}@{{ .Values.queueProxy.image.digest }}{{- else }}:{{ .Values.queueProxy.image.tag }}{{- end }}"