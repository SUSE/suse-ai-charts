apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: net-istio
    app.kubernetes.io/name: knative-serving
    app.kubernetes.io/version: 1.8.0
    networking.knative.dev/ingress-provider: istio
  name: net-istio-webhook
  namespace: knative-serving
spec:
  selector:
    matchLabels:
      app: net-istio-webhook
      role: net-istio-webhook
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: 'false'
        sidecar.istio.io/inject: 'true'
      labels:
        app: net-istio-webhook
        app.kubernetes.io/component: net-istio
        app.kubernetes.io/name: knative-serving
        app.kubernetes.io/version: 1.8.0
        role: net-istio-webhook
    spec:
      containers:
      - env:
        - name: WEBHOOK_PORT
          value: "8443"
        - name: SYSTEM_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: CONFIG_LOGGING_NAME
          value: config-logging
        - name: CONFIG_OBSERVABILITY_NAME
          value: config-observability
        - name: METRICS_DOMAIN
          value: knative.dev/net-istio
        - name: WEBHOOK_NAME
          value: net-istio-webhook
        image: "{{ include "knative-serving.suseImageRegistry" (dict "ctx" . "registry" .Values.netIstioWebhook.image.registry) }}/{{ .Values.netIstioWebhook.image.repository }}{{- if .Values.netIstioWebhook.image.digest }}@{{ .Values.netIstioWebhook.image.digest }}{{- else }}:{{ .Values.netIstioWebhook.image.tag }}{{- end }}"
        imagePullPolicy: {{ include "knative-serving.imagePullPolicy" (dict "image" .Values.netIstioWebhook.image "context" .) }}
        name: webhook
        ports:
        - containerPort: 9090
          name: metrics
        - containerPort: 8008
          name: profiling
        - containerPort: 8443
          name: https-webhook
        resources:
          {{- toYaml .Values.netIstioWebhook.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
      serviceAccountName: controller
{{- include "knative-serving.imagePullSecrets" . | nindent 6 }}
