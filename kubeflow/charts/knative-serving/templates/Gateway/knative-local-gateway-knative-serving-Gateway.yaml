apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  labels:
    app.kubernetes.io/component: net-istio
    app.kubernetes.io/name: knative-serving
    app.kubernetes.io/version: 1.8.0
    networking.knative.dev/ingress-provider: istio
  name: knative-local-gateway
  namespace: knative-serving
spec:
  selector:
    {{- /* Overridable via .Values.localGateway.selector so upstream Istio
           (istio: ingressgateway) works too. The fronting Service uses the same
           value; fall back to the Rancher default rather than emit an empty
           selector. */}}
    {{- if and .Values.localGateway .Values.localGateway.selector }}
    {{- toYaml .Values.localGateway.selector | nindent 4 }}
    {{- else }}
    app: istio
    istio: istio
    {{- end }}
  servers:
  - hosts:
    - '*'
    port:
      name: http
      number: 80
      protocol: HTTP
