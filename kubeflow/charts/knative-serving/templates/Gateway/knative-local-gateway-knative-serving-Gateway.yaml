apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  labels:
    app.kubernetes.io/component: net-istio
    app.kubernetes.io/name: knative-serving
    app.kubernetes.io/version: 1.8.0
    networking.knative.dev/ingress-provider: istio
  name: knative-local-gateway
  namespace: knative-serving
spec:
  selector:
    {{- /* Single-sourced from global.istio.ingressGateway.selector (umbrella
           parent), plus the knative-specific residual `app: istio` matcher. The
           fronting istio-system Service uses the SAME helper so they can never
           drift. See knative-serving.localGatewaySelector in _helpers.tpl. */}}
    {{- include "knative-serving.localGatewaySelector" . | nindent 4 }}
  servers:
  - hosts:
    - '*'
    port:
      name: http
      number: 80
      protocol: HTTP
