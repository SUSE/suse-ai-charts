apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: net-istio
    app.kubernetes.io/name: knative-serving
    app.kubernetes.io/version: 1.8.0
    experimental.istio.io/disable-gateway-port-translation: 'true'
    networking.knative.dev/ingress-provider: istio
  name: knative-local-gateway
  namespace: istio-system
spec:
  ports:
  - name: http2
    port: 80
    targetPort: 80
  selector:
    {{- /* Same selector as the knative-local-gateway Gateway (.Values.localGateway.selector);
           keep them identical so this Service always fronts the gateway workload. */}}
    {{- if and .Values.localGateway .Values.localGateway.selector }}
    {{- toYaml .Values.localGateway.selector | nindent 4 }}
    {{- else }}
    app: istio
    istio: istio
    {{- end }}
  type: ClusterIP
