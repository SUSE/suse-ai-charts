apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: net-istio
    app.kubernetes.io/name: knative-serving
    app.kubernetes.io/version: 1.8.0
    experimental.istio.io/disable-gateway-port-translation: 'true'
    networking.knative.dev/ingress-provider: istio
  name: knative-local-gateway
  namespace: istio-system
spec:
  ports:
  - name: http2
    port: 80
    targetPort: 80
  selector:
    {{- /* Same helper as the knative-local-gateway Gateway spec.selector; keep
           them identical so this Service always fronts the gateway workload. */}}
    {{- include "knative-serving.localGatewaySelector" . | nindent 4 }}
  type: ClusterIP
