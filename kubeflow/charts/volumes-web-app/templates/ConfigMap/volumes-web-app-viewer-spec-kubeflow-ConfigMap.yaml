apiVersion: v1
kind: ConfigMap
metadata:
  name: volumes-web-app-viewer-spec
  namespace: kubeflow
  labels:
    app: volumes-web-app
    kustomize.component: volumes-web-app
data:
  viewer-spec.yaml: |
    pvc: $NAME
    podSpec:
      serviceAccountName: default-editor
      containers:
        - name: main
          image: $VOLUME_VIEWER_IMAGE
          env:
            - name: FB_ADDRESS
              value: "0.0.0.0"
            - name: FB_PORT
              value: "8080"
            - name: FB_DATABASE
              value: /tmp/filebrowser.db
            - name: FB_NOAUTH
              value: "true"
            - name: FB_BASEURL
              value: /pvcviewers/$NAMESPACE/$NAME/
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          volumeMounts:
            - name: viewer-volume
              mountPath: /srv
          workingDir: /srv
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: viewer-volume
          persistentVolumeClaim:
            claimName: $NAME
    networking:
      targetPort: 8080
      basePrefix: "/pvcviewers"
      rewrite: "/"
      timeout: 30s
    rwoScheduling: true
