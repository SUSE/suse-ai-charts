apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: volumes-web-app
    kustomize.component: volumes-web-app
  name: volumes-web-app-deployment
  namespace: kubeflow
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: volumes-web-app
      kustomize.component: volumes-web-app
  template:
    metadata:
      labels:
        app: volumes-web-app
        kustomize.component: volumes-web-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      {{- include "volumes-web-app.imagePullSecrets" . | nindent 6 }}
      containers:
      - env:
        - name: APP_PREFIX
          value: {{ .Values.env.APP_PREFIX | quote }}
        - name: USERID_HEADER
          value: {{ .Values.env.USERID_HEADER | quote }}
        - name: USERID_PREFIX
          value: {{ .Values.env.USERID_PREFIX | quote }}
        {{- /* Secure CSRF cookie: explicit env wins; else follows global.tls.source when the umbrella sets
               it (HTTPS for any source, including edge); unset standalone, keeping the app's secure default. */}}
        {{- $tls := (.Values.global | default dict).tls | default dict }}
        {{- /* An unquoted false is an explicit choice too, so test for "set", not truthiness. */}}
        {{- $sc := .Values.env.APP_SECURE_COOKIES }}
        {{- if and (not (kindIs "invalid" $sc)) (ne (toString $sc) "") }}
        - name: APP_SECURE_COOKIES
          value: {{ toString $sc | quote }}
        {{- else if hasKey $tls "source" }}
        - name: APP_SECURE_COOKIES
          value: {{ ternary "true" "false" (ne ($tls.source | default "") "") | quote }}
        {{- end }}
        - name: VOLUME_VIEWER_IMAGE
          value: "{{- $registry := include "volumes-web-app.viewerImageRegistry" (dict "ctx" . "registry" .Values.viewerImage.registry) -}}{{- if $registry }}{{ $registry }}/{{ end }}{{ .Values.viewerImage.repository }}{{- if .Values.viewerImage.digest }}@{{ .Values.viewerImage.digest }}{{- else }}:{{ .Values.viewerImage.tag }}{{- end }}"
        image: "{{- $registry := include "volumes-web-app.suseImageRegistry" (dict "ctx" . "registry" .Values.image.registry) -}}{{- if $registry }}{{ $registry }}/{{ end }}{{ .Values.image.repository }}{{- if .Values.image.digest }}@{{ .Values.image.digest }}{{- else }}:{{ .Values.image.tag }}{{- end }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        name: volumes-web-app
        ports:
        - containerPort: {{ .Values.service.targetPort }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
          readOnlyRootFilesystem: false  # Flask app writes session/temp files
        volumeMounts:
        - name: viewer-spec
          mountPath: /etc/config/viewer-spec.yaml
          subPath: viewer-spec.yaml
        - mountPath: /tmp
          name: tmp
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.startupProbe }}
        startupProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.livenessProbe }}
        livenessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.readinessProbe }}
        readinessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      volumes:
      - name: viewer-spec
        configMap:
          name: volumes-web-app-viewer-spec
      - emptyDir: {}
        name: tmp
      serviceAccountName: volumes-web-app-service-account
