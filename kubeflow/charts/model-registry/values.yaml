global:
  # -- Global override for container image registry
  imageRegistry: ""
  # -- Global override for SUSE AI container image registry (e.g. staging registry)
  suseRegistry: ""
  # -- Global override for Application Collection image registry (e.g. dp.apps.rancher.io mirror)
  suseApplicationCollection: ""
  imagePullSecrets: []

server:
  image:
    registry: registry.suse.com
    repository: ai/containers/kubeflow/model-registry/server
    tag: v0.3.7
    pullPolicy: IfNotPresent
    digest: ""
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  livenessProbe:
    httpGet:
      path: /readyz/health
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  startupProbe:
    httpGet:
      path: /readyz/health
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    httpGet:
      path: /readyz/health
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

ui:
  image:
    registry: registry.suse.com
    repository: ai/containers/kubeflow/model-registry/ui
    tag: v0.3.7
    pullPolicy: IfNotPresent
    digest: ""
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  startupProbe:
    httpGet:
      path: /healthcheck
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 12
  livenessProbe:
    httpGet:
      path: /healthcheck
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 15
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /healthcheck
      port: 8080
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 15
    failureThreshold: 3

# Database: shares KFP's MariaDB (requires pipelines.enabled=true)
# Credentials from mysql-secret (username=root, password=<root password>)
# Host/port/dbname from pipeline-install-config (embedmdDb key added by this chart)
db:
  secretName: mysql-secret
  configMapName: pipeline-install-config

# -- Default registry for SUSE AI container images
image:
  registry: registry.suse.com

# Top-level fallback registry for Application Collection images
appCollection:
  registry: dp.apps.rancher.io

# initContainer image: waits for MariaDB and creates the DB before the server starts
dbInit:
  image:
    registry: dp.apps.rancher.io
    repository: containers/mariadb
    tag: "11.8.6-5.1"
    pullPolicy: IfNotPresent
    digest: ""

controller:
  enabled: false
  image:
    registry: registry.suse.com
    repository: ai/containers/kubeflow/model-registry/controller
    tag: v0.3.7            # pinned — manifests use latest; same release train as server/ui
    pullPolicy: IfNotPresent
    digest: ""
  replicaCount: 1
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  env:
    inferenceServiceController: "false"
    registriesNamespace: ""
    skipTlsVerify: "false"
  livenessProbe:
    httpGet:
      path: /healthz
      port: 8081
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /readyz
      port: 8081
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

kserve:
  storageContainer:
    enabled: false
    image:
      registry: registry.suse.com
      repository: ai/containers/kubeflow/model-registry/storage-initializer
      tag: v0.3.7          # pinned — manifests use latest; same release train as server/ui
      pullPolicy: IfNotPresent
      digest: ""

catalog:
  enabled: true
  # Uses same server image as model-registry-server (different command: catalog)
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # sources is a SourceConfig object rendered into sources.yaml.
  # An empty map ({}) starts the catalog with no sources; override to add HuggingFace etc.
  sources: "{}"
  livenessProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# AppCo PostgreSQL sub-chart for model catalog.
# Condition mirrors catalog.enabled (set in Chart.yaml dependency condition).
# Passwords are generated once at install time via the lookup-idempotent Secret template
# (charts/apps/model-registry/templates/Secret/model-catalog-postgres-kubeflow-Secret.yaml).
# Do NOT set postgresql.auth.password or postgresql.auth.postgresPassword here;
# the Secret template generates them and passes them as existingSecret.
postgresql:
  fullnameOverride: "model-catalog-postgres"
  auth:
    database: catalog
    username: catalog
    existingSecret: model-catalog-postgres
    postgresPasswordKey: postgres-password
    # passwordKey defaults to "password" which matches the generated secret key
  persistence:
    enabled: true
    storageClassName: ""
    resources:
      requests:
        storage: 5Gi
  podTemplates:
    annotations:
      sidecar.istio.io/inject: 'false'
  metrics:
    enabled: false
