global:
  # -- Global override for container image registry
  imageRegistry: ""
  # -- Global override for SUSE AI container image registry (e.g. staging registry)
  suseRegistry: ""
  # -- Global override for Application Collection image registry (e.g. dp.apps.rancher.io mirror)
  suseApplicationCollectionRegistry: ""
  # -- Global override for container image pull secrets
  imagePullSecrets: []

replicaCount: 1

manager:
  image:
    registry: registry.suse.com
    repository: ai/containers/kubeflow/notebooks/tensorboard-controller
    tag: v1.11.0
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi
  livenessProbe:
    httpGet:
      path: /healthz
      port: 8081
    initialDelaySeconds: 15
    periodSeconds: 20
  readinessProbe:
    httpGet:
      path: /readyz
      port: 8081
    initialDelaySeconds: 5
    periodSeconds: 10

kubeRbacProxy:
  image:
    registry: dp.apps.rancher.io
    repository: containers/kube-rbac-proxy
    tag: "0.22.0"
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 5m
      memory: 64Mi

configMapData:
  ISTIO_GATEWAY: kubeflow/kubeflow-gateway
  ISTIO_HOST: "*"
  RWO_PVC_SCHEDULING: "True"
  tensorboardImage:
    registry: registry.suse.com
    repository: ai/containers/tensorflow/tensorflow
    tag: "2.21.0"
