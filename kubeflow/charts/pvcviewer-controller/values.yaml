global:
  # -- Global override for container image registry
  imageRegistry: ""
  # -- Global override for SUSE AI container image registry (e.g. staging registry)
  suseRegistry: ""
  # -- Global override for container image pull secrets
  imagePullSecrets: []

image:
  registry: stgregistry.suse.com
  repository: ai/containers/kubeflow/notebooks/pvcviewer-controller
  tag: v1.11.0
  pullPolicy: IfNotPresent

replicaCount: 1

# Image injected into PVCViewer pods as the default viewer (filebrowser)
viewerImage:
  registry: stgregistry.suse.com
  repository: ai/containers/filebrowser/filebrowser
  tag: v2.32.0

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi
