apiVersion: apps/v1
kind: Deployment
metadata:
  name: pvcviewer-controller-manager
  namespace: kubeflow
  labels:
    app: pvcviewer
    control-plane: controller-manager
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: pvcviewer
      control-plane: controller-manager
  template:
    metadata:
      labels:
        app: pvcviewer
        control-plane: controller-manager
      annotations:
        # Istio terminates TLS for inbound traffic; port 9443 is the webhook port
        # and must speak TLS directly to the API server — exclude it from Istio interception.
        traffic.sidecar.istio.io/excludeInboundPorts: "9443"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: pvcviewer-controller-manager
      terminationGracePeriodSeconds: 10
      {{- include "pvcviewer-controller.imagePullSecrets" . | nindent 6 }}
      containers:
      - name: manager
        image: "{{ with (coalesce .Values.global.imageRegistry .Values.image.registry) }}{{ . }}/{{ end }}{{ .Values.image.repository }}{{- if .Values.image.digest }}@{{ .Values.image.digest }}{{- else }}:{{ .Values.image.tag }}{{- end }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
        - /manager
        args:
        - --leader-elect
        - --health-probe-bind-address=:8081
        - --metrics-bind-address=127.0.0.1:8080
        env:
        - name: VOLUME_VIEWER_IMAGE
          value: {{ .Values.viewerImage | default "registry.suse.com/ai/containers/filebrowser:v2.25.0" | quote }}
        ports:
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: cert
          readOnly: true
      volumes:
      - name: cert
        secret:
          defaultMode: 420
          secretName: pvcviewer-webhook-server-cert
