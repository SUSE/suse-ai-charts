apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pvcviewer-leader-election
  namespace: kubeflow
  labels:
    app: pvcviewer
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
