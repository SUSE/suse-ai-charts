# Network policy configuration.
# Set enabled: false for CNI plugins that do not enforce NetworkPolicy (e.g., bare Flannel).
enabled: true

# kube-dns CIDR — used for DNS egress allow rule.
# Set to the CIDR of your kube-dns service (default: 10.96.0.0/12 for most clusters).
# Run: kubectl get svc -n kube-system kube-dns -o jsonpath='{.spec.clusterIP}'
kubeDnsCidr: "10.96.0.0/12"
