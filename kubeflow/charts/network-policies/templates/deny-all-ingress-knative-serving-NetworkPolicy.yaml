# Deny all ingress to the knative-serving namespace by default.
# Specific allow rules below open only the traffic paths that are actually needed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-ingress-knative-serving
  namespace: knative-serving
spec:
  podSelector: {}
  policyTypes:
  - Ingress
