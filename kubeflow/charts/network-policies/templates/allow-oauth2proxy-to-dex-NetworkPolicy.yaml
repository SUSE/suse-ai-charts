# Allow oauth2-proxy to reach Dex (OIDC token exchange).
# Dex listens on port 5556 in the kubeflow namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-oauth2proxy-to-dex
  namespace: kubeflow
spec:
  podSelector:
    matchLabels:
      app: dex
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: oauth2-proxy
    ports:
    - port: 5556
      protocol: TCP
