# Allow all ingress from within the kubeflow namespace (pod-to-pod within the namespace).
# Required for KFP components, metadata server, and the central dashboard to reach each other.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: kubeflow
spec:
  # Every pod except the KFP profile controller, which admits only metacontroller (its own policy).
  podSelector:
    matchExpressions:
    - {key: app, operator: NotIn, values: [kubeflow-pipelines-profile-controller]}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kubeflow
