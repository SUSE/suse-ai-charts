apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kubeflow-alerts
  namespace: kubeflow
  labels:
    {{- range $k, $v := .Values.prometheusRuleLabels }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
spec:
  groups:
  - name: kubeflow.pods
    rules:
    - alert: KubeflowPodNotReady
      expr: |
        kube_pod_status_ready{namespace="kubeflow", condition="true"} == 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Kubeflow pod {{ "{{" }} $labels.pod {{ "}}" }} not ready for 5 minutes"
        description: "Pod {{ "{{" }} $labels.pod {{ "}}" }} in namespace kubeflow has been not ready for more than 5 minutes."

    - alert: KubeflowOOMKill
      expr: |
        kube_pod_container_status_last_terminated_reason{namespace="kubeflow", reason="OOMKilled"} == 1
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: "Kubeflow container OOMKilled: {{ "{{" }} $labels.container {{ "}}" }}"
        description: "Container {{ "{{" }} $labels.container {{ "}}" }} in pod {{ "{{" }} $labels.pod {{ "}}" }} was OOM killed."

  - name: kubeflow.storage
    rules:
    - alert: KubeflowPVCUsageHigh
      expr: |
        (kubelet_volume_stats_used_bytes{namespace="kubeflow"} / kubelet_volume_stats_capacity_bytes{namespace="kubeflow"}) > 0.8
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Kubeflow PVC {{ "{{" }} $labels.persistentvolumeclaim {{ "}}" }} usage above 80%"
        description: "PVC {{ "{{" }} $labels.persistentvolumeclaim {{ "}}" }} is {{ "{{" }} $value | humanizePercentage {{ "}}" }} full."

  - name: kubeflow.pipelines
    rules:
    - alert: KFPHighPipelineFailureRate
      expr: |
        rate(ml_pipeline_run_count{status="Failed"}[5m]) > 0.5
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "High KFP pipeline failure rate"
        description: "More than 50% of recent KFP runs are failing."
