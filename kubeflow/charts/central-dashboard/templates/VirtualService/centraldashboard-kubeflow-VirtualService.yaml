apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ include "central-dashboard.fullname" . }}
  labels:
    {{- include "central-dashboard.labels" . | nindent 4 }}
spec:
  gateways:
  - {{ .Values.global.gateway.name | default "kubeflow/kubeflow-gateway" }}
  hosts:
  - '*'
  http:
  - match:
    - uri:
        prefix: /
    rewrite:
      uri: /
    route:
    - destination:
        host: {{ include "central-dashboard.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local
        port:
          number: {{ .Values.service.port }}
