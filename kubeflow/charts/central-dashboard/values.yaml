image:
  registry: registry.suse.com
  repository: ai/containers/central-dashboard
  tag: v1.10.0
  pullPolicy: IfNotPresent

global:
  # -- Global override for container image registry
  imageRegistry: ""
  # -- Global override for SUSE AI image registry
  suseRegistry: ""
  # -- Global override for container image pull secrets
  imagePullSecrets: []
replicaCount: 1

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 2000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

pdb:
  enabled: false
  maxUnavailable: 1

autoscaling:
  enabled: false  # set true for production multi-replica setups
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

service:
  type: ClusterIP
  port: 80
  targetPort: 8082

env:
  USERID_HEADER: kubeflow-userid
  USERID_PREFIX: ""
  PROFILES_KFAM_SERVICE_HOST: profiles-kfam.kubeflow
  REGISTRATION_FLOW: "false"
  DASHBOARD_LINKS_CONFIGMAP: centraldashboard-config
  LOGOUT_URL: /oauth2/sign_out

livenessProbe:
  httpGet:
    path: /healthz
    port: 8082
  initialDelaySeconds: 30
  periodSeconds: 30

readinessProbe: {}

# ConfigMap: centraldashboard-parameters
parametersConfigMap:
  CD_CLUSTER_DOMAIN: cluster.local
  CD_REGISTRATION_FLOW: "false"
  CD_USERID_HEADER: kubeflow-userid
  CD_USERID_PREFIX: ""

