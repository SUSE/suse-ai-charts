name: Lint and template kubeflow chart

# Renders the kubeflow umbrella chart with `helm lint` and `helm template` on each
# PR and push to main. Three rounds of KServe-wildcard-TLS regressions were caught
# only by manual `helm template`; this makes that check automatic. It exercises the
# default path, the KServe external-HTTPS opt-in, and asserts the opt-in's security
# guards still fail closed. Scoped to kubeflow only — other charts in the repo
# (open-webui-mcpo, pytorch) are intentionally out of scope.

on:
  pull_request:
    paths:
      - 'kubeflow/**'
      - '.github/workflows/lint.yml'
  push:
    branches: [ main ]
    paths:
      - 'kubeflow/**'
      - '.github/workflows/lint.yml'
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch) so
# only the newest render is spent.
concurrency:
  group: lint-template-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-template:
    runs-on: ubuntu-latest
    env:
      # AppCo registry hosts the OCI dependencies (oauth2-proxy, dex, cert-manager,
      # …) that the umbrella chart pulls. Same secrets the release workflow uses.
      APPCO_REGISTRY: ${{ secrets.APPCO_REGISTRY }}
      APPCO_USER: ${{ secrets.APPCO_USER }}
      APPCO_TOKEN: ${{ secrets.APPCO_TOKEN }}
      # helm template/lint render against helm's built-in default Kubernetes version
      # when no --kube-version is given (Helm 4.0.x derives it from bundled client-go,
      # ~v1.34). The umbrella chart's Chart.yaml now pins `kubeVersion: >=1.35.0-0`
      # (knative v1.24.0 hard-gates on k8s 1.35), so the default render is REJECTED
      # with "chart requires kubeVersion: >=1.35.0-0 which is incompatible". Pass this
      # explicit version to every render so CI exercises the supported target instead
      # of helm's lower default. Must satisfy the Chart.yaml kubeVersion floor.
      KUBE_VERSION: "1.35.0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: KFP image tags stay consistent across values files
        # Pure file check — no registry/Helm needed, so it runs unconditionally
        # (including on fork PRs where the umbrella render steps skip). The KFP
        # version is hand-maintained as a `tag:` on every ai/containers/kubeflow/kfp-*
        # image in the kubeflow-pipelines sub-chart (the frontend image included — the KFP
        # profile controller reads it from there for the optional per-profile artifact
        # proxy; user-namespace no longer renders KFP objects). A bump that misses
        # one image ships a skewed control plane (e.g. api-server 2.17.4 against launcher
        # 2.17.3). Pair each kfp-* repository with the tag on its next `tag:` line and
        # assert exactly one distinct value. Version-agnostic: a future 2.17->2.18 bump
        # that touches only some images still trips the distinct-count check. Add a file
        # to the list if KFP images are ever pinned anywhere else.
        # Commented-out example blocks (ai/containers/kfp-*, no `kubeflow/`) are not
        # matched, so they never false-trigger.
        run: |
          set -euo pipefail
          files=(kubeflow/charts/kubeflow-pipelines/values.yaml)
          tags="$(awk '
            /^[[:space:]]*repository:.*ai\/containers\/kubeflow\/kfp-/ { want=1; next }
            want && /^[[:space:]]*tag:/ { gsub(/[" ]/,"",$2); print $2; want=0 }
          ' "${files[@]}" | sort -u)"
          if [ "$(printf '%s\n' "$tags" | grep -c .)" -ne 1 ]; then
            echo "FAIL: KFP (kfp-*) image tags are not consistent across values files. Distinct tags found:" >&2
            printf '%s\n' "$tags" >&2
            echo "Bump the KFP tag in all of: ${files[*]}" >&2
            exit 1
          fi
          echo "OK: all KFP image tags are consistent ($tags)."

      - name: Model Registry server image tags stay consistent across values files
        # Pure file check. The registry server image (ai/containers/kubeflow/hub/server) is pinned in
        # kubeflow-hub (shared-mode server + Model Catalog) and in user-namespace (per-profile
        # servers). A bump that misses one file runs the UI/BFF and catalog against per-profile
        # servers of a different version. Same pairing logic as the KFP check above.
        run: |
          set -euo pipefail
          files=(kubeflow/charts/kubeflow-hub/values.yaml
                 kubeflow/charts/user-namespace/values.yaml)
          tags="$(awk '
            /^[[:space:]]*repository:.*ai\/containers\/kubeflow\/hub\/server[[:space:]]*$/ { want=1; next }
            want && /^[[:space:]]*tag:/ { gsub(/[" ]/,"",$2); print $2; want=0 }
          ' "${files[@]}" | sort -u)"
          if [ "$(printf '%s\n' "$tags" | grep -c .)" -ne 1 ]; then
            echo "FAIL: Model Registry server (hub/server) image tags differ across values files. Distinct tags found:" >&2
            printf '%s\n' "$tags" >&2
            echo "Bump the hub/server tag in all of: ${files[*]}" >&2
            exit 1
          fi
          echo "OK: Model Registry server image tags are consistent ($tags)."

      - name: KFP profile-controller hook unit tests
        # Pure Python — no registry/Helm needed, so it runs unconditionally (fork PRs too). Drives
        # the vendored upstream KFP 2.17 sync.py (charts/kubeflow-pipelines/files/profile-controller)
        # with mocked SeaweedFS IAM/S3: per-profile scoped credentials, upstream's ConfigMap set,
        # artifact proxy off by default, and the SUSE pull-secret and aws CLI patches. (Upstream's own
        # test_sync.py is stale for 2.17 and fails against pristine upstream.) A venv because the
        # runner's system Python is externally managed (PEP 668).
        run: |
          set -euo pipefail
          python3 -m venv /tmp/kfp-ut
          /tmp/kfp-ut/bin/pip install --quiet pytest==9.2.0
          /tmp/kfp-ut/bin/python -m pytest -q -p no:cacheprovider kubeflow/test/unit

      - name: Vendored KFP sync.py is upstream + suse.patch
        # Keeps the SUSE change to the vendored profile-controller hook explicit: a re-vendor that
        # drops or alters it, or an edit to sync.py not reflected in suse.patch, fails here.
        # Needs network access to raw.githubusercontent.com (no registry credentials).
        run: |
          set -euo pipefail
          d=kubeflow/charts/kubeflow-pipelines/files/profile-controller
          ver="$(tr -d '[:space:]' < "$d/UPSTREAM_VERSION")"
          tmp="$(mktemp -d)"
          curl -sfL --retry 3 -o "$tmp/sync.py" \
            "https://raw.githubusercontent.com/kubeflow/pipelines/${ver}/manifests/kustomize/base/installs/multi-user/pipelines-profile-controller/sync.py"
          patch -s -d "$tmp" -p1 < "$d/suse.patch"
          diff -u "$tmp/sync.py" "$d/sync.py" \
            || { echo "FAIL: $d/sync.py differs from upstream KFP ${ver} + suse.patch. Regenerate the patch (see the header of sync.py)." >&2; exit 1; }
          echo "OK: sync.py == upstream KFP ${ver} + suse.patch"

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          # Pin the Helm CLI to the project's documented minimum (README
          # Prerequisites / runMe.sh floor) so CI renders on the version real
          # installers use.
          version: v4.0.1

      - name: Helm login to AppCo registry
        if: ${{ env.APPCO_TOKEN != '' }}
        run: |
          # --password-stdin keeps the token out of the process argv (where `-p`
          # would leave it visible to any process listing / CI trace).
          printf '%s' "$APPCO_TOKEN" | helm registry login "$APPCO_REGISTRY" -u "$APPCO_USER" --password-stdin

      - name: Note if AppCo credentials are missing (fork PR)
        if: ${{ env.APPCO_TOKEN == '' }}
        run: |
          # Fork PRs cannot read the AppCo secrets, so the umbrella chart's OCI
          # dependencies can't be pulled. Rather than hard-fail (which paints every
          # fork PR red), the umbrella steps below are gated on APPCO_TOKEN and skip;
          # the standalone kubeflow-istio-resources render (no OCI deps) still runs,
          # so the sub-chart guards are always exercised, and so does the offline registry
          # check below. A maintainer re-running from a same-repo branch gets the full coverage.
          msg="APPCO_TOKEN not available (fork PR or missing secret): the umbrella chart render steps were skipped. Before merging, a maintainer must run the full check locally (needs Application Collection access): helm dependency build ./kubeflow && python3 kubeflow/test/ci/check_component_registry.py ./kubeflow --kube-version 1.35.0, or re-run from a same-repo branch."
          echo "::warning title=Umbrella chart checks skipped::$msg"
          echo "### Umbrella chart checks skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

      - name: Component registry and presets (offline; runs on every PR, including forks)
        # The registry and preset checks that need only components.yaml, _helpers.tpl and values.yaml
        # (no sub-chart dependencies): Chart.yaml conditions vs registry entries, the presets'
        # generated blocks, and what each preset enables. The render checks run in the gated
        # "Component registry matches the chart" step below.
        run: python3 kubeflow/test/ci/check_component_registry.py ./kubeflow --offline

      - name: Build chart dependencies
        if: ${{ env.APPCO_TOKEN != '' }}
        # `dependency build` installs the versions pinned in the committed
        # kubeflow/Chart.lock and FAILS if Chart.yaml has drifted from it, whereas
        # `dependency update` would silently rewrite the lock — so this also validates
        # the lock is in sync.
        run: helm dependency build ./kubeflow

      - name: helm template (standalone kubeflow-istio-resources sub-chart)
        # Runs unconditionally (even on fork PRs): this sub-chart has no OCI
        # dependencies, so no registry login is needed. It is independently
        # installable and carries its own validations.yaml/values.schema.json guards
        # (hostname FQDN, kserveExternalHttps prerequisites, gateway selector), so
        # render it on its own to prove those guards hold outside the umbrella.
        run: helm template ci ./kubeflow/charts/kubeflow-istio-resources --kube-version "$KUBE_VERSION" --set global.demoMode=true >/dev/null

      - name: helm template (Model Registry sub-charts, standalone)
        # Runs unconditionally: kubeflow-hub and user-namespace need no registry login. Covers both
        # modes and the policy / route / existing-Secret variants the umbrella renders don't.
        run: |
          set -euo pipefail
          d="$(mktemp -d)"; H=./kubeflow/charts/kubeflow-hub; U=./kubeflow/charts/user-namespace
          k=(--kube-version "$KUBE_VERSION")
          helm template ci "$H" "${k[@]}" >"$d/hub-default.yaml"
          helm template ci "$H" "${k[@]}" --set modelRegistry.mode=shared >"$d/hub-shared.yaml"
          helm template ci "$U" "${k[@]}" >"$d/uns-default.yaml"
          helm template ci "$U" "${k[@]}" --set modelRegistry.enabled=false >"$d/uns-off.yaml"
          helm template ci "$U" "${k[@]}" --set profile.enabled=false \
            --set 'additionalUsers[0].email=alice@example.com' --set 'additionalUsers[0].namespace=alice' >"$d/uns-noprofile.yaml"
          helm template ci "$U" "${k[@]}" --set profile.name=team-demo >"$d/uns-renamed.yaml"
          helm template ci "$U" "${k[@]}" --set modelRegistry.authorizationPolicy.strict=false \
            --set modelRegistry.istio.virtualService.enabled=false \
            --set modelRegistry.db.embedded.existingSecret=my-db >"$d/uns-variants.yaml"
          python3 kubeflow/test/ci/check_model_registry_subcharts.py "$d"

      - name: helm lint
        if: ${{ env.APPCO_TOKEN != '' }}
        run: |
          # global.demoMode=true suppresses the demo-credential fail() guard so
          # lint reaches the templates.
          helm lint ./kubeflow --kube-version "$KUBE_VERSION" --set global.demoMode=true

      - name: helm template (default values)
        if: ${{ env.APPCO_TOKEN != '' }}
        run: |
          set -euo pipefail
          # A plain `>/dev/null` only proves helm exits 0. It would stay green if the
          # wildcard-TLS flattening became UNCONDITIONAL — i.e. the
          # `if global.kserveExternalHttps` guard on the knative-serving
          # domainTemplate helper were dropped. That single-label
          # ({name}-{namespace}.{domain}) route host is only correct under the opt-in;
          # on the default path it changes every Knative route's host and breaks
          # net-istio readiness for installs that never asked for wildcard TLS. So
          # render with DEFAULT values (no opt-in) and assert the flattened form is
          # ABSENT — the guard must keep it opt-in only.
          out="$(helm template ci ./kubeflow --kube-version "$KUBE_VERSION" --set global.demoMode=true)"
          if grep -Fq '{{ .Name }}-{{ .Namespace }}.{{ .Domain }}' <<<"$out"; then
            echo "FAIL: default (non-opt-in) render contains the flattened Knative domainTemplate — the wildcard-TLS flattening is applied unconditionally instead of being gated on global.kserveExternalHttps." >&2
            exit 1
          fi
          # config-network should omit domain-template entirely on the default path
          # (Knative's dotted upstream default), not carry an empty/flattened one.
          if grep -Fq 'domain-template:' <<<"$out"; then
            echo "FAIL: default render sets a Knative 'domain-template' — it must be omitted (upstream dotted default) unless the opt-in is enabled." >&2
            exit 1
          fi

          # kserve-ingress-gateway on the default path must serve '*.example.com' (not any wildcard like '*')
          # to prevent cleartext routing widening regressions.
          kserve_gw="$(awk 'BEGIN{RS="---\n"} /kind: Gateway/ && /name: kserve-ingress-gateway/{print}' <<<"$out")"
          [ -n "$kserve_gw" ] \
            || { echo "FAIL: could not isolate the kserve-ingress-gateway document in default render." >&2; exit 1; }
          grep -Fq '*.example.com' <<<"$kserve_gw" \
            || { echo "FAIL: default (non-opt-in) kserve-ingress-gateway does not scope hosts to '*.example.com'." >&2; exit 1; }

          echo "OK: default render succeeds and leaves the Knative domainTemplate un-flattened (flattening stays gated on the opt-in)."

      - name: helm template (trainer-only preset)
        if: ${{ env.APPCO_TOKEN != '' }}
        run: |
          set -euo pipefail
          # kubeflow/presets/trainer-only.yaml (used by the trainer-only guide and
          # installTrainerOnly.sh) must install on a cluster with no Istio, no
          # cert-manager and no Profiles. Render WITHOUT global.demoMode or
          # global.kserveDomain: the demo-credential and inference-domain guards must
          # stay scoped to their (disabled) components. Then assert only the kubeflow
          # Namespace, the trainer sub-chart and the trainer test render.
          vals=kubeflow/presets/trainer-only.yaml
          out="$(helm template ci ./kubeflow --kube-version "$KUBE_VERSION" -n kubeflow -f "$vals")"
          if grep -Eq '^apiVersion: (networking\.istio\.io|security\.istio\.io|cert-manager\.io)/' <<<"$out"; then
            echo "FAIL: trainer-only render contains Istio or cert-manager resources." >&2; exit 1
          fi
          if grep -Eq '^kind: Profile$' <<<"$out"; then
            echo "FAIL: trainer-only render contains a Profile CR (its CRD ships only with profiles-and-kfam)." >&2; exit 1
          fi
          unexpected="$(grep -E '^# Source: ' <<<"$out" | sed 's/^# Source: //' \
            | grep -Ev '^kubeflow/charts/(kubeflow-namespace|trainer)/|^kubeflow/templates/tests/test-trainer\.yaml$' || true)"
          [ -z "$unexpected" ] \
            || { echo "FAIL: trainer-only render contains unexpected templates:" >&2; echo "$unexpected" >&2; exit 1; }
          grep -Fq 'kind: ClusterTrainingRuntime' <<<"$out" \
            || { echo "FAIL: trainer-only render has no bundled ClusterTrainingRuntimes." >&2; exit 1; }
          # The bundled runtimes must be applied by the server-side-apply Job, never
          # rendered as top-level manifests: as Helm hooks (before-hook-creation) they are
          # deleted on every upgrade, which hangs on the trainer.kubeflow.org/resource-in-use
          # finalizer while any TrainJob uses them; as release resources, runtimes created
          # by older chart versions block the upgrade on Helm's ownership check.
          if grep -Eq '^kind: ClusterTrainingRuntime$' <<<"$out"; then
            echo "FAIL: a bundled ClusterTrainingRuntime is rendered as a top-level manifest; it must go through files/runtimes/ and the runtimes-applier Job." >&2; exit 1
          fi
          grep -Fq 'name: kubeflow-trainer-runtimes-applier' <<<"$out" \
            || { echo "FAIL: the runtimes-applier hook Job is missing from the trainer-only render." >&2; exit 1; }
          # Inspect the bundled runtimes by parsing the applier ConfigMap with yq (preinstalled
          # on ubuntu-latest) rather than by indentation, so a reformat can't break or blind
          # these checks. rt_docs prints the runtime documents from the ConfigMap data.
          rt_docs() { yq 'select(.kind == "ConfigMap" and .metadata.name == "kubeflow-trainer-runtimes-applier") | .data[] | "---\n" + .' <<<"$1"; }
          # The applier prunes runtimes it applied earlier by label, so every bundled
          # runtime must carry the label, and its ClusterRole must allow delete.
          rts="$(helm template ci ./kubeflow --kube-version "$KUBE_VERSION" -n kubeflow -f "$vals" \
            --set trainer.runtimes.torchtune.enabled=true)"
          n_rt="$(rt_docs "$rts" | yq -N 'select(.kind == "ClusterTrainingRuntime") | .metadata.name' | grep -c . || true)"
          unlabelled="$(rt_docs "$rts" | yq -N 'select(.kind == "ClusterTrainingRuntime" and .metadata.labels."app.kubernetes.io/managed-by" != "kubeflow-trainer-runtimes-applier") | .metadata.name')"
          [ "$n_rt" -eq 6 ] && [ -z "$unlabelled" ] \
            || { echo "FAIL: expected 6 bundled runtimes (torchtune on), all labelled app.kubernetes.io/managed-by=kubeflow-trainer-runtimes-applier; got $n_rt, unlabelled: ${unlabelled:-none}." >&2; exit 1; }
          yq -e 'select(.kind == "ClusterRole" and .metadata.name == "kubeflow-trainer-runtimes-applier") | .rules[].verbs[] | select(. == "delete")' <<<"$rts" >/dev/null \
            || { echo "FAIL: the runtimes-applier ClusterRole cannot delete runtimes (needed for pruning)." >&2; exit 1; }
          # trainer.runtimes.istioSidecar must reach every bundled runtime pod template
          # (torchtune included): disabled -> inject "false", native -> nativeSidecar
          # "true", default -> neither. A regular sidecar outlives the training
          # container, so a template that misses the annotation never completes.
          for mode in disabled native default; do
            out="$(helm template ci ./kubeflow --kube-version "$KUBE_VERSION" -n kubeflow -f "$vals" \
              --set trainer.runtimes.torchtune.enabled=true --set trainer.runtimes.istioSidecar="$mode")"
            # One line per pod template: "<inject>/<nativeSidecar>", "-" when unset.
            anns="$(rt_docs "$out" | yq -N '.spec.template.spec.replicatedJobs[].template.spec.template
              | (.metadata.annotations."sidecar.istio.io/inject" // "-") + "/" + (.metadata.annotations."sidecar.istio.io/nativeSidecar" // "-")')"
            case "$mode" in
              disabled) want='false/-' ;;
              native)   want='-/true' ;;
              default)  want='-/-' ;;
            esac
            pods="$(grep -c . <<<"$anns" || true)"
            bad="$(grep -vxF "$want" <<<"$anns" | sort | uniq -c || true)"
            [ "$pods" -ge 14 ] && [ -z "$bad" ] \
              || { echo "FAIL: istioSidecar=$mode: want every runtime pod template to be '$want' (inject/nativeSidecar); $pods templates, mismatches: ${bad:-none}" >&2; exit 1; }
          done
          out="$(helm template ci ./kubeflow --kube-version "$KUBE_VERSION" -n kubeflow -f "$vals" \
            --set trainer.runtimes.enabled=false --set trainer.runtimes.torchtune.enabled=true)"
          if grep -Fq 'kind: ClusterTrainingRuntime' <<<"$out"; then
            echo "FAIL: trainer.runtimes.enabled=false still renders ClusterTrainingRuntimes (torchtune.enabled=true must not override it)." >&2; exit 1
          fi
          # ...and, offline (lookup finds no runtimes to prune), no applier Job either: a
          # bring-your-own-runtimes install must not need the kubectl image or the
          # application-collection pull secret. On a cluster the Job renders while
          # runtimes it applied earlier still exist, and prunes them.
          if yq -e 'select(.kind == "Job" and .metadata.name == "kubeflow-trainer-runtimes-applier")' <<<"$out" >/dev/null 2>&1; then
            echo "FAIL: with trainer.runtimes.enabled=false and nothing to prune, the runtimes-applier Job still renders." >&2; exit 1
          fi
          # Cross-component guards must fail closed when a dependency is re-enabled.
          for bad in "profiles.enabled=true:requires kubeflowRoles.enabled=true" \
                     "profiles.enabled=true,kubeflowRoles.enabled=true:  - profiles.enabled" \
                     "notebooks.webApp.enabled=true:  - notebooks.webApp.enabled" \
                     "katib.enabled=true:  - katib.enabled" \
                     "tensorboard.controller.enabled=true:  - tensorboard.controller.enabled" \
                     "userNamespace.enabled=true:requires profiles.enabled=true"; do
            set_arg="${bad%%:*}"; want="${bad#*:}"
            if err="$(helm template ci ./kubeflow --kube-version "$KUBE_VERSION" -n kubeflow \
                -f "$vals" --set "$set_arg" 2>&1)"; then
              echo "FAIL: trainer-only + --set $set_arg rendered; the cross-component guard should reject it." >&2; exit 1
            fi
            grep -Fq "$want" <<<"$err" \
              || { echo "FAIL: trainer-only + --set $set_arg failed, but not on the expected guard. Got:" >&2; echo "$err" >&2; exit 1; }
          done
          # externalSecrets is not tied to Profiles: with ESO, trainer-only installs can
          # propagate pull secrets to their own namespaces (the guide's example values).
          # The ESO-API guard is skipped offline, so this must render.
          sel='{"enabled":true,"namespaceSelector":{"matchLabels":{"app.kubernetes.io/part-of":null,"suse.com/trainjob-pull-secrets":"true"}}}'
          out="$(helm template ci ./kubeflow --kube-version "$KUBE_VERSION" -n kubeflow -f "$vals" \
            --set-json "externalSecrets=$sel" -s templates/external-secrets/ClusterExternalSecret.yaml)"
          grep -Fq 'suse.com/trainjob-pull-secrets: "true"' <<<"$out" && ! grep -Fq 'kubeflow-profile' <<<"$out" \
            || { echo "FAIL: trainer-only + externalSecrets with a custom namespaceSelector did not render the expected selector. Got:" >&2; echo "$out" >&2; exit 1; }
          echo "OK: trainer-only preset renders only Namespace + trainer + test-trainer, no Istio/cert-manager/Profile, and its guards fail closed."

      - name: Component registry matches the chart (toggles, Istio, cert-manager, presets)
        if: ${{ env.APPCO_TOKEN != '' }}
        # kubeflow/components.yaml declares what each component needs; the dependency guards, the
        # preflight checks, the Trainer-only NOTES banner and install.sh derive from it. Check it
        # covers every Chart.yaml toggle and matches what each component renders, that the presets'
        # generated blocks are current, and that install.sh's probe chart agrees with the chart.
        # Limitation: Istio resources a controller creates at RUNTIME (notebook and TensorBoard
        # controllers) are invisible to helm template; they stay declared by hand.
        run: python3 kubeflow/test/ci/check_component_registry.py ./kubeflow --kube-version "$KUBE_VERSION"

      - name: helm template (notebooks + Trainer preset)
        if: ${{ env.APPCO_TOKEN != '' }}
        run: |
          set -euo pipefail
          out="$(helm template ci ./kubeflow --kube-version "$KUBE_VERSION" -n kubeflow \
            --set global.demoMode=true -f kubeflow/presets/notebooks-trainer.yaml)"
          srcs="$(grep -oE '^# Source: kubeflow/charts/[^/]+' <<<"$out" | sed 's|.*/||' | sort -u | tr '\n' ' ')"
          want='admission-webhook central-dashboard dex jupyter-web-app kubeflow-istio-resources kubeflow-namespace kubeflow-roles notebook-controller oauth2-proxy profiles-and-kfam trainer user-namespace '
          [ "$srcs" = "$want" ] \
            || { echo "FAIL: notebooks + Trainer preset renders sub-charts '$srcs', want '$want'." >&2; exit 1; }
          # The dashboard menu must link only to apps this preset installs.
          links="$(grep -oE '"link": "/[^"]*"' <<<"$out" | sort -u | tr '\n' ' ')"
          [ "$links" = '"link": "/jupyter/" "link": "/jupyter/new?namespace=kubeflow" ' ] \
            || { echo "FAIL: dashboard links to apps the preset does not install: $links" >&2; exit 1; }
          # No KServe or Knative here, so no KServe inference gateway; adding KServe back must re-enable it.
          if grep -q 'name: kserve-ingress-gateway$' <<<"$out"; then
            echo "FAIL: notebooks + Trainer preset renders the unused kserve-ingress-gateway." >&2; exit 1
          fi
          if helm template ci ./kubeflow --kube-version "$KUBE_VERSION" -n kubeflow --set global.demoMode=true \
              -f kubeflow/presets/notebooks-trainer.yaml --set kserve.enabled=true --set knativeServing.enabled=true >/dev/null 2>&1; then
            echo "FAIL: KServe on with kubeflow-istio-resources.kserveGateway.enabled=false rendered." >&2; exit 1
          fi
          echo "OK: notebooks + Trainer preset renders only its components and dashboard links."

      - name: helm template (KServe external-HTTPS opt-in)
        if: ${{ env.APPCO_TOKEN != '' }}
        run: |
          set -euo pipefail
          # Render to a file and assert the opt-in actually produced the pieces it
          # is supposed to — a plain `>/dev/null` only proves helm exited 0, which
          # would still pass if the wildcard server silently stopped rendering.
          out="$(helm template ci ./kubeflow \
            --kube-version "$KUBE_VERSION" \
            --set global.demoMode=true \
            --set global.kserveExternalHttps=true \
            --set global.kserveDomain=kubeflow.example.com \
            --set kubeflow-istio-resources.hostname=kf.example.com \
            --set kubeflow-istio-resources.tls.source=letsEncrypt \
            --set kubeflow-istio-resources.tls.letsEncrypt.solver=cloudflare \
            --set kubeflow-istio-resources.tls.cloudflare.apiTokenSecretRef.name=cf-token)"

          # Isolate the kserve-ingress-gateway document for scoped assertions.
          kserve_gw="$(awk 'BEGIN{RS="---\n"} /kind: Gateway/ && /name: kserve-ingress-gateway/{print}' <<<"$out")"
          [ -n "$kserve_gw" ] \
            || { echo "FAIL: could not isolate the kserve-ingress-gateway document." >&2; exit 1; }

          # Assert via here-strings, NOT `echo "$out" | grep -q`: grep -q closes the
          # pipe on first match, which makes echo take a SIGPIPE; under `pipefail`
          # that surfaces as a false pipeline failure ("write error: broken pipe").
          # grep -F (fixed strings), here-strings only — no `echo | grep`.
          # 1. The wildcard :443 server must be present on the gateway.
          grep -Fq '*.kubeflow.example.com' <<<"$kserve_gw" \
            || { echo "FAIL: wildcard host '*.kubeflow.example.com' not rendered on kserve-ingress-gateway" >&2; exit 1; }
          grep -Fq 'name: https-kserve' <<<"$kserve_gw" \
            || { echo "FAIL: https-kserve gateway server not rendered on kserve-ingress-gateway" >&2; exit 1; }
          # 2a. The Knative route host (config-network) must be flattened to the
          #     single-label form — this is the net-istio readiness-probe target.
          grep -Fq '{{ .Name }}-{{ .Namespace }}.{{ .Domain }}' <<<"$out" \
            || { echo "FAIL: knative-serving flattened domainTemplate ({.Domain}) not applied" >&2; exit 1; }
          # 2b. The KServe inferenceservice-config domainTemplate (a SEPARATE blob
          #     keyed on .IngressDomain, not .Domain) must ALSO be the hyphen form.
          #     Reverting kserve/values.yaml to the dotted "{Name}.{Namespace}" bug
          #     leaves 2a green, so this second assertion is what actually guards it.
          grep -Fq '{{ .Name }}-{{ .Namespace }}.{{ .IngressDomain }}' <<<"$out" \
            || { echo "FAIL: kserve inferenceservice-config domainTemplate ({.IngressDomain}) not the hyphen form" >&2; exit 1; }
          # 3. The DEFAULT native ext_authz auth chain must front the gateway: the
          #    dex-jwt RequestAuthentication plus the require-jwt DENY AuthorizationPolicy.
          #    (The legacy EnvoyFilter mode and its Lua/selector invariants are covered
          #    by the dedicated gatewayAuthMode=envoyfilter steps below.)
          grep -Fq 'kind: RequestAuthentication' <<<"$out" \
            || { echo "FAIL: native dex-jwt RequestAuthentication not rendered — gateway has no JWT auth" >&2; exit 1; }
          grep -Fq 'name: istio-ingressgateway-require-jwt' <<<"$out" \
            || { echo "FAIL: native require-jwt DENY AuthorizationPolicy not rendered" >&2; exit 1; }
          # 4. KServe inferenceservice-config urlScheme must flip to https — advertised
          #    status.url is what clients hit; http here means the wildcard TLS server
          #    is up but every InferenceService still publishes an http:// URL.
          grep -Fq '"urlScheme":"https"' <<<"$out" \
            || { echo "FAIL: kserve urlScheme is not https under the opt-in" >&2; exit 1; }
          # 5. BOTH ends of the wildcard-cert credential link must be asserted, not
          #    just the Certificate. Checking only `secretName: kserve-wildcard-tls`
          #    (the Certificate) leaves CI green if the https-kserve server's
          #    credentialName is pointed at the DASHBOARD secret instead — every
          #    inference host would then present a cert with no matching '*.<domain>'
          #    SAN. So assert (5a) the Certificate renders, (5b) the https-kserve
          #    server references that SAME secret, and (5c) it is NOT the dashboard
          #    server's secret (an agreeing-but-wrong pair — both servers renamed to
          #    the dashboard secret — is caught by 5c even though 5b would pass).
          # Bound each server block: stop at the next server sibling ('  - ') OR at
          # any dedent to column 0 ('---' doc separator / top-level key). Without the
          # column-0 guard the awk runs to EOF when its server is the LAST one in the
          # Gateway (e.g. httpsRedirect=false leaves https-kserve last), swallowing
          # every following document — latent today only because nothing else in the
          # render carries these fields.
          kserve_srv="$(awk '/^      name: https-kserve/{f=1} f&&/^[^ ]/{exit} f&&/^  - /&&!/name: https-kserve/{exit} f{print}' <<<"$out")"
          dash_srv="$(awk '/^      name: https$/{f=1} f&&/^[^ ]/{exit} f&&/^  - /&&!/name: https$/{exit} f{print}' <<<"$out")"
          kserve_cred="$(grep -F 'credentialName:' <<<"$kserve_srv" | head -1 | sed 's/.*credentialName: *//; s/"//g')"
          dash_cred="$(grep -F 'credentialName:' <<<"$dash_srv" | head -1 | sed 's/.*credentialName: *//; s/"//g')"
          # 5a. Certificate side.
          grep -Fq 'secretName: kserve-wildcard-tls' <<<"$out" \
            || { echo "FAIL: kserve-wildcard-tls Certificate not rendered (Gateway credentialName would dangle)" >&2; exit 1; }
          # 5b. Gateway side: the https-kserve server must consume that same secret.
          [ "$kserve_cred" = "kserve-wildcard-tls" ] \
            || { echo "FAIL: https-kserve server credentialName is '$kserve_cred', not 'kserve-wildcard-tls' — inference hosts would present a cert with no matching SAN." >&2; exit 1; }
          # 5c. The two servers must NOT share a secret: the dashboard secret rarely
          #     carries the '*.<domain>' wildcard SAN.
          [ -n "$dash_cred" ] \
            || { echo "FAIL: could not extract the dashboard (https) server credentialName." >&2; exit 1; }
          [ "$kserve_cred" != "$dash_cred" ] \
            || { echo "FAIL: https-kserve and dashboard servers share credentialName '$kserve_cred' — the wildcard server is reusing the dashboard cert (no matching SAN on inference hosts)." >&2; exit 1; }
          # 6. The https-kserve server must pin minProtocolVersion. Scope the check to
          #    that server's block (extracted above) so dropping it there can't hide
          #    behind the dashboard server's copy.
          grep -Fq 'minProtocolVersion: TLSV1_2' <<<"$kserve_srv" \
            || { echo "FAIL: https-kserve server does not pin minProtocolVersion: TLSV1_2" >&2; exit 1; }
          # 7. The :80 httpsRedirect server must render so plaintext inference hosts
          #    are bounced to https rather than served cleartext.
          grep -Fq 'httpsRedirect: true' <<<"$kserve_gw" \
            || { echo "FAIL: :80 httpsRedirect server not rendered on kserve-ingress-gateway" >&2; exit 1; }
          # 8. BOTH HTTPS servers must terminate TLS at the gateway (mode: SIMPLE).
          #    Flipping either to PASSTHROUGH stops Istio terminating TLS, so the
          #    L7 auth chain (native ext_authz or legacy EnvoyFilter, which inspect the
          #    decrypted HTTP request) never sees the traffic and auth is bypassed
          #    wholesale. Scope to each server block so a downgrade can't hide behind
          #    the other's copy.
          grep -Fq 'mode: SIMPLE' <<<"$kserve_srv" \
            || { echo "FAIL: https-kserve server is not 'mode: SIMPLE' — TLS not terminated at the gateway, L7 auth bypassed." >&2; exit 1; }
          grep -Fq 'mode: SIMPLE' <<<"$dash_srv" \
            || { echo "FAIL: dashboard (https) server is not 'mode: SIMPLE'." >&2; exit 1; }
          if grep -Fq 'PASSTHROUGH' <<<"$out"; then
            echo "FAIL: a gateway server uses TLS mode PASSTHROUGH — Istio no longer terminates TLS, so the L7 auth chain is bypassed." >&2; exit 1
          fi
          # 9. The dashboard (https) server must ALSO pin minProtocolVersion. Check 6
          #    scopes the floor to https-kserve; assert it here for the dashboard
          #    server too so dropping it there can't slip through.
          grep -Fq 'minProtocolVersion: TLSV1_2' <<<"$dash_srv" \
            || { echo "FAIL: dashboard (https) server does not pin minProtocolVersion: TLSV1_2" >&2; exit 1; }
          # 10. The kserve-wildcard-tls Certificate is a LEAF serving cert and must
          #     NOT be minted as a CA. isCA: true would make cert-manager issue a
          #     CA-capable key usable to sign other certs. Scope to that Certificate's
          #     own document (RS='---\n') — the bundled webhook self-signed certs
          #     legitimately carry isCA: true, so a blanket check would false-positive.
          wildcard_cert="$(awk 'BEGIN{RS="---\n"} /kind: Certificate/ && /secretName: kserve-wildcard-tls/{print}' <<<"$out")"
          [ -n "$wildcard_cert" ] \
            || { echo "FAIL: could not isolate the kserve-wildcard-tls Certificate document." >&2; exit 1; }
          if grep -Fq 'isCA: true' <<<"$wildcard_cert"; then
            echo "FAIL: kserve-wildcard-tls Certificate has isCA: true — a leaf serving cert must not be a CA." >&2; exit 1
          fi
          echo "OK: opt-in rendered wildcard server, both flattened hosts, native auth chain, https scheme, wildcard Certificate (leaf, not CA), TLS termination + floor on both servers, and http->https redirect."

      - name: gateway/authn-filter selector agreement
        if: ${{ env.APPCO_TOKEN != '' }}
        run: |
          set -euo pipefail
          # The authn EnvoyFilter's workloadSelector MUST match the Gateway's
          # selector. If they drift, ext_authz attaches to a different workload
          # than the one serving the gateway listeners: the wildcard :443 server
          # still renders but with no auth chain in front. Both templates read the
          # SAME global.istio.ingressGateway.selector; render each with a sentinel
          # value and prove (a) the EnvoyFilter selector is non-empty, (b) it carries
          # the sentinel (so it is templated, not hard-coded), and (c) it EQUALS both
          # Gateways'. The EnvoyFilter renders only in legacy mode, so pin
          # gatewayAuthMode=envoyfilter here (native mode's CRs share the SAME selector
          # helper as the Gateways, so they cannot drift by construction).
          probe=e2e-selector-probe
          common=(--kube-version "$KUBE_VERSION"
                  --set global.demoMode=true
                  --set global.kserveDomain=kubeflow.example.com
                  --set global.oauth2Proxy.gatewayAuthMode=envoyfilter
                  --set global.istio.ingressGateway.selector.istio="$probe")
          gw="$(helm template ci ./kubeflow "${common[@]}" \
            --show-only charts/kubeflow-istio-resources/templates/Gateway/kubeflow-gateway-kubeflow-Gateway.yaml)"
          kgw="$(helm template ci ./kubeflow "${common[@]}" \
            --show-only charts/kubeflow-istio-resources/templates/Gateway/kserve-ingress-gateway-kubeflow-Gateway.yaml)"
          ef="$(helm template ci ./kubeflow "${common[@]}" \
            --show-only charts/kubeflow-istio-resources/templates/EnvoyFilter/authn-filter-EnvoyFilter.yaml)"
          # Gateways: children of `  selector:` (2-space key, 4-space children).
          gw_sel="$(awk '/^  selector:/{g=1;next} g&&/^    /{sub(/^ +/,"");print;next} g{exit}' <<<"$gw" | sort)"
          kgw_sel="$(awk '/^  selector:/{g=1;next} g&&/^    /{sub(/^ +/,"");print;next} g{exit}' <<<"$kgw" | sort)"
          # EnvoyFilter: children of `    labels:` under workloadSelector (6-space).
          ef_sel="$(awk '/^    labels:/{g=1;next} g&&/^      /{sub(/^ +/,"");print;next} g{exit}' <<<"$ef" | sort)"
          [ -n "$ef_sel" ] \
            || { echo "FAIL: authn EnvoyFilter rendered an EMPTY workloadSelector (would attach ext_authz to every gateway in the mesh)." >&2; exit 1; }
          grep -Fq "$probe" <<<"$ef_sel" \
            || { echo "FAIL: authn EnvoyFilter selector does not carry the sentinel — it is hard-coded, not templated from global.istio.ingressGateway.selector. Got: $ef_sel" >&2; exit 1; }
          [ "$ef_sel" = "$gw_sel" ] \
            || { echo "FAIL: selector drift. Gateway=[$gw_sel] EnvoyFilter=[$ef_sel]" >&2; exit 1; }
          [ "$ef_sel" = "$kgw_sel" ] \
            || { echo "FAIL: selector drift. KServe Gateway=[$kgw_sel] EnvoyFilter=[$ef_sel]" >&2; exit 1; }

          # Second render with an explicit null selector — this is what actually
          # exercises the {{- else }} fallback branch. The sentinel render above
          # always SUPPLIES a selector, so it stays green even if the EnvoyFilter
          # guard is reverted to a bare `{{- toYaml … }}` (the round-6 unguarded
          # form): a supplied value renders either way. Only null makes an unguarded
          # EnvoyFilter emit `labels:\n null` (empty → matches every gateway in the
          # mesh) while the Gateway still falls back to a concrete label. Assert the
          # EnvoyFilter fallback is non-empty AND equals both Gateways'.
          gwn="$(helm template ci ./kubeflow --kube-version "$KUBE_VERSION" --set global.demoMode=true \
            --set global.kserveDomain=kubeflow.example.com \
            --set-json 'global.istio.ingressGateway.selector=null' \
            --show-only charts/kubeflow-istio-resources/templates/Gateway/kubeflow-gateway-kubeflow-Gateway.yaml)"
          kgwn="$(helm template ci ./kubeflow --kube-version "$KUBE_VERSION" --set global.demoMode=true \
            --set global.kserveDomain=kubeflow.example.com \
            --set-json 'global.istio.ingressGateway.selector=null' \
            --show-only charts/kubeflow-istio-resources/templates/Gateway/kserve-ingress-gateway-kubeflow-Gateway.yaml)"
          efn="$(helm template ci ./kubeflow --kube-version "$KUBE_VERSION" --set global.demoMode=true \
            --set global.kserveDomain=kubeflow.example.com \
            --set global.oauth2Proxy.gatewayAuthMode=envoyfilter \
            --set-json 'global.istio.ingressGateway.selector=null' \
            --show-only charts/kubeflow-istio-resources/templates/EnvoyFilter/authn-filter-EnvoyFilter.yaml)"
          gwn_sel="$(awk '/^  selector:/{g=1;next} g&&/^    /{sub(/^ +/,"");print;next} g{exit}' <<<"$gwn" | sort)"
          kgwn_sel="$(awk '/^  selector:/{g=1;next} g&&/^    /{sub(/^ +/,"");print;next} g{exit}' <<<"$kgwn" | sort)"
          efn_sel="$(awk '/^    labels:/{g=1;next} g&&/^      /{sub(/^ +/,"");print;next} g{exit}' <<<"$efn" | sort)"
          # A plain non-empty check is VACUOUS: `toYaml nil` renders the literal
          # string `null`, which is non-empty and identical on both sides. Drop the
          # guard on BOTH templates and each emits `labels:\n null` — the -n test and
          # the equality test both pass while ext_authz now matches every gateway in
          # the mesh. Assert instead that the fallback is a CONCRETE label
          # (`key: value`, not `null`) — this is what proves the guard fired.
          grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]*: .+' <<<"$efn_sel" \
            || { echo "FAIL: with selector=null the authn EnvoyFilter did not fall back to a concrete label (guard reverted → attaches ext_authz to every gateway in the mesh). Got: [$efn_sel]" >&2; exit 1; }
          [ "$efn_sel" = "$gwn_sel" ] \
            || { echo "FAIL: with selector=null the EnvoyFilter fallback [$efn_sel] does not match the Gateway fallback [$gwn_sel]." >&2; exit 1; }
          [ "$efn_sel" = "$kgwn_sel" ] \
            || { echo "FAIL: with selector=null the EnvoyFilter fallback [$efn_sel] does not match the KServe Gateway fallback [$kgwn_sel]." >&2; exit 1; }
          echo "OK: selector is templated, matches both Gateways, and the null fallback is a concrete label ($efn_sel)."

      - name: helm template (authn EnvoyFilter security invariants)
        if: ${{ env.APPCO_TOKEN != '' }}
        run: |
          set -euo pipefail
          # The `is_trusted_host` render check elsewhere only proves the EnvoyFilter
          # EXISTS. It does not prove the auth chain still AUTHENTICATES: a one-line
          # downgrade (drop `invert`, flip failure_mode_allow, delete a header strip,
          # force is_trusted_host) is a real render delta that leaves that grep green
          # while opening the gate. Assert the security-critical invariants directly.
          # Render on the NAMED-host path (hostname set) so is_trusted_host is a real
          # host comparison, not the wildcard-listener `true` — that lets us also
          # assert it was NOT hard-forced to true.
          ef="$(helm template ci ./kubeflow --kube-version "$KUBE_VERSION" --set global.demoMode=true \
            --set global.oauth2Proxy.gatewayAuthMode=envoyfilter \
            --set kubeflow-istio-resources.hostname=kf.example.com \
            --show-only charts/kubeflow-istio-resources/templates/EnvoyFilter/authn-filter-EnvoyFilter.yaml)"

          # 1. Patch 1 must strip EVERY client-supplied identity header. Deleting any
          #    one lets a caller spoof it: on the skip-auth path ext_authz never runs,
          #    so a client-sent x-auth-request-email survives and Patch 3 mints
          #    kubeflow-userid from it. grep -F: these are literal Lua calls.
          for h in kubeflow-userid x-auth-request-email x-auth-request-user \
                   x-auth-request-groups x-auth-request-preferred-username; do
            grep -Fq "remove(\"$h\")" <<<"$ef" \
              || { echo "FAIL: Patch 1 no longer strips client-supplied '$h' — it can be spoofed into kubeflow-userid." >&2; exit 1; }
          done

          # 2. ext_authz must fail CLOSED. failure_mode_allow: true serves every
          #    request unauthenticated during any oauth2-proxy outage.
          grep -Fq 'failure_mode_allow: false' <<<"$ef" \
            || { echo "FAIL: ext_authz failure_mode_allow is not 'false' — auth fails OPEN on an oauth2-proxy outage." >&2; exit 1; }
          if grep -Fq 'failure_mode_allow: true' <<<"$ef"; then
            echo "FAIL: ext_authz failure_mode_allow is 'true' — auth fails OPEN on an oauth2-proxy outage." >&2; exit 1
          fi

          # 3. The ext_authz gate must be INVERTED: run auth UNLESS skip_auth=true.
          #    Without `invert: true` the sense flips — ext_authz runs ONLY on
          #    /dex/ and /oauth2/ and is skipped everywhere else, including all
          #    inference hosts. (invert: appears only on filter_enabled_metadata.)
          grep -Fq 'invert: true' <<<"$ef" \
            || { echo "FAIL: ext_authz filter_enabled_metadata is missing 'invert: true' — the auth gate is inverted, skipping auth on every non-/dex,/oauth2 path." >&2; exit 1; }

          # 4. The unauthenticated bypass must stay scoped to /dex/ and /oauth2/ AND
          #    be gated on the trusted host. Widening ^/dex/ to ^/ (or dropping the
          #    is_trusted_host gate) opens the whole surface unauthenticated.
          grep -Fq 'if is_trusted_host then' <<<"$ef" \
            || { echo "FAIL: the /dex/,/oauth2/ bypass is no longer gated on is_trusted_host." >&2; exit 1; }
          grep -Fq 'path:find("^/dex/")' <<<"$ef" \
            || { echo "FAIL: the auth bypass no longer scopes to '^/dex/' (widened path opens unauthenticated access)." >&2; exit 1; }
          grep -Fq 'path:find("^/oauth2/")' <<<"$ef" \
            || { echo "FAIL: the auth bypass no longer scopes to '^/oauth2/'." >&2; exit 1; }

          # 5. On a named host is_trusted_host MUST be a real host comparison, never
          #    hard-forced true (which would trust every Host header and reinstate the
          #    wildcard-host bypass on the internet-facing named listener). The
          #    forced-true form is only legitimate on the wildcard branch, which this
          #    named-host render does not emit — so it must be absent here.
          #    Use line-anchored regex matching to ensure exact line matching and prevent suffix bypasses.
          grep -Eq '^[[:space:]]*local is_trusted_host = \(host == dashboard_host\)[[:space:]]*$' <<<"$ef" \
            || { echo "FAIL: is_trusted_host is not exactly 'local is_trusted_host = (host == dashboard_host)' on the named-host path." >&2; exit 1; }
          if grep -Fq 'is_trusted_host = true' <<<"$ef"; then
            echo "FAIL: is_trusted_host is hard-forced true on the named-host path — trusts every Host header." >&2; exit 1
          fi
          # Harden: check there is no other reassignment of is_trusted_host inside the filter code
          # (e.g. is_trusted_host = true or similar reassignment to bypass). Lua assignments look like is_trusted_host = ...
          if grep -Eq '^[[:space:]]*is_trusted_host[[:space:]]*=' <<<"$ef"; then
            echo "FAIL: is_trusted_host is reassigned in the named-host path." >&2; exit 1
          fi
          # Assert exactly 5 occurrences of the string 'is_trusted_host' in the named-host render (ef)
          # to prevent any hidden declarations or multiple definitions.
          trusted_host_occurrences="$(grep -o 'is_trusted_host' <<<"$ef" | wc -l)"
          [ "$trusted_host_occurrences" -eq 5 ] \
            || { echo "FAIL: expected exactly 5 occurrences of 'is_trusted_host' in named-host authn-filter (got $trusted_host_occurrences). Direct reassignment or duplicate variables are present." >&2; exit 1; }

          # 6. Every patch must apply at the GATEWAY, not SIDECAR_INBOUND. The
          #    workloadSelector targets the ingress gateway; flipping context to
          #    SIDECAR_INBOUND makes istiod skip the gateway listener entirely, so
          #    the auth chain silently never attaches and the wildcard :443 server
          #    serves unauthenticated. Assert GATEWAY is present and SIDECAR_INBOUND
          #    is wholly absent.
          #    Count context declarations (anchored to 6-space patch indent) to ensure
          #    ALL patches apply at context: GATEWAY. This ignores comments or other
          #    unindented instances.
          total_contexts="$(grep -c '^[[:space:]]\{6\}context: ' <<<"$ef" || true)"
          gateway_contexts="$(grep -c '^[[:space:]]\{6\}context: GATEWAY' <<<"$ef" || true)"
          [ "$total_contexts" -gt 0 ] \
            || { echo "FAIL: no context defined in authn EnvoyFilter patches." >&2; exit 1; }
          [ "$total_contexts" -eq "$gateway_contexts" ] \
            || { echo "FAIL: some authn EnvoyFilter patches do not apply at context: GATEWAY (got $gateway_contexts/$total_contexts GATEWAY)." >&2; exit 1; }
          if grep -Fq 'SIDECAR_INBOUND' <<<"$ef"; then
            echo "FAIL: authn EnvoyFilter has a SIDECAR_INBOUND patch — a GATEWAY patch was retargeted and no longer attaches to the ingress gateway (auth chain never runs)." >&2; exit 1
          fi

          # 7. ext_authz must fail CLOSED on an error talking to oauth2-proxy:
          #    status_on_error must be an error code (ServiceUnavailable), never OK.
          #    status_on_error: OK turns any auth-service error into an allow — the
          #    same open-gate failure mode as failure_mode_allow, via a different key.
          grep -Fq 'code: ServiceUnavailable' <<<"$ef" \
            || { echo "FAIL: ext_authz status_on_error is not 'ServiceUnavailable' — an auth-service error would not fail closed." >&2; exit 1; }
          if grep -Eq 'status_on_error:[[:space:]]*$' <<<"$ef" && grep -Eq 'code:[[:space:]]*OK' <<<"$ef"; then
            echo "FAIL: ext_authz status_on_error code is 'OK' — auth-service errors are treated as allow (fails OPEN)." >&2; exit 1
          fi
          echo "OK: authn chain strips all identity headers, fails closed (failure_mode_allow + status_on_error), inverts the gate, applies at GATEWAY, and scopes the bypass to trusted-host /dex,/oauth2."

      - name: helm template (assert kserveGateway.name consumers stay in sync)
        if: ${{ env.APPCO_TOKEN != '' }}
        run: |
          set -euo pipefail
          # Assert that when global.kserveGateway.name is overridden, all three consumers
          # (kubeflow-istio-resources, knative-serving, and kserve) receive the same overridden values.
          custom_ns="custom-namespace"
          custom_name="custom-gateway-name"
          out="$(helm template ci ./kubeflow \
            --kube-version "$KUBE_VERSION" \
            --set global.demoMode=true \
            --set global.kserveDomain=kubeflow.example.com \
            --set global.kserveGateway.name="${custom_ns}/${custom_name}")"

          # 1. kubeflow-istio-resources Gateway CRD metadata
          # Extract metadata from the Gateway document named custom-name in custom-namespace
          gw_doc="$(awk 'BEGIN{RS="---\n"} /kind: Gateway/ && /name: '"$custom_name"'/{print}' <<<"$out")"
          [ -n "$gw_doc" ] \
            || { echo "FAIL: Gateway CRD with name '$custom_name' was not rendered." >&2; exit 1; }
          grep -Eq 'namespace:[[:space:]]*'"$custom_ns" <<<"$gw_doc" \
            || { echo "FAIL: Gateway CRD namespace does not match overridden namespace '$custom_ns'." >&2; exit 1; }

          # 2. knative-serving config-istio key "gateway.<namespace>.<name>"
          grep -Fq "gateway.${custom_ns}.${custom_name}" <<<"$out" \
            || { echo "FAIL: knative-serving config-istio key is not 'gateway.${custom_ns}.${custom_name}'." >&2; exit 1; }

          # 3. kserve inferenceservice-config "ingressGateway": "<namespace>/<name>"
          grep -Fq "\"ingressGateway\":\"${custom_ns}/${custom_name}\"" <<<"$out" \
            || { echo "FAIL: kserve inferenceservice-config ingressGateway is not '${custom_ns}/${custom_name}'." >&2; exit 1; }

          echo "OK: all three consumers of kserveGateway.name are in sync under override ($custom_ns/$custom_name)."

      - name: kubectl image tags stay consistent
        run: |
          set -euo pipefail
          # The chart pulls containers/kubectl for the Trainer runtimes applier
          # (trainer.runtimes.applier.image), the preflight and webhook-secret-migration
          # hooks (preflightChecks.image) and the kserve-config helm test
          # (testImages.kubectl). Keep them on one tag so there is one image to mirror.
          # Any containers/kubectl pin in a values.yaml counts, so a new consumer is
          # covered too.
          refs="$(grep -rn --include=values.yaml -A2 'repository: containers/kubectl' kubeflow \
            | grep -E 'tag: ' | sed -E 's/^([^-]+)-[0-9]+-\s*tag:\s*/\1 /')"
          echo "$refs"
          [ "$(wc -l <<<"$refs")" -ge 3 ] \
            || { echo "FAIL: expected at least 3 containers/kubectl images (applier, preflight, helm test); found:" >&2; echo "$refs" >&2; exit 1; }
          [ "$(awk '{print $2}' <<<"$refs" | sort -u | wc -l)" -eq 1 ] \
            || { echo "FAIL: containers/kubectl is pinned to different tags; bump them together." >&2; exit 1; }
          echo "OK: all containers/kubectl images use tag $(awk 'NR==1{print $2}' <<<"$refs")."

      - name: helm template (opt-in security guards fail closed)
        if: ${{ env.APPCO_TOKEN != '' }}
        run: |
          set -euo pipefail
          # The external-HTTPS opt-in must be refused when the bundled oauth2-proxy
          # (the gateway auth chain) is disabled — otherwise the wildcard server
          # publishes the whole Kubeflow surface unauthenticated. Assert it FAILS,
          # and that it fails for the RIGHT reason (the oauth2Proxy guard message),
          # not some unrelated template error that would mask a regression.
          # istioResources.externalAuth=true gets past the gateway-login guard: the opt-out
          # must not lift this requirement.
          if err="$(helm template ci ./kubeflow \
              --kube-version "$KUBE_VERSION" \
              --set global.demoMode=true \
              --set global.kserveExternalHttps=true \
              --set global.kserveDomain=kubeflow.example.com \
              --set global.oauth2Proxy.enabled=false \
              --set istioResources.externalAuth=true \
              --set kubeflow-istio-resources.hostname=kf.example.com \
              --set kubeflow-istio-resources.tls.source=letsEncrypt \
              --set kubeflow-istio-resources.tls.letsEncrypt.solver=cloudflare \
              --set kubeflow-istio-resources.tls.cloudflare.apiTokenSecretRef.name=cf-token \
              2>&1)"; then
            echo "FAIL: kserveExternalHttps with oauth2Proxy.enabled=false rendered" \
                 "instead of failing closed." >&2
            exit 1
          fi
          # here-string (not `echo | grep -q`) to avoid a SIGPIPE/broken-pipe false
          # failure under pipefail when grep -q short-circuits on the first match.
          grep -q 'global.oauth2Proxy.enabled must be true' <<<"$err" \
            || { echo "FAIL: opt-in failed, but not on the oauth2Proxy guard. Got:" >&2
                 echo "$err" >&2; exit 1; }
          echo "OK: opt-in fails closed on the oauth2-proxy guard when it is disabled."
          # The gateway must not run without login: oauth2-proxy off with Istio resources on
          # fails unless istioResources.externalAuth=true says another layer authenticates.
          if err="$(helm template ci ./kubeflow --kube-version "$KUBE_VERSION" \
              --set global.demoMode=true --set global.oauth2Proxy.enabled=false 2>&1)"; then
            echo "FAIL: oauth2Proxy.enabled=false with istioResources rendered instead of failing closed." >&2
            exit 1
          fi
          grep -qF 'the kubeflow-gateway would serve the Central Dashboard and every app without login' <<<"$err" \
            || { echo "FAIL: render failed, but not on the gateway-login guard. Got:" >&2; echo "$err" >&2; exit 1; }
          helm template ci ./kubeflow --kube-version "$KUBE_VERSION" --set global.demoMode=true \
              --set global.oauth2Proxy.enabled=false --set istioResources.externalAuth=true >/dev/null \
            || { echo "FAIL: istioResources.externalAuth=true did not allow oauth2Proxy.enabled=false." >&2; exit 1; }
          echo "OK: the gateway-login guard fails closed and honours istioResources.externalAuth."
          # externaldns.cloudflare.apiToken reaches external-dns through the default env; a custom
          # env without CF_API_TOKEN would drop it silently, so that must fail.
          dns=(--set global.demoMode=true --set externaldns.enabled=true --set externaldns.cloudflare.apiToken=ci-token)
          out="$(helm template ci ./kubeflow --kube-version "$KUBE_VERSION" "${dns[@]}")"
          grep -q 'name: cloudflare-api-token$' <<<"$out" && grep -q 'name: CF_API_TOKEN$' <<<"$out" \
            || { echo "FAIL: apiToken did not render the cloudflare-api-token Secret and CF_API_TOKEN env." >&2; exit 1; }
          if err="$(helm template ci ./kubeflow --kube-version "$KUBE_VERSION" "${dns[@]}" \
              --set-json 'externaldns.env=[{"name":"HTTPS_PROXY","value":"http://proxy:3128"}]' 2>&1)"; then
            echo "FAIL: apiToken with an env lacking CF_API_TOKEN rendered instead of failing." >&2; exit 1
          fi
          grep -qF 'has no CF_API_TOKEN' <<<"$err" \
            || { echo "FAIL: render failed, but not on the CF_API_TOKEN guard. Got:" >&2; echo "$err" >&2; exit 1; }
          echo "OK: apiToken reaches external-dns, and a custom env that drops it is refused."

      - name: helm template (Model Registry topology — perProfile multi-profile, shared, external DB, guards)
        if: ${{ env.APPCO_TOKEN != '' }}
        # The default render above only covers the example profile. This pins the
        # per-profile fan-out (example profile + additionalUsers[] + extraNamespaces[]),
        # the shared-mode fallback, the external-Postgres variant and the mode guards,
        # so a template edit can't silently drop a profile's registry, leak a server back
        # into `kubeflow` in perProfile mode, or break the BFF discovery label.
        run: |
          set -euo pipefail
          base=(--kube-version "$KUBE_VERSION" --set global.demoMode=true)
          opt=(--set hub.controller.enabled=true --set hub.kserve.storageContainer.enabled=true)
          multi=(--set 'user-namespace.additionalUsers[0].email=alice@example.com'
                 --set 'user-namespace.additionalUsers[0].namespace=alice'
                 --set 'user-namespace.modelRegistry.extraNamespaces[0]=team-x')
          d="$(mktemp -d)"
          helm template ci ./kubeflow "${base[@]}" "${opt[@]}" "${multi[@]}" \
            --set hub.controller.env.registriesNamespace=kubeflow-user-example-com >"$d/perProfile.yaml"
          helm template ci ./kubeflow "${base[@]}" "${opt[@]}" \
            --set global.modelRegistry.mode=shared >"$d/shared.yaml"
          helm template ci ./kubeflow "${base[@]}" "${multi[@]}" \
            --set user-namespace.modelRegistry.db.mode=external \
            --set user-namespace.modelRegistry.db.external.host=pg.example.com \
            --set user-namespace.modelRegistry.db.external.existingSecret=pg >"$d/external.yaml"
          python3 kubeflow/test/ci/check_model_registry_topology.py "$d"
          # The mode and first-namespace rules are written in three charts (they cannot share templates):
          # render a matrix of values and check the umbrella, kubeflow-hub and user-namespace agree.
          python3 kubeflow/test/ci/check_model_registry_consistency.py ./kubeflow "${base[@]}"
          python3 kubeflow/test/ci/check_kfp_profile_controller.py "$d/perProfile.yaml" kubeflow-user-example-com alice team-x
          # Guards must fail closed, each on its OWN message (not a masking error).
          check_fail() {
            local want="$1"; shift
            if err="$(helm template ci ./kubeflow "${base[@]}" "$@" 2>&1)"; then
              echo "FAIL: render succeeded but should fail ($want): $*" >&2; exit 1
            fi
            grep -qF -- "$want" <<<"$err" \
              || { echo "FAIL: render failed for the wrong reason (want '$want'): $*" >&2; echo "$err" >&2; exit 1; }
          }
          check_fail 'requires pipelines.enabled=true' --set global.modelRegistry.mode=shared --set pipelines.enabled=false
          check_fail 'conflicts with global.modelRegistry.mode=shared' --set global.modelRegistry.mode=shared --set user-namespace.modelRegistry.enabled=true
          check_fail 'also set user-namespace.modelRegistry.enabled=false' --set hub.enabled=false
          check_fail 'requires controller.env.registriesNamespace' --set hub.controller.enabled=true
          check_fail 'requires modelRegistry.db.external.host' --set user-namespace.modelRegistry.db.mode=external
          check_fail '/global/modelRegistry/mode' --set global.modelRegistry.mode=bogus
          check_fail 'db.embedded.existingSecret is empty and this render cannot see the cluster' \
            --set global.demoMode=false --set auth.oidc.clientSecret=ci-client \
            --set auth.oidc.cookieSecret=ci-cookie-secret-0123456789abcde \
            --set pipelines.seaweedfs.accessKey=ci-ak --set pipelines.seaweedfs.secretKey=ci-sk \
            --set-string 'auth.initialUser.passwordHash=$2b$10$axMzgOl8gj6ClQ.aoXgKseNmpDVw9w1umbZS1TCnwTczSEy9BrgYy'
          check_fail 'Postgres truncates identifiers to 63' --set user-namespace.modelRegistry.db.mode=external \
            --set user-namespace.modelRegistry.db.external.host=pg.example.com \
            --set user-namespace.modelRegistry.db.external.existingSecret=pg \
            --set user-namespace.modelRegistry.db.external.databasePrefix=model_registry_with_a_deliberately_long_prefix_
          # Value guards added with the per-profile layout.
          check_fail 'global.istio.ingressGateway.principal must not be empty' --set-string global.istio.ingressGateway.principal=
          check_fail 'REMOVED VALUE KEY: user-namespace.pipelines' --set user-namespace.pipelines.seaweedfs.accessKey=x
          check_fail 'is not a profile namespace' --set 'user-namespace.modelRegistry.extraNamespaces[0]=kubeflow'
          check_fail 'profile.name "kube-system" is not a profile namespace' --set user-namespace.profile.name=kube-system
          check_fail 'is listed more than once' --set 'user-namespace.modelRegistry.extraNamespaces[0]=kubeflow-user-example-com'
          echo "OK: Model Registry mode guards fail closed."

      - name: Postgres major version changes only on purpose
        if: ${{ env.APPCO_TOKEN != '' }}
        # Postgres data on PVCs (per-profile Model Registry DBs, Model Catalog) cannot be read by a newer
        # major version. Change PG_MAJOR only together with a migration note
        # (docs/upgrade-notes.md#postgres-major-versions).
        run: |
          set -euo pipefail
          PG_MAJOR=18
          majors="$(helm template ci ./kubeflow --kube-version "$KUBE_VERSION" --set global.demoMode=true \
                      --set hub.catalog.enabled=true \
                    | grep -oE 'image: "?[^" ]*postgresql:[0-9]+' | sed -E 's/.*postgresql:([0-9]+)/\1/' | sort -u)"
          [ -n "$majors" ] || { echo "FAIL: no Postgres image found in the render" >&2; exit 1; }
          [ "$majors" = "$PG_MAJOR" ] \
            || { echo "FAIL: Postgres major version(s) $(echo $majors) != PG_MAJOR=$PG_MAJOR. See docs/upgrade-notes.md#postgres-major-versions." >&2; exit 1; }
          echo "OK: every Postgres image is major version $PG_MAJOR."

      - name: helm template (Istio CNI mode — profile namespace labels + PSS baseline)
        if: ${{ env.APPCO_TOKEN != '' }}
        # global.istio.cni (default true) decides whether profile namespaces enforce Pod Security
        # Standards 'baseline' (upstream kubeflow-pss). Both modes must label Helm-created profile
        # namespaces istio-injection: enabled; only cni=true adds the PSS label, both on the Namespaces
        # and in the profile controller's namespace-labels ConfigMap (runtime-created profiles).
        # Under cni=true every workload the chart renders into a profile namespace must pass
        # 'baseline', or the default install breaks there (kubeflow/test/unit/pss_baseline.py).
        run: |
          set -euo pipefail
          multi=(--set 'user-namespace.additionalUsers[0].email=alice@example.com'
                 --set 'user-namespace.additionalUsers[0].namespace=alice'
                 --set 'user-namespace.modelRegistry.extraNamespaces[0]=team-x')
          d="$(mktemp -d)"
          for m in true false; do
            helm template ci ./kubeflow --kube-version "$KUBE_VERSION" --set global.demoMode=true \
              "${multi[@]}" --set global.istio.cni=$m >"$d/cni-$m.yaml"
          done
          python3 kubeflow/test/ci/check_istio_cni_mode.py "$d"
          # The preflight Job's CNI check is shell that only runs in a cluster: run it against fake
          # cluster states (kubectl comes with the runner image).
          python3 kubeflow/test/ci/check_preflight_istio_cni.py ./kubeflow --kube-version "$KUBE_VERSION" --set global.demoMode=true
          # Sub-charts cannot share templates, so each chart that reads global.istio.cni has its own
          # copy of the istioCni helper; their bodies must stay identical.
          bodies="$(for f in kubeflow/templates/_helpers.tpl kubeflow/charts/*/templates/_helpers.tpl; do
            sed -n '/define "[a-z-]*\.istioCni"/,/^{{- end -}}/p' "$f" | sed 1d; done | sort | uniq -c)"
          [ "$(wc -l <<<"$bodies")" -eq 2 ] && grep -q '^ *3 ' <<<"$bodies" \
            || { echo "FAIL: expected 3 identical istioCni helper copies, got:" >&2; echo "$bodies" >&2; exit 1; }
          python3 kubeflow/test/unit/pss_baseline.py "$d/cni-true.yaml" kubeflow-user-example-com alice team-x \
            || { echo "FAIL: workloads rendered into profile namespaces violate PSS baseline (enforced when global.istio.cni=true)" >&2; exit 1; }
          echo "OK: everything rendered into profile namespaces passes PSS baseline."

      - name: helm template (credential overrides must reach every consumer)
        if: ${{ env.APPCO_TOKEN != '' }}
        run: |
          set -euo pipefail
          # Offline renders without demoMode must name the registry DB Secret (else a new password per render).
          sw=(--set pipelines.seaweedfs.accessKey=ci-ak
              --set pipelines.seaweedfs.secretKey=ci-sk
              --set-string 'auth.initialUser.passwordHash=$2b$10$axMzgOl8gj6ClQ.aoXgKseNmpDVw9w1umbZS1TCnwTczSEy9BrgYy'
              --set user-namespace.modelRegistry.db.embedded.existingSecret=ci-mr-db)
          # 1. OIDC: overriding auth.oidc.* must reach Dex and oauth2-proxy (both read
          #    the chart-managed kubeflow-oidc-client Secret), so the default
          #    values.yaml client/cookie secrets must not appear anywhere in the output.
          out="$(helm template ci ./kubeflow --kube-version "$KUBE_VERSION" "${sw[@]}" \
                   --set auth.oidc.clientSecret=ci-client \
                   --set auth.oidc.cookieSecret=ci-cookie-secret-0123456789abcde)"
          # Secret data is base64-encoded (Dex keeps its config in one), so decode
          # every Secret before searching.
          plain="$(python3 -c '
          import base64, sys, yaml
          for d in yaml.safe_load_all(sys.stdin):
              if d:
                  print(yaml.safe_dump(d))
                  if d.get("kind") == "Secret":
                      for v in (d.get("data") or {}).values():
                          print(base64.b64decode(v).decode(errors="replace"))
          ' <<<"$out")"
          for default in pUBnBOY80SnXgjibTYM9ZWNzY2xreNGQok 3GvvtL75w3Y8ERsQ9ma81nIngIx4YrjXNtQpCNDa4Vc=; do
            if grep -qF -- "$default" <<<"$plain"; then
              echo "FAIL: auth.oidc.* override did not reach every consumer (a values.yaml default is still rendered)" >&2
              exit 1
            fi
          done
          grep -q 'secretEnv: KUBEFLOW_OIDC_CLIENT_SECRET' <<<"$plain" \
            || { echo "FAIL: Dex static client no longer reads the shared Secret" >&2; exit 1; }
          # 2. SeaweedFS: pipelines.seaweedfs.* is the single source. The KFP profile
          #    controller copies it from the kubeflow-namespace mlpipeline-minio-artifact
          #    Secret into each profile at runtime, so the chart itself must render NO
          #    per-profile copy, and the override must reach the source Secret.
          python3 -c '
          import sys, yaml
          s = [d for d in yaml.safe_load_all(sys.stdin) if d and d.get("kind") == "Secret"
               and d["metadata"]["name"] == "mlpipeline-minio-artifact" and d["metadata"].get("namespace") == "kubeflow"]
          sys.exit(0 if s and (s[0].get("stringData") or {}).get("secretkey") == "ci-sk" else 1)
          ' <<<"$out" \
            || { echo "FAIL: pipelines.seaweedfs.secretKey override did not reach the kubeflow mlpipeline-minio-artifact Secret" >&2; exit 1; }
          if python3 -c '
          import sys, yaml
          sys.exit(0 if any(d and d.get("kind") == "Secret" and d["metadata"]["name"] == "mlpipeline-minio-artifact"
                            and d["metadata"].get("namespace") not in (None, "kubeflow")
                            for d in yaml.safe_load_all(sys.stdin)) else 1)
          ' <<<"$out"; then
            echo "FAIL: the chart renders a per-profile mlpipeline-minio-artifact Secret (KFP profile controller owns it)" >&2
            exit 1
          fi
          # 3. oauth2-proxy only starts with a 16/24/32-byte cookie secret (raw, or URL-safe
          #    base64 of one); validations.yaml mirrors its parsing. A bad value must fail the
          #    render, a good one must render, and auth.oidc.existingSecret skips the check.
          ck() { helm template ci ./kubeflow --kube-version "$KUBE_VERSION" --set global.demoMode=true "$@" 2>&1; }
          # tooshort: 8 bytes; 20 chars: 20 raw / 15 decoded; standard base64 with "+" (oauth2-proxy
          # doesn't decode it) is 44 raw bytes.
          for bad in tooshort aaaaaaaaaaaaaaaaaaaa '+++++++++++++++++++++++++++++++++++++++++++='; do
            if err="$(ck --set-string auth.oidc.cookieSecret="$bad")"; then
              echo "FAIL: auth.oidc.cookieSecret='$bad' rendered; oauth2-proxy would not start." >&2; exit 1
            fi
            grep -q 'auth.oidc.cookieSecret must be 16, 24 or 32 bytes' <<<"$err" \
              || { echo "FAIL: cookieSecret='$bad' failed, but not on the length guard. Got:" >&2; echo "$err" >&2; exit 1; }
          done
          ck --set-string auth.oidc.cookieSecret="$(head -c 32 /dev/urandom | base64 | tr -- '+/' '-_')" >/dev/null \
            || { echo "FAIL: a URL-safe base64 32-byte cookieSecret was rejected." >&2; exit 1; }
          ck --set-string auth.oidc.cookieSecret=tooshort --set auth.oidc.existingSecret=my-oidc >/dev/null \
            || { echo "FAIL: the cookieSecret length check ran although auth.oidc.existingSecret is set." >&2; exit 1; }
          echo "OK: OIDC overrides reach every consumer; SeaweedFS credentials are single-sourced (no per-profile copy rendered); cookieSecret length is enforced."

      - name: helm template (generated credentials, extra pull-secret namespaces, Profiles uninstall hook)
        if: ${{ env.APPCO_TOKEN != '' }}
        run: |
          set -euo pipefail
          # The credentials default to "": generated and kept via lookup. Offline renders without
          # demoMode must refuse that (each render would generate new ones) and list every such value.
          if err="$(helm template ci ./kubeflow --kube-version "$KUBE_VERSION" -n kubeflow 2>&1)"; then
            echo "FAIL: empty credentials rendered offline instead of failing." >&2; exit 1
          fi
          for v in auth.oidc.clientSecret auth.oidc.cookieSecret auth.initialUser.passwordHash pipelines.seaweedfs.accessKey pipelines.seaweedfs.secretKey; do
            grep -qF -- "  - $v" <<<"$err" || { echo "FAIL: the offline-generation error does not list $v. Got:" >&2; echo "$err" >&2; exit 1; }
          done
          # With cluster access (simulated: kubeflow.clusterVisible forced true in a copy) they are generated.
          tmp="$(mktemp -d)"; cp -r kubeflow "$tmp/"
          sed -i 's|{{- if lookup "v1" "Namespace" "" "kube-system" }}true{{ end -}}|true|' "$tmp/kubeflow/templates/_helpers.tpl"
          helm template ci "$tmp/kubeflow" --kube-version "$KUBE_VERSION" -n kubeflow \
            --set user-namespace.modelRegistry.db.embedded.existingSecret=mr-db > "$tmp/generated.yaml"
          python3 - "$tmp/generated.yaml" <<'PY'
          import sys, yaml
          s = {d["metadata"]["name"]: d.get("stringData", {}) for d in yaml.safe_load_all(open(sys.argv[1])) if d and d.get("kind") == "Secret"}
          checks = [("kubeflow-oidc-client", "client-secret", 32), ("kubeflow-oidc-client", "cookie-secret", 32),
                    ("kubeflow-initial-user", "password", 20), ("mlpipeline-minio-artifact", "accesskey", 20),
                    ("mlpipeline-minio-artifact", "secretkey", 40)]
          bad = [f"{n}.{k}" for n, k, l in checks if len(s.get(n, {}).get(k, "")) != l]
          if not s.get("kubeflow-initial-user", {}).get("hash", "").startswith("$2a$"):
              bad.append("kubeflow-initial-user.hash (bcrypt)")
          sys.exit(f"FAIL: not generated as expected: {', '.join(bad)}" if bad else 0)
          PY
          # With demoMode, empty credentials take the published demo values (no generation, works offline).
          helm template ci ./kubeflow --kube-version "$KUBE_VERSION" -n kubeflow --set global.demoMode=true > "$tmp/demo.yaml"
          python3 - "$tmp/demo.yaml" <<'PY'
          import sys, yaml
          s = {d["metadata"]["name"]: d.get("stringData", {}) for d in yaml.safe_load_all(open(sys.argv[1])) if d and d.get("kind") == "Secret"}
          want = {("kubeflow-oidc-client", "client-secret"): "pUBnBOY80SnXgjibTYM9ZWNzY2xreNGQok",
                  ("kubeflow-initial-user", "hash"): "$2y$12$arGZ9p14vTUDsOg/GZ6DRu8UjXxtB60UI3A1Api5/UXjdBz5qTEjm",
                  ("mlpipeline-minio-artifact", "accesskey"): "kubeflow"}
          bad = [f"{n}.{k}" for (n, k), v in want.items() if s.get(n, {}).get(k) != v]
          sys.exit(f"FAIL: demoMode did not fill in the demo value of: {', '.join(bad)}" if bad else 0)
          PY
          # An explicit demo password hash without demoMode is refused, like the other demo credentials.
          if err="$(helm template ci ./kubeflow --kube-version "$KUBE_VERSION" -n kubeflow --set auth.oidc.clientSecret=ci \
              --set auth.oidc.cookieSecret=ci-cookie-secret-0123456789abcde --set pipelines.seaweedfs.accessKey=ci-ak \
              --set pipelines.seaweedfs.secretKey=ci-sk --set user-namespace.modelRegistry.db.embedded.existingSecret=mr \
              --set-string 'auth.initialUser.passwordHash=$2y$12$arGZ9p14vTUDsOg/GZ6DRu8UjXxtB60UI3A1Api5/UXjdBz5qTEjm' 2>&1)"; then
            echo "FAIL: the demo password hash rendered without demoMode." >&2; exit 1
          fi
          grep -qF "SECURITY: auth.initialUser.passwordHash" <<<"$err" || { echo "FAIL: wrong error for the demo hash: $err" >&2; exit 1; }
          # External identity provider (Dex connector, password login off): no password is generated or
          # required, even offline, and the Secret Dex's env var references holds no password.
          idp=(--set auth.oidc.clientSecret=ci --set auth.oidc.cookieSecret=ci-cookie-secret-0123456789abcde
               --set pipelines.seaweedfs.accessKey=ci-ak --set pipelines.seaweedfs.secretKey=ci-sk
               --set user-namespace.modelRegistry.db.embedded.existingSecret=mr
               --set dex.config.enablePasswordDB=false --set-json 'dex.config.staticPasswords=[]'
               --set-json 'dex.config.connectors=[{"type":"oidc","id":"corp","name":"Corp","config":{"issuer":"https://idp.example.com","clientID":"kf","clientSecret":"x","redirectURI":"http://kf.example.com/dex/callback"}}]')
          helm template ci ./kubeflow --kube-version "$KUBE_VERSION" -n kubeflow "${idp[@]}" \
              -s templates/secrets/initial-user-Secret.yaml > "$tmp/idp.yaml" \
            || { echo "FAIL: an external identity provider still requires auth.initialUser.passwordHash." >&2; exit 1; }
          grep -q '^  hash: ""$' "$tmp/idp.yaml" && ! grep -q '^  password:' "$tmp/idp.yaml" \
            || { echo "FAIL: kubeflow-initial-user holds a password although Dex's password login is off:" >&2; cat "$tmp/idp.yaml" >&2; exit 1; }
          # oauth2-proxy's client is registered with Dex: without Dex it needs auth.oidc.existingSecret.
          if helm template ci ./kubeflow --kube-version "$KUBE_VERSION" -n kubeflow --set global.demoMode=true \
              --set dex.enabled=false >/dev/null 2>&1; then
            echo "FAIL: oauth2-proxy without Dex and without auth.oidc.existingSecret rendered." >&2; exit 1
          fi
          helm template ci ./kubeflow --kube-version "$KUBE_VERSION" -n kubeflow --set global.demoMode=true \
              --set dex.enabled=false --set auth.oidc.existingSecret=true >/dev/null \
            || { echo "FAIL: oauth2-proxy without Dex but with auth.oidc.existingSecret=true did not render." >&2; exit 1; }
          # Dex reads the initial user's hash through an env var; dropping it must fail clearly.
          if err="$(helm template ci ./kubeflow --kube-version "$KUBE_VERSION" -n kubeflow --set global.demoMode=true \
              --set-json 'dex.envVars=[{"name":"KUBEFLOW_OIDC_CLIENT_SECRET","valueFrom":{"secretKeyRef":{"name":"kubeflow-oidc-client","key":"client-secret"}}}]' 2>&1)"; then
            echo "FAIL: dex.envVars without KUBEFLOW_INITIAL_USER_HASH rendered." >&2; exit 1
          fi
          grep -qF "keep the KUBEFLOW_INITIAL_USER_HASH entry" <<<"$err" || { echo "FAIL: wrong error for missing Dex env var: $err" >&2; exit 1; }
          if helm template ci ./kubeflow --kube-version "$KUBE_VERSION" -n kubeflow --set global.demoMode=true \
              --set auth.initialUser.email=admin@example.org >/dev/null 2>&1; then
            echo "FAIL: auth.initialUser.email differing from Dex's staticPasswords email rendered." >&2; exit 1
          fi
          # externalSecrets.extraNamespaces adds name-matched namespaces; without it the selector is unchanged.
          ces="$(helm template ci ./kubeflow --kube-version "$KUBE_VERSION" -n kubeflow --set global.demoMode=true \
            --set-json 'externalSecrets.extraNamespaces=["knative-serving"]' -s templates/external-secrets/ClusterExternalSecret.yaml)"
          grep -q 'namespaceSelectors:' <<<"$ces" && grep -q -- '- knative-serving' <<<"$ces" \
            || { echo "FAIL: extraNamespaces did not add knative-serving to namespaceSelectors:" >&2; echo "$ces" >&2; exit 1; }
          # An empty namespaceSelector must not join namespaceSelectors (it would match every namespace).
          ces="$(helm template ci ./kubeflow --kube-version "$KUBE_VERSION" -n kubeflow --set global.demoMode=true \
            --set-json 'externalSecrets.extraNamespaces=["knative-serving"]' --set-json 'externalSecrets.namespaceSelector.matchLabels=null' \
            -s templates/external-secrets/ClusterExternalSecret.yaml)"
          python3 - "$ces" <<'PY'
          import sys, yaml
          for d in yaml.safe_load_all(sys.argv[1]):
              if d and d.get("kind") == "ClusterExternalSecret" and any(not sel for sel in d["spec"]["namespaceSelectors"]):
                  sys.exit("FAIL: an empty selector in namespaceSelectors matches every namespace")
          PY
          helm template ci ./kubeflow --kube-version "$KUBE_VERSION" -n kubeflow --set global.demoMode=true \
              -s templates/external-secrets/ClusterExternalSecret.yaml | grep -q '^  namespaceSelector:$' \
            || { echo "FAIL: the default ClusterExternalSecret no longer uses namespaceSelector." >&2; exit 1; }
          # The pre-delete hook renders only with the release's Profiles, which carry the labels it selects by.
          helm template ci ./kubeflow --kube-version "$KUBE_VERSION" -n kubeflow --set global.demoMode=true > "$tmp/full.yaml"
          [ "$(grep -c 'name: profiles-cleanup$' "$tmp/full.yaml")" -ge 2 ] || { echo "FAIL: the Profiles pre-delete hook is missing." >&2; exit 1; }
          python3 - "$tmp/full.yaml" <<'PY'
          import sys, yaml
          ps = [d for d in yaml.safe_load_all(open(sys.argv[1])) if d and d.get("kind") == "Profile"]
          bad = [p["metadata"]["name"] for p in ps if (p["metadata"].get("labels") or {}).get("app.kubernetes.io/instance") != "ci"]
          sys.exit(f"FAIL: Profiles without the release label the hook selects by: {bad}" if bad or not ps else 0)
          PY
          if helm template ci ./kubeflow --kube-version "$KUBE_VERSION" -n kubeflow -f kubeflow/presets/trainer-only.yaml | grep -q 'name: profiles-cleanup$'; then
            echo "FAIL: the Profiles pre-delete hook renders without Profiles (trainer-only)." >&2; exit 1
          fi
          echo "OK: credentials generate with cluster access, refuse offline and take the demo values in demoMode; external identity providers need no password; Dex wiring is checked; extraNamespaces and the uninstall hook render as intended."

      - name: helm template (hostname schema rejects bare public suffixes)
        if: ${{ env.APPCO_TOKEN != '' }}
        run: |
          set -euo pipefail
          # hostname is seeded verbatim into the letsEncrypt ClusterIssuer's DNS-01
          # dnsZones, so a bare public suffix ('com') would scope the ACME solver to
          # the ENTIRE TLD — the exact widening letsencrypt-ClusterIssuer.yaml's own
          # comment warns against. The schema `not` clause must reject bare TLDs and
          # '*' while still accepting single-label names, IPv4 literals, and FQDNs.
          # A plain "does it render" check would not notice the pattern regressing to
          # re-admit 'com', so assert the reject cases FAIL (and fail on the hostname
          # schema, not some unrelated error) and the accept cases still render.
          # Check BOTH entry points: the umbrella (validates parent + sub-chart
          # schema together) AND the sub-chart standalone (it is independently
          # installable, and the standalone path is the only one that guards the
          # sub-chart schema on its own — in the umbrella either schema's guard
          # masks a regression in the other).
          for bad in com COM io '*'; do
            if err="$(helm template ci ./kubeflow --kube-version "$KUBE_VERSION" --set global.demoMode=true \
                --set kubeflow-istio-resources.hostname="$bad" 2>&1)"; then
              echo "FAIL: umbrella accepted hostname='$bad' — a bare public suffix / wildcard must be rejected (it would widen the ACME solver scope / re-enable the auth bypass)." >&2
              exit 1
            fi
            grep -q 'hostname' <<<"$err" \
              || { echo "FAIL: umbrella rejected hostname='$bad', but not on the hostname schema — a different error is masking the guard. Got:" >&2
                   echo "$err" >&2; exit 1; }
            if err="$(helm template ci ./kubeflow/charts/kubeflow-istio-resources --kube-version "$KUBE_VERSION" \
                --set global.demoMode=true --set hostname="$bad" 2>&1)"; then
              echo "FAIL: sub-chart accepted hostname='$bad' standalone — the sub-chart schema guard has regressed." >&2
              exit 1
            fi
            grep -q 'hostname' <<<"$err" \
              || { echo "FAIL: sub-chart rejected hostname='$bad', but not on the hostname schema. Got:" >&2
                   echo "$err" >&2; exit 1; }
          done
          for good in kubeflow localhost 10.43.1.7 kf.example.com; do
            helm template ci ./kubeflow --kube-version "$KUBE_VERSION" --set global.demoMode=true \
              --set kubeflow-istio-resources.hostname="$good" >/dev/null 2>&1 \
              || { echo "FAIL: umbrella rejected hostname='$good' — a legit single-label name / IPv4 literal / FQDN must be accepted." >&2; exit 1; }
            helm template ci ./kubeflow/charts/kubeflow-istio-resources --kube-version "$KUBE_VERSION" \
              --set global.demoMode=true --set hostname="$good" >/dev/null 2>&1 \
              || { echo "FAIL: sub-chart rejected hostname='$good' standalone — a legit hostname must be accepted." >&2; exit 1; }
          done
          echo "OK: hostname schema (umbrella + sub-chart) rejects bare public suffixes and '*', accepts single-label / IPv4 / FQDN."
